<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Level | HanVerse</title>
<meta name="description" content="Take HanVerse's quick placement quiz and find out which YCT level is right for you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hanverse.css">
<link rel="icon" href="assets/mascot/hanpan-icon.png">
<script src="js/auth-fetch.js"></script>
<style>
:root{--blue:#2563EB;--coral:#F97316;--green:#16A34A;--bg:#F5F9FF;--card:#fff;--text:#1E3A5F;--muted:#5D7A9A;}
@media(prefers-color-scheme:dark){:root{--bg:#0F172A;--card:#1E293B;--text:#F1F5F9;--muted:#94A3B8;}}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Nunito,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:110px 20px;}
.container{width:100%;max-width:580px;}
.card{background:var(--card);border-radius:24px;padding:36px 28px;box-shadow:0 8px 32px rgba(0,0,0,.08);text-align:center;}

.panda{font-size:80px;margin-bottom:8px;}
h1{font-size:28px;font-weight:900;margin-bottom:6px;}
.sub{color:var(--muted);font-size:15px;margin-bottom:24px;}

.progress-bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:28px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--coral));border-radius:99px;transition:width .4s ease;}

.q-num{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--coral);margin-bottom:10px;}
.q-text{font-size:20px;font-weight:800;margin-bottom:6px;}
.q-hanzi{font-family:'Noto Sans SC',sans-serif;font-size:42px;font-weight:700;color:var(--blue);margin:12px 0 18px;}

.options{display:grid;gap:12px;margin-bottom:8px;}
.opt-btn{padding:14px 20px;border:2px solid rgba(37,99,235,.15);border-radius:14px;background:var(--card);font:700 16px Nunito,sans-serif;color:var(--text);cursor:pointer;transition:all .2s;}
.opt-btn:hover{border-color:var(--blue);background:rgba(37,99,235,.06);}
.opt-btn.correct{border-color:var(--green);background:rgba(22,163,74,.12);color:var(--green);}
.opt-btn.wrong{border-color:#EF4444;background:rgba(239,68,68,.08);color:#EF4444;}
.opt-btn:disabled{cursor:default;opacity:.7;}

.result{text-align:center;}
.result .level-badge{display:inline-flex;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--coral));color:#fff;font-size:36px;font-weight:900;margin:16px 0;}
.result h2{font-size:26px;margin-bottom:8px;}
.result .rec{font-size:16px;color:var(--muted);margin-bottom:24px;}
.result .locked-note{margin:-12px auto 20px;max-width:420px;background:var(--blue-50);border:1px solid var(--blue-mid);border-radius:14px;padding:10px 14px;font-size:.8rem;color:var(--blue);}
.result .score-detail{font-size:14px;color:var(--muted);margin-bottom:20px;}
.btn-primary{display:inline-block;padding:14px 36px;background:var(--blue);color:#fff;border:none;border-radius:14px;font:800 16px Nunito,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s;}
.btn-primary:hover{transform:scale(1.03);}
.btn-ghost{display:inline-block;padding:12px 24px;background:none;border:2px solid var(--blue);color:var(--blue);border-radius:14px;font:700 15px Nunito,sans-serif;cursor:pointer;text-decoration:none;margin-left:10px;}

.intro-features{text-align:left;margin:20px 0;display:grid;gap:10px;}
.intro-features div{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;}
.intro-features span{font-size:22px;}

@media(max-width:500px){.card{padding:24px 18px;border-radius:18px;} h1{font-size:22px;} .q-hanzi{font-size:34px;} .result .level-badge{width:100px;height:100px;font-size:30px;}}
</style>
</head>
<body>
<div id="app-nav"></div>
<div class="container">
<div class="card" id="card"></div>
</div>
<script>
const QUESTIONS = [
  { level:1, hanzi:"你好", prompt:"What does this mean?", options:["Hello","Goodbye","Thank you","Sorry"], answer:0 },
  { level:1, hanzi:"谢谢", prompt:"What does this mean?", options:["Sorry","Please","Thank you","Hello"], answer:2 },
  { level:1, hanzi:"再见", prompt:"What does this mean?", options:["Good morning","See you","Welcome","Excuse me"], answer:1 },
  { level:2, hanzi:"七", prompt:"Which number is this?", options:["3","5","7","9"], answer:2 },
  { level:2, hanzi:"红色", prompt:"Which colour is this?", options:["Blue","Green","Yellow","Red"], answer:3 },
  { level:2, hanzi:"妈妈", prompt:"Who is this?", options:["Father","Mother","Sister","Teacher"], answer:1 },
  { level:3, hanzi:"我喜欢吃米饭", prompt:"What does this sentence mean?", options:["I want to drink water","I like to eat rice","I go to school","I have a cat"], answer:1 },
  { level:3, hanzi:"今天星期几？", prompt:"What is this question asking?", options:["What time is it?","How old are you?","What day is it today?","Where are you going?"], answer:2 },
  { level:4, hanzi:"请问，图书馆在哪里？", prompt:"What is being asked?", options:["Where is the library?","What is your name?","How much does this cost?","When does school start?"], answer:0 },
  { level:4, hanzi:"他每天早上六点起床", prompt:"What does this sentence say?", options:["He likes to play every day","He eats breakfast at 7","He wakes up at 6 every morning","He goes to school by bus"], answer:2 }
];

let current = 0, correct = 0, answers = [], answered = false;
const $ = id => document.getElementById(id);
const card = $("card");

function renderIntro() {
  const first = new URLSearchParams(location.search).get("first") === "1";
  card.innerHTML = `
    <div class="panda">🐼</div>
    <h1>${first ? "Welcome to HanVerse!" : "Find Your Level"}</h1>
    <p class="sub">${first
      ? "Let's do this first: answer 10 quick questions and HanPan will set your perfect starting level."
      : "Answer 10 quick questions and HanPan will recommend the perfect YCT level for you."}</p>
    <div class="intro-features">
      <div><span>⏱</span> Takes about 2 minutes</div>
      <div><span>🎯</span> Covers YCT levels 1–4</div>
      <div><span>📊</span> Get a personalised recommendation</div>
      <div><span>🏆</span> Earn the "Level Placed" achievement</div>
    </div>
    <button class="btn-primary" onclick="startQuiz()" style="margin-top:18px;width:100%;">${first ? "Set My Level" : "Start the Quiz"}</button>
    <a href="${first ? "learn.html" : "index.html"}" style="display:block;margin-top:14px;font-size:14px;color:var(--muted);text-decoration:none;">${first ? "Skip for now →" : "← Back to Home"}</a>`;
}

function renderQuestion() {
  const q = QUESTIONS[current];
  const pct = Math.round((current / QUESTIONS.length) * 100);
  card.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-num">QUESTION ${current + 1} OF ${QUESTIONS.length}  ·  YCT ${q.level}</div>
    <div class="q-text">${q.prompt}</div>
    <div class="q-hanzi">${q.hanzi}</div>
    <div class="options" id="opts">${q.options.map((o, i) => `<button class="opt-btn" data-i="${i}">${o}</button>`).join("")}</div>`;
  answered = false;
  $("opts").querySelectorAll(".opt-btn").forEach(btn => {
    btn.onclick = () => pickAnswer(Number(btn.dataset.i));
  });
}

function pickAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const isCorrect = idx === q.answer;
  if (isCorrect) correct++;
  answers.push({ question: current, picked: idx, correct: q.answer, isCorrect });
  const btns = $("opts").querySelectorAll(".opt-btn");
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add("correct");
    if (i === idx && !isCorrect) b.classList.add("wrong");
  });
  setTimeout(() => { current++; current < QUESTIONS.length ? renderQuestion() : submitAndShowResult(); }, 900);
}

async function submitAndShowResult() {
  const pct = correct / QUESTIONS.length;
  const level = pct >= 0.9 ? 4 : pct >= 0.7 ? 3 : pct >= 0.4 ? 2 : 1;
  const labels = { 1: "YCT 1 — Beginner", 2: "YCT 2 — Elementary", 3: "YCT 3 — Intermediate", 4: "YCT 4 — Advanced" };
  const msgs = { 1: "Start from the basics — HanPan will guide you step by step!", 2: "You know some Chinese already! Let's build on that.", 3: "Nice skills! You're ready for more complex sentences.", 4: "Impressive! You're ready for the hardest YCT challenges." };

  card.innerHTML = `
    <div class="result">
      <div class="panda">🎉</div>
      <h2>Your Level — Locked In!</h2>
      <div class="level-badge">YCT ${level}</div>
      <p style="font-size:18px;font-weight:800;margin-bottom:4px;">${labels[level]}</p>
      <p class="rec">${msgs[level]}</p>
      <p class="score-detail">You got ${correct} out of ${QUESTIONS.length} correct (${Math.round(pct*100)}%)</p>
      <div class="locked-note">🔒 Your level is saved to your account. Want to jump levels? The <strong>End-of-Year Exam</strong> is coming soon!</div>
      <a class="btn-primary" href="learn.html${new URLSearchParams(location.search).get("first") === "1" ? "?placed=1" : ""}">Start Learning →</a>
      <button class="btn-ghost" onclick="current=0;correct=0;answers=[];renderIntro();">Retake Quiz</button>
    </div>`;

  try {
    const user = JSON.parse(localStorage.getItem("hanverse_user") || "{}");
    if (user.user_id && window.HanVerseFeatures) {
      const saved = await window.HanVerseFeatures.placement.submit(user.user_id, correct, QUESTIONS.length, answers);
      if (saved && saved.savedLevel) {
        user.current_yct = saved.savedLevel;
        user.level = saved.savedLevel;
        localStorage.setItem("hanverse_user", JSON.stringify(user));
      }
    }
  } catch (e) { console.warn("placement save:", e.message); }
}

function startQuiz() { current = 0; correct = 0; answers = []; renderQuestion(); }
renderIntro();
</script>
<script src="features-client.js"></script>
<script src="shared-nav.js"></script>
<script src="hanverse.js"></script>
<script src="nav-user.js"></script>
<script src="notifications-client.js"></script>
<script src="bottom-nav.js"></script>
</body>
</html>
