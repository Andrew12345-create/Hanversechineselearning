<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#E63946"
    >

    <title>HanVerse Lesson</title>

    <style>
        :root {
            --red: #E63946;
            --red-dark: #C92F3B;
            --yellow: #F4D35E;
            --blue: #4EA8DE;
            --green: #74C69D;

            --cream: #FFFDF7;
            --white: #FFFFFF;
            --text: #263238;
            --muted: #718096;
            --border: #E8E4DB;

            --radius: 22px;
            --shadow:
                0 14px 40px rgba(38, 50, 56, 0.09);

            --safe-bottom:
                env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 5% 0%,
                    rgba(244, 211, 94, .18),
                    transparent 350px
                ),
                radial-gradient(
                    circle at 100% 20%,
                    rgba(78, 168, 222, .12),
                    transparent 380px
                ),
                var(--cream);

            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
        }

        img,
        video {
            max-width: 100%;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;

            background:
                rgba(255, 253, 247, .92);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid rgba(232, 228, 219, .8);
        }

        .nav-inner {
            width:
                min(calc(100% - 28px), 1120px);

            min-height: 66px;

            margin: auto;

            display: flex;
            align-items: center;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;

            font-weight: 950;
            letter-spacing: -.04em;

            text-decoration: none;
            color: var(--text);
        }

        .brand-logo {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background: white;

            border:
                1px solid var(--border);

            box-shadow:
                0 5px 18px rgba(0,0,0,.06);
        }

        .brand-name span {
            color: var(--red);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
        }

        .nav-link {
            padding: 9px 12px;

            border-radius: 11px;

            text-decoration: none;

            color: var(--muted);

            font-size: .8rem;
            font-weight: 850;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #F4F0E8;
            color: var(--text);
        }

        .nav-profile {
            padding: 9px 13px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background: white;

            font-size: .76rem;
            font-weight: 850;

            text-decoration: none;
        }

        .mobile-menu-button {
            display: none;

            margin-left: auto;

            width: 42px;
            height: 42px;

            border:
                1px solid var(--border);

            border-radius: 13px;

            background: white;
        }

        .mobile-menu {
            display: none;

            padding:
                10px
                14px
                16px;

            border-top:
                1px solid var(--border);
        }

        .mobile-menu.open {
            display: grid;
            gap: 5px;
        }

        .mobile-menu a {
            padding: 13px;

            border-radius: 13px;

            text-decoration: none;

            font-weight: 850;
        }

        .mobile-menu a:hover {
            background: #F4F0E8;
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            width:
                min(calc(100% - 28px), 1050px);

            margin: auto;

            padding:
                28px
                0
                calc(130px + var(--safe-bottom));
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: end;

            gap: 20px;

            margin-bottom: 18px;
        }

        .eyebrow {
            color: var(--red);

            font-size: .68rem;
            font-weight: 950;

            text-transform: uppercase;
            letter-spacing: .13em;
        }

        #lessonTitle {
            margin: 7px 0;

            font-size:
                clamp(1.75rem, 5vw, 2.7rem);

            line-height: 1.05;

            letter-spacing: -.055em;
        }

        #lessonDescription {
            margin: 0;

            max-width: 680px;

            color: var(--muted);

            font-size: .9rem;

            line-height: 1.65;
        }

        .xp-badge {
            flex-shrink: 0;

            padding: 10px 15px;

            border-radius: 999px;

            background: white;

            border:
                1px solid var(--border);

            box-shadow:
                0 6px 20px rgba(0,0,0,.05);

            font-size: .8rem;
            font-weight: 950;
        }

        /* =====================================================
           PROGRESS
        ===================================================== */

        .progress-card {
            padding: 14px 16px;

            margin-bottom: 16px;

            background: white;

            border:
                1px solid var(--border);

            border-radius: 18px;

            box-shadow:
                0 6px 22px rgba(0,0,0,.05);
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-track {
            flex: 1;

            height: 10px;

            overflow: hidden;

            border-radius: 999px;

            background: #EEEAE1;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--red),
                    #F06A74
                );

            transition:
                width .45s cubic-bezier(.22,.8,.25,1);
        }

        .progress-number {
            min-width: 42px;

            text-align: right;

            font-size: .72rem;
            font-weight: 950;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;

            margin-top: 9px;
        }

        .meta span {
            padding: 5px 9px;

            border-radius: 999px;

            background: #F7F4ED;

            color: var(--muted);

            font-size: .65rem;
            font-weight: 900;
        }

        /* =====================================================
           LESSON CONTAINER
        ===================================================== */

        .lesson-container {
            overflow: hidden;

            background: white;

            border:
                1px solid var(--border);

            border-radius: 27px;

            box-shadow: var(--shadow);
        }

        .lesson-stage {
            min-height: 580px;

            padding:
                42px
                32px
                35px;

            display: grid;
            place-items: center;
        }

        .lesson-content {
            width: min(100%, 760px);

            animation:
                enter .35s ease both;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform:
                    translateY(12px)
                    scale(.985);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* =====================================================
           GENERIC CONTENT
        ===================================================== */

        .section-kicker {
            color: var(--red);

            font-size: .68rem;
            font-weight: 950;

            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .section-title {
            margin:
                8px
                0
                9px;

            font-size:
                clamp(1.55rem, 4vw, 2.25rem);

            letter-spacing: -.045em;
        }

        .section-description {
            color: var(--muted);

            line-height: 1.65;
        }

        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {
            text-align: center;
        }

        .mascot {
            width: 120px;
            height: 120px;

            margin:
                0
                auto
                20px;

            display: grid;
            place-items: center;

            border-radius: 35px;

            background:
                linear-gradient(
                    145deg,
                    #FFF8DF,
                    white
                );

            border:
                2px solid #F2E5B2;

            font-size: 4rem;

            box-shadow:
                0 15px 35px rgba(244,211,94,.22);

            animation:
                float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        /* =====================================================
           OBJECTIVES
        ===================================================== */

        .objectives {
            display: grid;
            gap: 10px;

            margin-top: 25px;
        }

        .objective {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 14px;

            border:
                1px solid var(--border);

            border-radius: 16px;

            background: #FFFEFB;
        }

        .objective-icon {
            width: 36px;
            height: 36px;

            flex: 0 0 36px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background: #EEF8F2;
        }

        .objective-text {
            font-size: .82rem;
            font-weight: 800;
        }

        /* =====================================================
           VOCABULARY
        ===================================================== */

        .vocabulary-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 12px;

            margin-top: 24px;
        }

        .vocabulary-card {
            padding: 19px;

            border:
                1px solid var(--border);

            border-radius: 20px;

            background: #FFFEFB;

            transition:
                transform .18s ease,
                box-shadow .18s ease;
        }

        .vocabulary-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(0,0,0,.07);
        }

        .hanzi {
            margin-top: 7px;

            font-family:
                "Noto Sans CJK SC",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;

            font-size: 2.2rem;
            font-weight: 950;
        }

        .pinyin {
            margin-top: 5px;

            color: var(--red);

            font-size: .82rem;
            font-weight: 900;
        }

        .meaning {
            margin-top: 4px;

            color: var(--muted);

            font-size: .76rem;
        }

        .listen-button {
            margin-top: 12px;

            min-height: 36px;

            padding:
                0
                12px;

            border:
                1px solid var(--border);

            border-radius: 11px;

            background: white;

            font-size: .72rem;
            font-weight: 900;
        }

        /* =====================================================
           MEDIA
        ===================================================== */

        .media-card {
            margin-top: 20px;

            overflow: hidden;

            border-radius: 19px;

            border:
                1px solid var(--border);

            background: #F7F4ED;
        }

        .media-card img,
        .media-card video {
            display: block;

            width: 100%;
            height: auto;
        }

        .media-caption {
            padding: 12px 14px;

            color: var(--muted);

            font-size: .74rem;
        }

        audio {
            width: 100%;
        }

        /* =====================================================
           CONTENT BLOCKS
        ===================================================== */

        .content-block {
            margin-top: 13px;

            padding: 19px;

            border:
                1px solid var(--border);

            border-radius: 18px;

            background: #FFFEFB;
        }

        .content-block h3 {
            margin:
                0
                0
                8px;

            font-size: 1rem;
        }

        .content-block p {
            margin: 0;

            color: var(--muted);

            line-height: 1.7;
        }

        /* =====================================================
           EXAMPLES
        ===================================================== */

        .examples {
            display: grid;
            gap: 11px;

            margin-top: 22px;
        }

        .example {
            display: grid;

            grid-template-columns:
                auto
                1fr;

            gap: 13px;

            padding: 16px;

            border-radius: 18px;

            background: #F8FBFE;

            border:
                1px solid #E3EEF5;
        }

        .speaker {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            background: white;

            border:
                1px solid var(--border);
        }

        .example-chinese {
            font-family:
                "Noto Sans CJK SC",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;

            font-size: 1.35rem;
            font-weight: 950;
        }

        .example-pinyin {
            margin-top: 3px;

            color: var(--red);

            font-size: .76rem;
            font-weight: 850;
        }

        .example-english {
            margin-top: 3px;

            color: var(--muted);

            font-size: .76rem;
        }

        /* =====================================================
           QUIZ
        ===================================================== */

        .quiz {
            width: min(100%, 650px);

            margin: auto;
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;

            color: var(--muted);

            font-size: .72rem;
            font-weight: 900;
        }

        .question {
            margin:
                23px
                0;

            text-align: center;

            font-size:
                clamp(1.3rem, 4vw, 1.8rem);

            line-height: 1.35;

            font-weight: 950;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option {
            width: 100%;

            padding: 16px;

            text-align: left;

            border:
                2px solid var(--border);

            border-radius: 16px;

            background: white;

            font-weight: 850;

            transition:
                transform .15s ease,
                border-color .15s ease;
        }

        .option:hover:not(:disabled) {
            transform: translateY(-1px);
            border-color: #CFC6B5;
        }

        .option.correct {
            border-color: var(--green);
            background: #EEF9F3;
        }

        .option.wrong {
            border-color: #E88D96;
            background: #FFF2F3;
        }

        .feedback {
            margin-top: 12px;

            padding: 12px;

            border-radius: 13px;

            font-size: .77rem;
            font-weight: 850;
        }

        .feedback.good {
            background: #EEF9F3;
            color: #27724E;
        }

        .feedback.bad {
            background: #FFF1F2;
            color: #A8323D;
        }

        /* =====================================================
           COMPLETE
        ===================================================== */

        .complete {
            text-align: center;
        }

        .complete-icon {
            width: 110px;
            height: 110px;

            margin:
                0
                auto
                18px;

            display: grid;
            place-items: center;

            border-radius: 34px;

            background: #FFF8DF;

            border:
                2px solid #F2E5B2;

            font-size: 4rem;

            animation:
                pop .55s cubic-bezier(.17,.89,.32,1.3);
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.65);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .rewards {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin:
                24px
                0;
        }

        .reward {
            padding: 16px 10px;

            border:
                1px solid var(--border);

            border-radius: 16px;

            background: #FFFEFB;
        }

        .reward strong {
            display: block;
            font-size: 1.15rem;
        }

        .reward span {
            display: block;

            margin-top: 4px;

            color: var(--muted);

            font-size: .67rem;
            font-weight: 800;
        }

        /* =====================================================
           CONTROLS
        ===================================================== */

        .controls {
            position: sticky;
            bottom: 0;
            z-index: 50;

            display: grid;

            grid-template-columns:
                auto
                1fr
                auto;

            align-items: center;

            gap: 14px;

            padding:
                14px
                20px
                calc(14px + var(--safe-bottom));

            background:
                rgba(255,255,255,.96);

            backdrop-filter: blur(15px);

            border-top:
                1px solid var(--border);
        }

        .button {
            min-height: 45px;

            padding:
                0
                17px;

            border-radius: 14px;

            border: 0;

            font-size: .8rem;
            font-weight: 900;

            transition:
                transform .15s ease,
                background .15s ease;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .button.primary {
            background: var(--red);
            color: white;

            box-shadow:
                0 7px 18px rgba(230,57,70,.2);
        }

        .button.primary:hover:not(:disabled) {
            background: var(--red-dark);
        }

        .button.secondary {
            background: white;
            color: var(--text);

            border:
                1px solid var(--border);
        }

        .counter {
            text-align: center;

            color: var(--muted);

            font-size: .7rem;
            font-weight: 900;
        }

        /* =====================================================
           STATES
        ===================================================== */

        .state {
            min-height: 460px;

            display: grid;

            place-items: center;

            align-content: center;

            gap: 11px;

            text-align: center;

            color: var(--muted);
        }

        .spinner {
            width: 40px;
            height: 40px;

            border:
                4px solid #EEEAE1;

            border-top-color:
                var(--red);

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .error-icon {
            font-size: 3rem;
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast-area {
            position: fixed;

            right: 16px;
            bottom:
                calc(
                    82px +
                    var(--safe-bottom)
                );

            z-index: 500;

            width:
                min(
                    360px,
                    calc(100% - 32px)
                );
        }

        .toast {
            margin-top: 8px;

            padding: 13px 15px;

            border-radius: 14px;

            background: #263238;

            color: white;

            font-size: .75rem;
            font-weight: 850;

            box-shadow: var(--shadow);

            animation:
                toastIn .25s ease both;
        }

        .toast.success {
            background: #267A56;
        }

        .toast.error {
            background: #B63441;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {
            .nav-links,
            .nav-profile {
                display: none;
            }

            .mobile-menu-button {
                display: block;
            }

            .lesson-header {
                align-items: start;

                flex-direction: column;
            }

            .xp-badge {
                align-self: flex-start;
            }
        }

        @media (max-width: 640px) {
            .page {
                width:
                    min(
                        calc(100% - 18px),
                        1050px
                    );

                padding-top: 19px;
            }

            .lesson-stage {
                min-height: 560px;

                padding:
                    28px
                    14px
                    22px;
            }

            .lesson-container {
                border-radius: 22px;
            }

            .rewards {
                grid-template-columns:
                    1fr
                    1fr;
            }

            .reward:last-child {
                grid-column: 1 / -1;
            }

            .controls {
                grid-template-columns:
                    1fr
                    1fr;

                padding-left: 11px;
                padding-right: 11px;
            }

            .counter {
                display: none;
            }

            .controls .button {
                width: 100%;
            }
        }

        @media (max-width: 390px) {
            .lesson-stage {
                padding-left: 11px;
                padding-right: 11px;
            }

            .rewards {
                grid-template-columns: 1fr;
            }

            .reward:last-child {
                grid-column: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <nav class="nav-inner">

        <a
            href="index.html"
            class="brand"
        >
            <span class="brand-logo">🐼</span>

            <span class="brand-name">
                Han<span>Verse</span>
            </span>
        </a>

        <div
            class="nav-links"
            id="navLinks"
        ></div>

        <a
            id="profileLink"
            class="nav-profile"
            href="profile.html"
        >
            👤 Profile
        </a>

        <button
            id="mobileMenuButton"
            class="mobile-menu-button"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

    </nav>

    <div
        id="mobileMenu"
        class="mobile-menu"
    ></div>

</header>


<!-- =========================================================
     PAGE
========================================================= -->

<main class="page">

    <section class="lesson-header">

        <div>

            <div class="eyebrow">
                🐼 HanVerse Learning
            </div>

            <h1 id="lessonTitle">
                Loading…
            </h1>

            <p id="lessonDescription">
                Getting your lesson ready.
            </p>

        </div>

        <div class="xp-badge">
            ⭐ <span id="lessonXP">0</span> XP
        </div>

    </section>


    <!-- =====================================================
         PROGRESS
    ===================================================== -->

    <section class="progress-card">

        <div class="progress-row">

            <div class="progress-track">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

            <span
                id="progressNumber"
                class="progress-number"
            >
                0%
            </span>

        </div>

        <div class="meta">

            <span id="lessonLevel">
                Loading level…
            </span>

            <span id="activityName">
                Preparing…
            </span>

            <span>
                ☁️ Database content
            </span>

        </div>

    </section>


    <!-- =====================================================
         LESSON
    ===================================================== -->

    <section class="lesson-container">

        <div
            id="lessonStage"
            class="lesson-stage"
        >

            <div
                id="loadingState"
                class="state"
            >

                <div class="spinner"></div>

                <strong>
                    Loading your lesson…
                </strong>

                <span>
                    Han is getting everything ready.
                </span>

            </div>


            <div
                id="errorState"
                class="state hidden"
            >

                <div class="error-icon">
                    😕

<script>
"use strict";

/*
================================================================
HANVERSE DATABASE-DRIVEN LESSON ENGINE
================================================================

IMPORTANT:

This file contains ZERO lesson curriculum.

It does NOT contain:

- Lesson titles
- Vocabulary
- Objectives
- Dialogues
- Quiz questions
- Answers
- Audio URLs
- Image URLs
- Video URLs

All of those come from the database through:

    GET /api/lessons/:lessonId

Example:

    /api/lessons/lesson_1


The backend should assemble:

    lessons
    lesson_objectives
    lesson_vocabulary
    lesson_content
    lesson_examples
    lesson_quiz_questions
    lesson_quiz_options
    lesson_completion_settings


The frontend then renders whatever is returned.

This means you can add/edit lesson content in Neon
without changing lesson.html.
================================================================
*/


/* =============================================================
   STATE
============================================================= */

const state = {

    user: null,

    lesson: null,

    lessonId: null,

    activities: [],

    currentActivity: 0,

    quizIndex: 0,

    answers: {},

    score: 0,

    startedAt: Date.now(),

    completed: false,

    saving: false
};


/* =============================================================
   HELPERS
============================================================= */

const $ = id =>
    document.getElementById(id);


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value ?? "");

    return div.innerHTML;
}


function escapeAttribute(value) {

    return escapeHTML(value)
        .replace(/"/g, "&quot;");
}


/* =============================================================
   API
============================================================= */

async function apiRequest(
    path,
    options = {}
) {

    const url =
        "/api/" +
        String(path)
            .replace(/^\/+/, "");

    const response =
        await fetch(
            url,
            {
                credentials: "include",
                cache: "no-store",

                ...options,

                headers: {
                    Accept:
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );


    const raw =
        await response.text();

    let data;

    try {

        data =
            raw
                ? JSON.parse(raw)
                : null;

    } catch {

        const error =
            new Error(
                `Server returned invalid JSON (HTTP ${response.status}).`
            );

        error.status =
            response.status;

        throw error;
    }


    if (!response.ok) {

        const error =
            new Error(
                data?.error ||
                data?.message ||
                `Request failed (HTTP ${response.status}).`
            );

        error.status =
            response.status;

        error.data =
            data;

        throw error;
    }


    return data;
}


function getJSON(path) {

    return apiRequest(
        path,
        {
            method: "GET"
        }
    );
}


function postJSON(
    path,
    body
) {

    return apiRequest(
        path,
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(body)
        }
    );
}


/* =============================================================
   URL
============================================================= */

function getRequestedLessonId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return String(
        params.get("id") ||
        params.get("lessonId") ||
        "lesson_1"
    ).trim();
}


function normaliseLessonId(value) {

    const raw =
        String(value || "")
            .trim();

    if (
        /^lesson_\d+$/i.test(raw)
    ) {

        return raw;
    }


    const match =
        raw.match(/(\d+)$/);

    if (match) {

        return `lesson_${match[1]}`;
    }


    return "";
}


function lessonNumber(lessonId) {

    const match =
        String(lessonId)
            .match(/(\d+)$/);

    return match
        ? Number(match[1])
        : null;
}


/* =============================================================
   USER
============================================================= */

function readUser() {

    const keys = [
        "hanverse_user",
        "hanverse_session",
        "currentUser",
        "authUser",
        "user",
        "session"
    ];


    for (const key of keys) {

        try {

            const raw =
                localStorage.getItem(key);

            if (!raw) continue;

            const parsed =
                JSON.parse(raw);

            const candidates = [
                parsed?.user,
                parsed?.data?.user,
                parsed?.data,
                parsed,
            ];


            for (
                const candidate
                of candidates
            ) {

                if (
                    candidate &&
                    typeof candidate ===
                        "object" &&
                    getUserId(candidate)
                ) {

                    return candidate;
                }
            }

        } catch {
            // Ignore malformed local storage.
        }
    }


    return null;
}


function getUserId(user = state.user) {

    const id =
        user?.user_id ??
        user?.userId ??
        user?.id;

    const number =
        Number(id);

    return Number.isFinite(number) &&
        number > 0
        ? number
        : null;
}


function getUserName() {

    return (
        state.user?.full_name ||
        state.user?.fullName ||
        state.user?.username ||
        state.user?.name ||
        "Learner"
    );
}


/* =============================================================
   NAVBAR
============================================================= */

function renderNavbar() {

    const links =
        [
            ["Home", "index.html"],
            ["Learn", "learn.html"],
            ["Roadmap", "roadmap.html"],
            ["Worksheets", "worksheets.html"]
        ];


    const desktop =
        $("navLinks");

    const mobile =
        $("mobileMenu");


    desktop.innerHTML = "";

    mobile.innerHTML = "";


    links.forEach(
        ([label, href]) => {

            const desktopLink =
                document.createElement("a");

            desktopLink.className =
                "nav-link";

            desktopLink.href =
                href;

            desktopLink.textContent =
                label;

            if (
                label === "Learn"
            ) {

                desktopLink.classList
                    .add("active");
            }

            desktop.appendChild(
                desktopLink
            );


            const mobileLink =
                document.createElement("a");

            mobileLink.href =
                href;

            mobileLink.textContent =
                label;

            mobile.appendChild(
                mobileLink
            );
        }
    );


    $("profileLink").textContent =
        `👤 ${getUserName()}`;
}


/* =============================================================
   NORMALISE DATABASE RESPONSE
============================================================= */

function array(value) {

    if (Array.isArray(value)) return value;

    if (typeof value === "string") {
        try {
            const parsed = JSON.parse(value);
            return Array.isArray(parsed) ? parsed : [];
        } catch {
            return [];
        }
    }

    return [];
}


function normaliseLesson(data) {

    const lesson =
        data?.lesson ||
        data?.data?.lesson ||
        data?.data ||
        data;


    if (
        !lesson ||
        typeof lesson !== "object"
    ) {

        throw new Error(
            "The lesson API returned no lesson."
        );
    }


    /*
     * Accept both possible API designs:
     *
     * {
     *   lesson: {...},
     *   objectives: [...]
     * }
     *
     * OR
     *
     * {
     *   lesson: {
     *      objectives: [...]
     *   }
     * }
     */

    return {

        ...lesson,

        lesson_id:
            String(
                lesson.lesson_id ||
                lesson.lessonId ||
                lesson.id ||
                state.lessonId
            ),


        title:
            lesson.title ||
            "Untitled Lesson",


        description:
            lesson.description ||
            lesson.short_description ||
            "",


        level:
            Number(
                lesson.level ||
                lesson.course_level ||
                1
            ),


        xp:
            Number(
                lesson.xp ||
                lesson.completion_xp ||
                0
            ),


        objectives:
            data?.objectives ||
            data?.data?.objectives ||
            lesson.objectives ||
            [],


        vocabulary:
            data?.vocabulary ||
            data?.data?.vocabulary ||
            lesson.vocabulary ||
            [],


        content:
            data?.content ||
            data?.data?.content ||
            lesson.content ||
            [],


        examples:
            data?.examples ||
            data?.data?.examples ||
            lesson.examples ||
            [],


        media:
            data?.media ||
            data?.data?.media ||
            lesson.media ||
            [],


        quiz:
            data?.quiz ||
            data?.data?.quiz ||
            lesson.quiz ||
            [],


        completion_settings:
            data?.completion_settings ||
            data?.data?.completion_settings ||
            lesson.completion_settings ||
            {}
    };
}


/* =============================================================
   FETCH LESSON FROM DATABASE
============================================================= */

async function fetchLesson() {

    const requested =
        getRequestedLessonId();


    const id =
        normaliseLessonId(
            requested
        );


    if (!id) {

        throw new Error(
            "Invalid lesson ID."
        );
    }


    state.lessonId =
        id;


    /*
     * THIS IS THE ONLY LESSON CONTENT REQUEST.
     *
     * No lesson content is stored in this HTML.
     */

    /*
     * Learner endpoint.
     *
     * The lesson page reads ONLY from the API. The API must return
     * the lesson row plus its related content/media.
     */
    const data =
        await getJSON(
            `lessons/${encodeURIComponent(id)}`
        );


    return normaliseLesson(data);
}


/* =============================================================
   BUILD ACTIVITIES AUTOMATICALLY
============================================================= */

function buildActivities() {

    const lesson =
        state.lesson;

    const activities = [];


    /*
     * These are not hard-coded lessons.
     *
     * They are renderers for whichever DB collections exist.
     */

    activities.push({
        type: "welcome"
    });


    if (
        array(
            lesson.objectives
        ).length
    ) {

        activities.push({
            type: "objectives"
        });
    }


    if (
        array(
            lesson.vocabulary
        ).length
    ) {

        activities.push({
            type: "vocabulary"
        });
    }


    if (
        array(
            lesson.content
        ).length
    ) {

        activities.push({
            type: "content"
        });
    }


    if (
        array(
            lesson.examples
        ).length
    ) {

        activities.push({
            type: "examples"
        });
    }


    /*
     * Media is also automatically recognised.
     */

    if (
        array(
            lesson.media
        ).length
    ) {

        activities.push({
            type: "media"
        });
    }


    if (
        array(
            lesson.quiz
        ).length
    ) {

        activities.push({
            type: "quiz"
        });
    }


    activities.push({
        type: "complete"
    });


    return activities;
}


/* =============================================================
   MEDIA
============================================================= */

function mediaType(item) {

    const explicit =
        String(
            item?.media_type ||
            item?.type ||
            ""
        ).toLowerCase();


    if (
        [
            "image",
            "video",
            "audio"
        ].includes(explicit)
    ) {

        return explicit;
    }


    const url =
        String(
            item?.url ||
            item?.media_url ||
            item?.src ||
            ""
        ).toLowerCase();


    if (
        /\.(jpg|jpeg|png|gif|webp|svg)(\?|$)/
            .test(url)
    ) {

        return "image";
    }


    if (
        /\.(mp4|webm|mov)(\?|$)/
            .test(url)
    ) {

        return "video";
    }


    if (
        /\.(mp3|wav|ogg|m4a)(\?|$)/
            .test(url)
    ) {

        return "audio";
    }


    return explicit || "image";
}


function renderMediaItem(item) {

    const type =
        mediaType(item);

    const url =
        item?.url ||
        item?.media_url ||
        item?.src;


    if (!url) return "";


    const title =
        item?.title ||
        "";


    const caption =
        item?.caption ||
        item?.description ||
        "";


    let media = "";


    if (type === "image") {

        media = `
            <img
                src="${escapeAttribute(url)}"
                alt="${escapeAttribute(
                    item?.alt ||
                    title ||
                    "Lesson image"
                )}"
                loading="lazy"
            >
        `;
    }


    if (type === "video") {

        media = `
            <video
                controls
                playsinline
                preload="metadata"
            >
                <source
                    src="${escapeAttribute(url)}"
                >
            </video>
        `;
    }


    if (type === "audio") {

        media = `
            <audio
                controls
                preload="metadata"
            >
                <source
                    src="${escapeAttribute(url)}"
            >
        `;
    }


    return `
        <div class="media-card">

            ${title
                ? `
                    <div
                        class="media-caption"
                    >
                        <strong>
                            ${escapeHTML(title)}
                        </strong>
                    </div>
                `
                : ""
            }

            ${media}

            ${caption
                ? `
                    <div
                        class="media-caption"
                    >
                        ${escapeHTML(caption)}
                    </div>
                `
                : ""
            }

        </div>
    `;
}


/* =============================================================
   RENDER WELCOME
============================================================= */

function renderWelcome() {

        <div class="welcome">

   OBJECTIVES

            </div>

                                );

                                    ${escapeHTML(

                                    )}
                                </div>

                                <div class="objective-text">

                                </div>

/* =============================================================
   VOCABULARY
============================================================= */

function renderVocabulary() {

        <div>

            <div class="section-kicker">

            </div>

                            <article

                            >

                                <div>
                                    ${escapeHTML(
                                        word.icon ||

                                        "🀄"

                                </div>


                                <div class="hanzi">
                                    ${escapeHTML(

                                </div>

                                        pinyin
                                    )}

                                <div class="meaning">

                                </div>


                                ${
                                    audio

                                            <audio
                                                controls

                                                    margin-top:12px;
                                                "
                                            >
                                                <source
                                                    src="${escapeAttribute(
                                                        audio
                                                    )}"
                                                >
                                            </audio>
                                        `
                                        : chinese
                                            ? `
                                                <button
                                                    class="listen-button"
                                                    type="button"
                                                    data-speak="${escapeAttribute(
                                                        chinese
                                                    )}"
                                                >
                                                    🔊 Listen
                                                </button>
                                            `
                                            : ""
                                }

                            </article>

                        `;
                    }
                ).join("")}

            </div>

        </div>

    `;
}

   CONTENT

function renderContent() {

            </div>

/* =============================================================
   QUIZ
============================================================= */

function quizQuestions() {

    return array(
        state.lesson.quiz
    );
}


function getQuestionOptions(question) {

    return array(
        question.options ||
        question.answers
    );
}


function getCorrectAnswer(question) {

    const options =
        getQuestionOptions(
            question
        );


    if (
        typeof question.correct_index ===
            "number"
    ) {

        return question.correct_index;
    }


    if (
        typeof question.correctIndex ===
            "number"
    ) {

        return question.correctIndex;
    }


    if (
        typeof question.correct ===
            "number"
    ) {

        return question.correct;
    }


    const correct =
        question.correct_answer ||
        question.correctAnswer ||
        question.answer;


    if (
        correct !== undefined
    ) {

        const numeric =
            Number(correct);

        if (
            Number.isFinite(numeric)
        ) {

            return numeric;
        }


        return options.findIndex(
            option =>
                String(option)
                    .toLowerCase() ===
                String(correct)
                    .toLowerCase()
        );
    }


    /*
     * Also support the DB representation:
     *
     * options:
     * [
     *   {
     *      option_text: "...",
     *      is_correct: true
     *   }
     * ]
     */

    const dbCorrect =
        options.findIndex(
            option =>
                option &&
                option.is_correct === true
        );


    return dbCorrect;
}


function renderQuiz() {

    const questions =
        quizQuestions();


    const question =
        questions[
            state.quizIndex
        ];


    if (!question) {

        return `
            <div class="quiz">
                <h2 class="section-title">
                    Challenge complete!
                </h2>
            </div>
        `;
    }


    const options =
        getQuestionOptions(
            question
        );


    const selected =
        state.answers[
            state.quizIndex
        ];


    const correct =
        getCorrectAnswer(
            question
        );


    return `

        <div class="quiz">

            <div class="quiz-top">

                <span>
                    Challenge
                </span>

                <span>
                    ${state.quizIndex + 1}
                    /
                    ${questions.length}
                </span>

            </div>


            <div class="question">

                ${escapeHTML(
                    question.question ||
                    question.prompt ||
                    question.text ||
                    ""
                )}

            </div>


            <div class="options">

                ${options.map(
                    (option, index) => {

                        const text =
                            typeof option ===
                                "string"
                                    ? option
                                    : (
                                        option.option_text ||
                                        option.text ||
                                        option.label ||
                                        ""
                                    );


                        let className =
                            "option";


                        if (
                            selected !== undefined
                        ) {

                            if (
                                index === correct
                            ) {

                                className +=
                                    " correct";
                            }

                            else if (
                                index === selected
                            ) {

                                className +=
                                    " wrong";
                            }
                        }


                        return `

                            <button
                                class="${className}"
                                type="button"
                                data-option="${index}"
                                ${
                                    selected !==
                                        undefined
                                        ? "disabled"
                                        : ""
                                }
                            >
                                ${escapeHTML(text)}
                            </button>

                        `;
                    }
                ).join("")}

            </div>


            ${
                selected !== undefined
                    ? `
                        <div
                            class="
                                feedback
                                ${
                                    selected ===
                                        correct
                                        ? "good"
                                        : "bad"
                                }
                            "
                        >
                            ${
                                selected ===
                                    correct
                                    ? "✓ Correct! Great work."
                                    : "Not quite. Try to remember this one."
                            }
                        </div>
                    `
                    : ""
            }

        </div>

    `;
}


/* =============================================================
   COMPLETE
============================================================= */

function renderComplete() {

    const settings =
        state.lesson
            .completion_settings ||
        {};


    const xp =
        Number(
            settings.completion_xp ||
            state.lesson.xp ||
            0
        );


    return `

        <div class="complete">

            <div class="complete-icon">
                🎉
            </div>


            <div class="section-kicker">
                Lesson complete
            </div>


            <h2 class="section-title">
                You did it!
            </h2>


            <p class="section-description">

                You completed
                <strong>
                    ${escapeHTML(
                        state.lesson.title
                    )}
                </strong>.

            </p>


            <div class="rewards">

                <div class="reward">

                    <strong>
                        ⭐ +${xp}
                    </strong>

                    <span>
                        XP
                    </span>

                </div>


                <div class="reward">

                    <strong>
                        🎯 ${state.score}%
                    </strong>

                    <span>
                        Quiz score
                    </span>

                </div>


                <div class="reward">

                    <strong>
                        🐼 100%
                    </strong>

                    <span>
                        Complete
                    </span>

                </div>

            </div>


            <div
                id="saveStatus"
                style="
                    margin:0 auto 16px;
                    max-width:500px;
                    padding:11px 14px;
                    border-radius:13px;
                    background:#F7F4ED;
                    color:var(--muted);
                    font-size:.75rem;
                    font-weight:850;
                "
            >
                ${
                    state.completed
                        ? "✓ Progress saved"
                        : "Ready to save your progress"
                }
            </div>


            <button
                id="saveButton"
                class="button primary"
                type="button"
                ${
                    state.completed
                        ? "disabled"
                        : ""
                }
            >
                ${
                    state.completed
                        ? "✓ Saved"
                        : "Save progress"
                }
            </button>

        </div>

    `;
}


/* =============================================================
   SAVE PROGRESS
============================================================= */

function calculateScore() {

    const questions =
        quizQuestions();


    if (!questions.length) {

        return 100;
    }


    let correct = 0;


    questions.forEach(
        (question, index) => {

            if (
                state.answers[index] !==
                    undefined &&
                state.answers[index] ===
                    getCorrectAnswer(
                        question
                    )
            ) {

                correct++;
            }
        }
    );


    return Math.round(
        correct /
        questions.length *
        100
    );
}


async function saveProgress() {

    if (state.saving) {
        return;
    }


    const userId =
        getUserId();


    const lessonId =
        lessonNumber(
            state.lessonId
        );


    if (
        !userId ||
        !lessonId
    ) {

        showToast(
            "error",
            "We couldn't identify your account or lesson."
        );

        return;
    }


    state.saving = true;


    state.score =
        calculateScore();


    const saveButton =
        $("saveButton");


    if (saveButton) {

        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving…";
    }


    try {

        const timeSpent =
            Math.max(
                1,
                Math.round(
                    (
                        Date.now() -
                        state.startedAt
                    ) / 1000
                )
            );


        /*
         * This payload maps directly to your
         * user_progress table.
         */

        const payload = {

            userId: userId,

            lessonId: lessonId,

            courseType:
                state.lesson.course_type ||
                "YCT",

            courseLevel:
                state.lesson.level,

            completed: true,

            score:
                state.score,

            xpEarned:
                Number(
                    state.lesson
                        .completion_settings
                        ?.completion_xp ||
                    state.lesson.xp ||
                    0
                ),

            timeSpent:

                timeSpent,

            attempts: 1,

            quizAnswers:
                state.answers,

            quizScore:
                state.score
        };


        try {
            await postJSON(
                "progress",
                payload
            );
        } catch (primaryError) {
            /*
             * Compatibility fallback for HanVerse deployments where
             * progress is exposed as /api/progress/:userId/:lessonId.
             */
            if (primaryError.status !== 404) throw primaryError;

            await postJSON(
                `progress/${encodeURIComponent(userId)}/${encodeURIComponent(lessonId)}`,
                payload
            );
        }


        state.completed =
            true;


        if (saveButton) {

            saveButton.textContent =
                "✓ Saved";
        }


        const status =
            $("saveStatus");


        if (status) {

            status.textContent =
                "✓ Your progress has been saved!";

            status.style.background =
                "#EEF9F3";

            status.style.color =
                "#27724E";
        }


        showToast(
            "success",
            `Progress saved! +${payload.xpEarned} XP 🎉`
        );


    } catch (error) {

        console.error(
            "Progress save failed:",
            error
        );


        if (saveButton) {

            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save progress";
        }


        const status =
            $("saveStatus");


        if (status) {

            status.textContent =
                error.message ||
                "Progress could not be saved.";

            status.style.background =
                "#FFF1F2";

            status.style.color =
                "#A8323D";
        }


        showToast(
            "error",
            error.message ||
            "Progress could not be saved."
        );


    } finally {

        state.saving =
            false;
    }
}


/* =============================================================
   RENDER CURRENT ACTIVITY
============================================================= */

function renderCurrentActivity() {

    const activity =
        state.activities[
            state.currentActivity
        ];


    if (!activity) {
        return;
    }


    const container =
        $("lessonContent");


    container.classList
        .remove("hidden");


    switch (
        activity.type
    ) {

        case "welcome":

            container.innerHTML =
                renderWelcome();

            break;


        case "objectives":

            container.innerHTML =
                renderObjectives();

            break;


        case "vocabulary":

            container.innerHTML =
                renderVocabulary();

            break;


        case "content":

            container.innerHTML =
                renderContent();

            break;


        case "examples":

            container.innerHTML =
                renderExamples();

            break;


        case "media":

            container.innerHTML = `

                <div>

                    <div class="section-kicker">
                        Watch & listen
                    </div>

                    <h2 class="section-title">
                        Learn with media
                    </h2>

                    ${array(
                        state.lesson.media
                    ).map(
                        renderMediaItem
                    ).join("")}

                </div>

            `;

            break;


        case "quiz":

            container.innerHTML =
                renderQuiz();

            break;


        case "complete":

            container.innerHTML =
                renderComplete();

            break;


        default:

            /*
             * Future-proof fallback.
             *
             * If server.js later returns an unknown
             * section type with a body, it will still
             * display instead of breaking the page.
             */

            container.innerHTML = `

                <div>

                    <div class="section-kicker">
                        Lesson activity
                    </div>

                    <h2 class="section-title">
                        ${escapeHTML(
                            activity.title ||
                            "Keep learning"
                        )}
                    </h2>

                    ${
                        activity.body
                            ? `
                                <p class="section-description">
                                    ${escapeHTML(
                                        activity.body
                                    )}
                                </p>
                            `
                            : ""
                    }

                </div>

            `;
    }


    /*
     * Re-run the entrance animation.
     */

    container.style.animation =
        "none";

    void container.offsetWidth;

    container.style.animation =
        "";


    updateProgress();

    bindDynamicEvents();
}


/* =============================================================
   PROGRESS UI
============================================================= */

function updateProgress() {

    const total =
        state.activities.length;


    const current =
        state.currentActivity + 1;


    const percent =
        total
            ? Math.round(
                current /
                total *
                100
            )
            : 0;


    $("progressBar").style.width =
        `${percent}%`;


    $("progressNumber").textContent =
        `${percent}%`;


    $("slideCounter").textContent =
        `${current} / ${total}`;


    const names = {

        welcome:
            "Welcome",

        objectives:
            "Learning goals",

        vocabulary:
            "Vocabulary",

        content:
            "Lesson",

        examples:
            "Practice",

        media:
            "Watch & listen",

        quiz:
            "Challenge",

        complete:
            "Complete"
    };


    $("activityName").textContent =
        names[
            state.activities[
                state.currentActivity
            ]?.type
        ] ||
        "Lesson";


    $("lessonLevel").textContent =
        `YCT ${state.lesson.level}`;
}


/* =============================================================
   DYNAMIC EVENTS
============================================================= */

function bindDynamicEvents() {

    document
        .querySelectorAll(
            "[data-speak]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        speak(
                            button.dataset.speak
                        );
                    }
                );
            }
        );


    document
        .querySelectorAll(
            "[data-option]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        answerQuiz(
                            Number(
                                button.dataset.option
                            )
                        );
                    }
                );
            }
        );


    const saveButton =
        $("saveButton");


    if (saveButton) {

        saveButton.addEventListener(
            "click",
            saveProgress
        );
    }
}


/* =============================================================
   SPEECH
============================================================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        showToast(
            "error",
            "Speech is not supported in this browser."
        );

        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "zh-CN";


    utterance.rate =
        .82;


    speechSynthesis.speak(
        utterance
    );
}


/* =============================================================
   QUIZ
============================================================= */

function answerQuiz(index) {

    state.answers[
        state.quizIndex
    ] = index;


    renderCurrentActivity();
}


/* =============================================================
   NAVIGATION
============================================================= */

function next() {

    const activity =
        state.activities[
            state.currentActivity
        ];


    if (
        activity?.type ===
        "quiz"
    ) {

        const questions =
            quizQuestions();


        if (
            state.answers[
                state.quizIndex
            ] === undefined
        ) {

            showToast(
                "error",
                "Choose an answer first."
            );

            return;
        }


        if (
            state.quizIndex <
            questions.length - 1
        ) {

            state.quizIndex++;

            renderCurrentActivity();

            return;
        }
    }


    if (
        activity?.type ===
        "complete"
    ) {

        saveProgress();

        return;
    }


    if (
        state.currentActivity <
        state.activities.length - 1
    ) {

        state.currentActivity++;

        renderCurrentActivity();
    }
}


function back() {

    if (
        state.currentActivity <=
        0
    ) {

        return;
    }


    state.currentActivity--;

    renderCurrentActivity();
}


/* =============================================================
   TOAST
============================================================= */

function showToast(
    type,
    message
) {

    const area =
        $("toastArea");


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        `toast ${type || ""}`;


    toast.textContent =
        message;


    area.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.style.opacity =
                "0";

            toast.style.transform =
                "translateY(8px)";

            toast.style.transition =
                "all .2s ease";


            setTimeout(
                () => toast.remove(),
                220
            );

        },
        3200
    );
}


/* =============================================================
   ERROR
============================================================= */

function showError(error) {

    console.error(
        "HanVerse lesson error:",
        error
    );


    $("loadingState")
        .classList
        .add("hidden");


    $("lessonContent")
        .classList
        .add("hidden");


    $("controls")
        .classList
        .add("hidden");


    $("errorState")
        .classList
        .remove("hidden");


    $("errorMessage")
        .textContent =
        error?.message ||
        "The lesson could not be loaded from the database.";
}


/* =============================================================
   INITIALISE
============================================================= */

async function init() {

    state.user =
        readUser();


    /*
     * Keep your existing login system.
     * If a session exists, continue.
     */

    if (!state.user) {

        window.location.href =
            "login.html";

        return;
    }


    renderNavbar();


    /*
     * FETCH EVERYTHING FROM API.
     */

    state.lesson =
        await fetchLesson();


    $("lessonTitle").textContent =
        state.lesson.title;


    $("lessonDescription").textContent =
        state.lesson.description;


    $("lessonXP").textContent =
        state.lesson.xp;


    state.activities =
        buildActivities();


    if (
        !state.activities.length
    ) {

        throw new Error(
            "This lesson contains no content."
        );
    }


    $("loadingState")
        .classList
        .add("hidden");


    $("errorState")
        .classList
        .add("hidden");


    $("controls")
        .classList
        .remove("hidden");


    renderCurrentActivity();
}


/* =============================================================
   EVENTS
============================================================= */

$("continueButton")
    .addEventListener(
        "click",
        next
    );


$("backButton")
    .addEventListener(
        "click",
        back
    );


$("retryButton")
    .addEventListener(
        "click",
        () => {

            $("errorState")
                .classList
                .add("hidden");


            $("loadingState")
                .classList
                .remove("hidden");


            init()
                .catch(showError);
        }
    );


$("mobileMenuButton")
    .addEventListener(
        "click",
        () => {

            const menu =
                $("mobileMenu");


            const open =
                menu.classList
                    .toggle("open");


            $("mobileMenuButton")
                .textContent =
                open
                    ? "✕"
                    : "☰";
        }
    );


document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.matches(
                "input,textarea,select"
            )
        ) {

            return;
        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            next();
        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            back();
        }
    }
);


/* =============================================================
   START
============================================================= */

init()
    .catch(showError);

</script>

</body>
</html>
