<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E63946">
<title>HanVerse | Lesson</title>
<style>
:root{
  --red:#E63946;
  --red-dark:#c92f3b;
  --yellow:#F4D35E;
  --blue:#4EA8DE;
  --green:#74C69D;
  --cream:#FFFDF7;
  --ink:#253044;
  --muted:#6d7482;
  --line:#ebe7df;
  --white:#fff;
  --shadow:0 18px 50px rgba(37,48,68,.10);
  --radius:24px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%,rgba(244,211,94,.18),transparent 25rem),
    radial-gradient(circle at 90% 15%,rgba(78,168,222,.12),transparent 25rem),
    var(--cream);
}
button,a{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.container{width:min(1120px,calc(100% - 32px));margin:auto}

/* NAV */
.nav-wrap{
  position:sticky;top:0;z-index:1000;
  background:rgba(255,253,247,.88);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(235,231,223,.9);
}
.nav{
  min-height:72px;
  display:flex;
  align-items:center;
  gap:24px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem}
.brand-mark{
  width:40px;height:40px;border-radius:13px;
  display:grid;place-items:center;background:#fff;
  box-shadow:0 7px 20px rgba(37,48,68,.08);
}
.brand span{color:var(--red)}
.nav-links{display:flex;align-items:center;gap:6px;margin-left:12px}
.nav-link{
  padding:9px 12px;border-radius:11px;color:var(--muted);
  font-size:.82rem;font-weight:800;
}
.nav-link:hover,.nav-link.active{color:var(--ink);background:#f4f0e8}
.nav-actions{margin-left:auto;display:flex;gap:9px;align-items:center}
.btn{
  min-height:42px;padding:0 17px;border:1px solid transparent;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-size:.78rem;font-weight:900;transition:.2s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(230,57,70,.18)}
.btn-primary:hover{background:var(--red-dark)}
.btn-outline{background:#fff;border-color:var(--line)}
.mobile-toggle{display:none;margin-left:auto;width:43px;height:43px;border:1px solid var(--line);background:#fff;border-radius:12px}
.mobile-menu{display:none;border-top:1px solid var(--line);padding:10px 16px 16px}
.mobile-menu.open{display:grid}
.mobile-menu a{padding:13px;border-radius:11px;font-weight:800;font-size:.85rem}
.mobile-menu a:hover{background:#f5f1e9}

/* PAGE */
main{padding:42px 0 70px}
.lesson-top{
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px
}
.eyebrow{
  color:var(--red);font-size:.68rem;font-weight:900;text-transform:uppercase;
  letter-spacing:.12em
}
h1{margin:7px 0 7px;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:-.055em;line-height:1.05}
.subtitle{margin:0;color:var(--muted);font-size:.9rem;line-height:1.65;max-width:700px}
.xp-chip{
  flex:none;padding:11px 15px;border:1px solid var(--line);background:#fff;
  border-radius:999px;font-size:.78rem;font-weight:900;box-shadow:0 8px 25px rgba(37,48,68,.06)
}

/* PROGRESS */
.progress-card{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;
  box-shadow:var(--shadow);margin-bottom:18px
}
.progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:.72rem;font-weight:800;color:var(--muted)}
.progress-meta strong{color:var(--ink)}
.progress-track{height:9px;background:#eeeae2;border-radius:99px;overflow:hidden;margin-top:12px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff7a6f);border-radius:inherit;transition:width .35s ease}
.progress-steps{display:flex;align-items:center;margin-top:14px;overflow:hidden}
.progress-step{
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#eeeae2;color:#8b9099;font-size:.62rem;font-weight:900;flex:none
}
.progress-step.active{background:var(--red);color:#fff}
.progress-step.completed{background:var(--green);color:#fff}
.progress-connector{height:3px;flex:1;background:#eeeae2;min-width:8px}
.progress-connector.completed{background:var(--green)}

/* STAGE */
.stage{
  background:#fff;border:1px solid var(--line);border-radius:28px;
  box-shadow:var(--shadow);overflow:hidden
}
.slide-viewport{overflow:hidden}
.slide-wrapper{display:flex;transition:transform .38s cubic-bezier(.22,.8,.25,1)}
.slide{
  min-width:100%;padding:clamp(30px,6vw,70px);
  min-height:460px;display:flex;align-items:center;justify-content:center
}
.slide-content{width:min(720px,100%);text-align:center}
.hero-icon,.word-character,.complete-icon{
  width:100px;height:100px;margin:0 auto 20px;border-radius:30px;
  display:grid;place-items:center;background:#fff8db;border:1px solid #f1e3ad;
  font-size:3.2rem;box-shadow:0 14px 30px rgba(37,48,68,.08)
}
.slide-kicker{
  display:inline-block;padding:6px 10px;border-radius:99px;background:#f5f1e9;
  color:var(--muted);font-size:.64rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em
}
.slide h2{margin:15px 0 10px;font-size:clamp(1.55rem,3.5vw,2.45rem);letter-spacing:-.045em}
.slide p{color:var(--muted);line-height:1.75;font-size:.9rem}
.panda-tip{
  margin:24px auto 0;max-width:500px;padding:14px 17px;background:#f8fbff;
  border:1px solid #e1edf6;border-radius:16px;font-size:.78rem;font-weight:700
}

/* VOCAB */
.vocab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:25px;text-align:left}
.word-card{
  border:1px solid var(--line);border-radius:18px;padding:20px;background:#fff;
  transition:.2s ease
}
.word-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(37,48,68,.08)}
.word-chinese{font-size:2rem;font-weight:900}
.word-pinyin{color:var(--red);font-weight:900;margin-top:3px}
.word-english{color:var(--muted);font-size:.78rem;margin-top:4px}
.speak{
  margin-top:13px;border:0;background:#f5f1e9;border-radius:10px;padding:8px 11px;
  font-size:.7rem;font-weight:900
}

/* STORY */
.story-list{display:grid;gap:12px;margin-top:25px;text-align:left}
.story-card{display:grid;grid-template-columns:55px 1fr;gap:13px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:17px}
.story-icon{width:55px;height:55px;display:grid;place-items:center;border-radius:15px;background:#f5f1e9;font-size:1.6rem}
.story-card h3{margin:0;font-size:.9rem}.story-card p{margin:4px 0 0;font-size:.76rem}

/* QUIZ */
.quiz-card{max-width:650px;margin:20px auto 0;text-align:left}
.question-count{font-size:.67rem;font-weight:900;color:var(--red);text-transform:uppercase}
.question{font-size:1.25rem;font-weight:900;margin:10px 0 18px}
.options{display:grid;gap:10px}
.option{
  width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);background:#fff;
  border-radius:14px;font-size:.8rem;font-weight:800;transition:.18s
}
.option:hover:not(:disabled){border-color:#cbd5df;transform:translateX(2px)}
.option.selected{border-color:var(--blue);background:#eef8ff}
.option.correct{border-color:#5eb58b;background:#effaf4}
.option.wrong{border-color:#e97b84;background:#fff1f2}
.option:disabled{cursor:default}
.feedback{min-height:28px;margin-top:13px;font-size:.76rem;font-weight:800}
.feedback.good{color:#23855b}.feedback.bad{color:#c43745}

/* COMPLETE */
.reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}
.reward{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.reward strong{display:block;font-size:1.15rem}.reward span{display:block;color:var(--muted);font-size:.65rem;margin-top:3px}
.save-status{margin:16px auto;max-width:500px;padding:11px 14px;border-radius:12px;background:#f5f1e9;color:var(--muted);font-size:.72rem;font-weight:800}
.save-status.success{background:#effaf4;color:#237b57}
.save-status.error{background:#fff1f2;color:#b92f3c}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* FOOTER NAV */
.slide-nav{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:15px 20px;border-top:1px solid var(--line);background:#fcfaf6
}
.slide-nav .btn:last-child{justify-self:end}
.counter{font-size:.72rem;font-weight:900;color:var(--muted)}

/* LOADING / TOAST */
.loading{
  min-height:480px;display:grid;place-items:center;align-content:center;gap:12px;
  color:var(--muted);font-size:.8rem
}
.spinner{width:34px;height:34px;border:4px solid #eeeae2;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.toast-region{position:fixed;right:18px;bottom:18px;z-index:2000;display:grid;gap:9px;max-width:min(360px,calc(100% - 36px))}
.toast{padding:13px 15px;border-radius:14px;background:#253044;color:#fff;box-shadow:var(--shadow);font-size:.75rem;font-weight:800}
.toast.success{background:#237b57}.toast.error{background:#b92f3c}
.offline{display:none;background:#253044;color:#fff;text-align:center;padding:8px;font-size:.7rem;font-weight:800}
.offline.show{display:block}

/* RESPONSIVE */
@media(max-width:800px){
  .nav-links,.nav-actions{display:none}
  .mobile-toggle{display:block}
  .lesson-top{align-items:flex-start;flex-direction:column}
  .xp-chip{align-self:flex-start}
  .vocab-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .container{width:min(100% - 20px,1120px)}
  main{padding-top:24px}
  .slide{padding:30px 18px;min-height:520px}
  .slide-nav{grid-template-columns:1fr 1fr}
  .counter{display:none}
  .slide-nav .btn{width:100%}
  .reward-grid{grid-template-columns:1fr}
  .hero-icon,.word-character,.complete-icon{width:82px;height:82px;font-size:2.6rem}
  .progress-card{padding:15px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="offline" id="offlineBanner">You're offline. Your lesson can still be viewed, but progress needs a connection to save.</div>

<header class="nav-wrap">
  <nav class="nav container">
    <a class="brand" href="index.html"><span class="brand-mark">🐼</span>Han<span>Verse</span></a>
    <div class="nav-links" id="desktopNav"></div>
    <div class="nav-actions" id="desktopActions"></div>
    <button class="mobile-toggle" id="mobileToggle" aria-expanded="false" aria-controls="mobileMenu">☰</button>
  </nav>
  <div class="mobile-menu" id="mobileMenu"></div>
</header>

<main>
  <div class="container">
    <section class="lesson-top">
      <div>
        <div class="eyebrow">HanVerse lesson</div>
        <h1 id="lessonTitle">Loading lesson…</h1>
        <p class="subtitle" id="lessonSubtitle">Preparing your Mandarin adventure.</p>
      </div>
      <div class="xp-chip">⭐ <span id="xpDisplay">0</span> XP</div>
    </section>

    <section class="progress-card" aria-label="Lesson progress">
      <div class="progress-meta">
        <span id="lessonMeta">Lesson · YCT</span>
        <strong id="progressText">1 / 1</strong>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-steps" id="progressSteps"></div>
    </section>

    <section class="stage" id="stage">
      <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <span>Loading your lesson…</span>
      </div>

      <div class="slide-viewport hidden" id="slideViewport">
        <div class="slide-wrapper" id="slideWrapper"></div>
      </div>

      <div class="slide-nav hidden" id="slideNav">
        <button class="btn btn-outline" id="prevBtn" type="button">← Back</button>
        <div class="counter" id="slideCounter">1 / 1</div>
        <button class="btn btn-primary" id="nextBtn" type="button">Next →</button>
      </div>
    </section>
  </div>
</main>

<div class="toast-region" id="toastRegion" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  const API_BASE = "/api";
  const SESSION_KEY = "hanverse_user";

  const state = {
    user: null,
    lesson: null,
    slides: [],
    currentSlide: 0,
    quizIndex: 0,
    answers: {},
    savedProgress: null,
    completed: false,
    saving: false,
    startedAt: Date.now()
  };

  const $ = id => document.getElementById(id);

  function readSession(){
    const keys = [
      SESSION_KEY,
      "hanverseUser",
      "user",
      "userData",
      "currentUser",
      "authUser",
      "session"
    ];

    for(const key of keys){
      try{
        const raw = localStorage.getItem(key);
        if(!raw) continue;

        const parsed = JSON.parse(raw);
        const value = parsed && typeof parsed === "object"
          ? (parsed.user || parsed.data || parsed)
          : null;

        if(value && typeof value === "object"){
          return value;
        }
      }catch(error){
        console.warn("HanVerse session read failed for", key, error);
      }
    }

    return null;
  }

  function userId(user){
    return String(
      user?.user_id ??
      user?.userId ??
      user?.id ??
      user?._id ??
      ""
    );
  }

  function userName(user){
    return user?.full_name ||
      user?.fullName ||
      [user?.first_name,user?.last_name].filter(Boolean).join(" ") ||
      user?.name ||
      user?.username ||
      "Learner";
  }

  function roleOf(user){
    if(!user) return "";
    if(user.is_admin === true || user.isAdmin === true) return "admin";
    if(user.is_parent === true || user.isParent === true || user.parent === true) return "parent";
    return String(user.role || user.user_role || "").toLowerCase();
  }

  function apiURL(path){
    return API_BASE + "/" + String(path || "").replace(/^\/+/,"");
  }

  async function requestJSON(path, options){
    const response = await fetch(apiURL(path), {
      credentials:"include",
      cache:"no-store",
      ...options,
      headers:{
        Accept:"application/json",
        ...(options && options.headers ? options.headers : {})
      }
    });

    const text = await response.text();
    let data = null;

    try{
      data = text ? JSON.parse(text) : null;
    }catch(error){
      throw new Error("Server returned a non-JSON response (HTTP " + response.status + ").");
    }

    if(!response.ok){
      throw new Error(
        data?.error ||
        data?.message ||
        "Request failed (HTTP " + response.status + ")."
      );
    }

    return data;
  }

  function getJSON(path){
    return requestJSON(path,{method:"GET"});
  }

  function postJSON(path, body){
    return requestJSON(path,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
  }

  function param(name){
    return new URLSearchParams(window.location.search).get(name);
  }

  function getLessonId(){
    return String(param("id") || "lesson_1");
  }

  function lessonId(lesson){
    return String(
      lesson?.id ??
      lesson?._id ??
      lesson?.lessonId ??
      lesson?.lesson_id ??
      getLessonId()
    );
  }

  function lessonLevel(lesson){
    const n = Number(
      lesson?.level ??
      lesson?.course_level ??
      lesson?.yct_level ??
      1
    );
    return Number.isFinite(n) && n > 0 ? n : 1;
  }

  function lessonXP(lesson){
    const n = Number(lesson?.xp ?? lesson?.xp_earned ?? 10);
    return Number.isFinite(n) ? n : 10;
  }

  function esc(value){
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
  }

  function escapeAttr(value){
    return esc(value).replace(/"/g,"&quot;");
  }

  function normalizeLesson(raw){
    const lesson = raw?.lesson || raw?.data || raw;

    if(!lesson || typeof lesson !== "object"){
      throw new Error("The lesson returned by the server is invalid.");
    }

    return {
      ...lesson,
      id: lesson.id || lesson._id || lesson.lessonId || lesson.lesson_id || getLessonId(),
      title: lesson.title || lesson.name || "Untitled Lesson",
      description: lesson.description || "Continue building your Mandarin skills.",
      level: lessonLevel(lesson),
      xp: lessonXP(lesson),
      icon: lesson.icon || lesson.emoji || "📚",
      vocabulary: Array.isArray(lesson.vocabulary) ? lesson.vocabulary : [],
      story: Array.isArray(lesson.story) ? lesson.story : [],
      quiz: Array.isArray(lesson.quiz) ? lesson.quiz : []
    };
  }

  function fallbackLesson(){
    return {
      id:getLessonId(),
      title:"Greetings & Introductions",
      description:"Learn how to say hello, introduce yourself, and greet others in Mandarin.",
      level:1,
      premium:false,
      xp:10,
      icon:"👋",
      vocabulary:[
        {pinyin:"nǐ hǎo",chinese:"你好",english:"Hello"},
        {pinyin:"zài jiàn",chinese:"再见",english:"Goodbye"},
        {pinyin:"xiè xiè",chinese:"谢谢",english:"Thank you"},
        {pinyin:"duì bu qǐ",chinese:"对不起",english:"Sorry"},
        {pinyin:"qǐng wèn",chinese:"请问",english:"Excuse me / May I ask"}
      ],
      quiz:[
        {correct:0,options:["你好","再见","谢谢","对不起"],question:"How do you say \"Hello\" in Mandarin?"},
        {correct:1,options:["Hello","Goodbye","Thank you","Sorry"],question:"What does \"再见\" mean?"},
        {correct:2,options:["你好","再见","谢谢","对不起"],question:"How do you say \"Thank you\" in Mandarin?"}
      ]
    };
  }

  async function fetchLesson(id){
    const candidates = [
      "lessons/" + encodeURIComponent(id),
      "lesson/" + encodeURIComponent(id),
      "lessons?id=" + encodeURIComponent(id)
    ];

    let lastError = null;

    for(const path of candidates){
      try{
        const data = await getJSON(path);
        const lesson = data?.lesson || data?.data || data;

        if(lesson && typeof lesson === "object"){
          return normalizeLesson(lesson);
        }
      }catch(error){
        lastError = error;
      }
    }

    if(lastError){
      console.warn("HanVerse lesson API lookup failed:", lastError);
    }

    return null;
  }

  async function fetchSavedProgress(uid,lid){
    if(!uid || !lid) return null;

    const candidates = [
      "progress/" + encodeURIComponent(uid) + "/" + encodeURIComponent(lid),
      "progress/" + encodeURIComponent(lid)
    ];

    for(const path of candidates){
      try{
        const data = await getJSON(path);
        const progress = data?.progress || data?.lessonProgress || data?.data || data;

        if(progress && typeof progress === "object"){
          return progress;
        }
      }catch(error){
        console.warn("HanVerse progress lookup failed:",path,error);
      }
    }

    return null;
  }

  function progressPercent(progress){
    if(!progress) return 0;

    if(progress.completed === true || progress.is_completed === true){
      return 100;
    }

    const raw =
      progress.progress_pct ??
      progress.progressPercent ??
      progress.completed_pct ??
      progress.completedPercent ??
      progress.progress ??
      progress.percent ??
      0;

    const n = Number(raw);
    return Number.isFinite(n) ? Math.max(0,Math.min(100,n)) : 0;
  }

  function isSavedCompleted(){
    return Boolean(
      state.savedProgress &&
      (
        state.savedProgress.completed === true ||
        state.savedProgress.is_completed === true ||
        progressPercent(state.savedProgress) >= 100
      )
    );
  }

  function buildSlides(lesson){
    const slides = [];

    slides.push({
      type:"welcome",
      data:{
        emoji:lesson.icon,
        title:"Ready for " + lesson.title + "?",
        subtitle:lesson.description,
        buttonText:"Start Adventure →"
      }
    });

    if(lesson.vocabulary.length){
      slides.push({
        type:"vocabulary",
        data:{items:lesson.vocabulary}
      });
    }

    if(lesson.story.length){
      slides.push({
        type:"story",
        data:{items:lesson.story}
      });
    }

    if(lesson.quiz.length){
      slides.push({
        type:"quiz",
        data:{questions:lesson.quiz}
      });
    }

    slides.push({
      type:"complete",
      data:{
        title:"🌟 Mission Complete!",
        subtitle:"Amazing work! Your progress is ready to be saved.",
        xp:lessonXP(lesson)
      }
    });

    return slides;
  }

  function renderNavbar(){
    const desktop = $("desktopNav");
    const actions = $("desktopActions");
    const mobile = $("mobileMenu");
    const user = state.user;
    const role = roleOf(user);

    desktop.innerHTML = "";
    actions.innerHTML = "";
    mobile.innerHTML = "";

    const links = [
      ["Home","index.html"],
      ["Learn","learn.html"],
      ["Worksheets","worksheets.html"]
    ];

    if(role === "parent") links.push(["Parent","parent.html"]);
    if(role === "admin") links.push(["Admin","admin.html"]);

    links.forEach(([label,href]) => {
      const a = document.createElement("a");
      a.className = "nav-link";
      a.href = href;
      a.textContent = label;
      desktop.appendChild(a);

      const m = document.createElement("a");
      m.href = href;
      m.textContent = label;
      mobile.appendChild(m);
    });

    if(user){
      const profileHref =
        role === "parent" ? "parent.html" :
        role === "admin" ? "admin.html" :
        "profile.html";

      const profile = document.createElement("a");
      profile.className = "btn btn-outline";
      profile.href = profileHref;
      profile.textContent = "👤 " + userName(user);
      actions.appendChild(profile);

      const mobileProfile = document.createElement("a");
      mobileProfile.href = profileHref;
      mobileProfile.textContent = "👤 " + userName(user);
      mobile.appendChild(mobileProfile);
    }else{
      const login = document.createElement("a");
      login.className = "btn btn-outline";
      login.href = "login.html";
      login.textContent = "Log in";

      const signup = document.createElement("a");
      signup.className = "btn btn-primary";
      signup.href = "signup.html";
      signup.textContent = "Start learning";

      actions.append(login,signup);

      const mobileLogin = document.createElement("a");
      mobileLogin.href = "login.html";
      mobileLogin.textContent = "Log in";

      const mobileSignup = document.createElement("a");
      mobileSignup.href = "signup.html";
      mobileSignup.textContent = "Start learning";

      mobile.append(mobileLogin,mobileSignup);
    }
  }

  function renderProgress(){
    const total = state.slides.length;
    const current = state.currentSlide + 1;

    $("progressText").textContent = current + " / " + total;
    $("slideCounter").textContent = current + " / " + total;

    const percent = total
      ? Math.round((current / total) * 100)
      : 0;

    $("progressFill").style.width = percent + "%";

    const steps = $("progressSteps");
    steps.innerHTML = "";

    state.slides.forEach((slide,index) => {
      const step = document.createElement("span");
      step.className = "progress-step";

      if(index < state.currentSlide) step.classList.add("completed");
      if(index === state.currentSlide) step.classList.add("active");

      step.textContent = index + 1;
      steps.appendChild(step);

      if(index < state.slides.length - 1){
        const connector = document.createElement("i");
        connector.className = "progress-connector";
        if(index < state.currentSlide) connector.classList.add("completed");
        steps.appendChild(connector);
      }
    });
  }

  function renderWelcome(data){
    return `
      <div class="slide-content">
        <div class="hero-icon">${esc(data.emoji || "🐼")}</div>
        <span class="slide-kicker">Your next adventure</span>
        <h2>${esc(data.title)}</h2>
        <p>${esc(data.subtitle)}</p>
        <div class="panda-tip">🐼 Take your time, practise the words, and have fun!</div>
      </div>
    `;
  }

  function renderVocabulary(data){
    const items = data.items || [];

    return `
      <div class="slide-content">
        <span class="slide-kicker">Vocabulary</span>
        <h2>Learn these words</h2>
        <p>Study the Chinese, pronunciation and meaning.</p>
        <div class="vocab-grid">
          ${items.map((word,index) => `
            <article class="word-card">
              <div class="word-chinese">${esc(word.chinese || word.character || word.word || "")}</div>
              <div class="word-pinyin">${esc(word.pinyin || "")}</div>
              <div class="word-english">${esc(word.english || word.meaning || word.translation || "")}</div>
              <button class="speak" type="button" data-speak-index="${index}">🔊 Hear it</button>
            </article>
          `).join("")}
        </div>
      </div>
    `;
  }

  function renderStory(data){
    return `
      <div class="slide-content">
        <span class="slide-kicker">Story</span>
        <h2>Put it into context</h2>
        <p>See how your new Mandarin words work in a real situation.</p>
        <div class="story-list">
          ${(data.items || []).map(item => `
            <article class="story-card">
              <div class="story-icon">${esc(item.icon || item.emoji || "📖")}</div>
              <div>
                <h3>${esc(item.title || "Story moment")}</h3>
                <p>${esc(item.text || item.description || "")}</p>
              </div>
            </article>
          `).join("")}
        </div>
      </div>
    `;
  }

  function renderQuiz(data){
    const questions = data.questions || [];
    const index = Math.max(0,Math.min(state.quizIndex,questions.length - 1));
    const q = questions[index] || {};
    const selected = state.answers[index];
    const answered = selected !== undefined;
    const correct = Number(q.correct ?? q.answer ?? q.correctAnswer ?? 0);
    const options = Array.isArray(q.options) ? q.options : [];

    return `
      <div class="slide-content">
        <span class="slide-kicker">Quick challenge</span>
        <div class="quiz-card">
          <div class="question-count">Question ${index + 1} of ${questions.length}</div>
          <div class="question">${esc(q.question || "Choose the correct answer.")}</div>

          <div class="options">
            ${options.map((option,i) => {
              let cls = "option";

              if(answered){
                if(i === correct) cls += " correct";
                if(i === selected && selected !== correct) cls += " wrong";
                if(i === selected) cls += " selected";
              }

              return `
                <button
                  type="button"
                  class="${cls}"
                  data-answer="${i}"
                  ${answered ? "disabled" : ""}
                >${esc(option)}</button>
              `;
            }).join("")}
          </div>

          <div class="feedback ${answered ? (selected === correct ? "good" : "bad") : ""}">
            ${
              !answered ? "Choose an answer." :
              selected === correct ? "Correct! 🎉" :
              "Not quite — review the correct answer and keep going."
            }
          </div>

          ${
            answered && index < questions.length - 1
            ? `<button class="btn btn-primary" id="nextQuestionBtn" type="button">Next question →</button>`
            : ""
          }
        </div>
      </div>
    `;
  }

  function renderComplete(data){
    const saved = state.completed || isSavedCompleted();

    return `
      <div class="slide-content">
        <div class="complete-icon">🎉</div>
        <span class="slide-kicker">Complete</span>
        <h2>${esc(data.title)}</h2>
        <p>${esc(data.subtitle)}</p>

        <div class="reward-grid">
          <div class="reward"><strong>+${lessonXP(state.lesson)}</strong><span>XP earned</span></div>
          <div class="reward"><strong>✓</strong><span>Lesson complete</span></div>
          <div class="reward"><strong>🔥</strong><span>Keep learning</span></div>
        </div>

        <div class="save-status ${saved ? "success" : ""}" id="saveStatus">
          ${saved ? "✓ Progress saved to HanVerse!" : "Ready to save your progress."}
        </div>

        <div class="actions">
          <a class="btn btn-primary" href="roadmap.html">🗺️ Back to Roadmap</a>
          <a class="btn btn-outline" href="learn.html">📚 Learning Area</a>
        </div>
      </div>
    `;
  }

  function renderSlide(slide){
    if(slide.type === "welcome") return renderWelcome(slide.data);
    if(slide.type === "vocabulary") return renderVocabulary(slide.data);
    if(slide.type === "story") return renderStory(slide.data);
    if(slide.type === "quiz") return renderQuiz(slide.data);
    if(slide.type === "complete") return renderComplete(slide.data);
    return `<div class="slide-content"><h2>Lesson step</h2></div>`;
  }

  function renderSlides(){
    const wrapper = $("slideWrapper");
    wrapper.innerHTML = "";

    state.slides.forEach(slide => {
      const article = document.createElement("article");
      article.className = "slide";
      article.innerHTML = renderSlide(slide);
      wrapper.appendChild(article);
    });

    bindDynamicSlideEvents();
    updateSlideUI();
  }

  function updateSlideUI(){
    $("slideWrapper").style.transform =
      "translateX(-" + (state.currentSlide * 100) + "%)";

    renderProgress();

    const previous = $("prevBtn");
    const next = $("nextBtn");
    const current = state.slides[state.currentSlide];

    previous.disabled = state.currentSlide === 0;

    if(state.currentSlide === state.slides.length - 1){
      next.textContent = state.completed ? "✓ Completed" : "Save lesson";
      next.disabled = !state.completed;
      next.className = "btn " + (state.completed ? "btn-primary" : "btn-outline");
    }else if(current?.type === "quiz"){
      const questions = current.data.questions || [];
      const allAnswered = questions.every((_,i) => state.answers[i] !== undefined);

      if(state.quizIndex < questions.length - 1){
        next.textContent = "Next →";
        next.disabled = false;
      }else{
        next.textContent = allAnswered ? "Finish challenge →" : "Answer first";
        next.disabled = !allAnswered;
      }

      next.className = "btn btn-primary";
    }else{
      next.textContent = "Next →";
      next.disabled = false;
      next.className = "btn btn-primary";
    }
  }

  function bindDynamicSlideEvents(){
    document.querySelectorAll("[data-speak-index]").forEach(button => {
      button.addEventListener("click",() => {
        const index = Number(button.getAttribute("data-speak-index"));
        const word = state.lesson?.vocabulary?.[index];
        const text = word?.chinese || word?.character || "";

        if("speechSynthesis" in window && text){
          speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "zh-CN";
          utterance.rate = .8;
          speechSynthesis.speak(utterance);
        }
      });
    });

    document.querySelectorAll("[data-answer]").forEach(button => {
      button.addEventListener("click",() => {
        const index = Number(button.getAttribute("data-answer"));
        answerQuiz(index);
      });
    });

    const nextQuestionButton = $("nextQuestionBtn");

    if(nextQuestionButton){
      nextQuestionButton.addEventListener("click",() => {
        state.quizIndex += 1;
        renderCurrentSlide();
      });
    }
  }

  function renderCurrentSlide(){
    const currentArticle = $("slideWrapper").children[state.currentSlide];

    if(currentArticle){
      currentArticle.innerHTML = renderSlide(state.slides[state.currentSlide]);
    }

    bindDynamicSlideEvents();
    updateSlideUI();
  }

  function answerQuiz(index){
    const slide = state.slides[state.currentSlide];

    if(!slide || slide.type !== "quiz") return;

    state.answers[state.quizIndex] = index;
    renderCurrentSlide();
  }

  async function saveProgress(){
    if(state.saving) return false;

    const uid = userId(state.user);
    const lid = lessonId(state.lesson);

    if(!uid){
      showToast("error","We couldn't identify the logged-in student.");
      return false;
    }

    if(!lid){
      showToast("error","This lesson has no valid ID.");
      return false;
    }

    state.saving = true;

    const quizSlide = state.slides.find(slide => slide.type === "quiz");
    const questions = quizSlide?.data?.questions || [];

    let correct = 0;

    questions.forEach((question,index) => {
      const expected = Number(
        question.correct ??
        question.answer ??
        question.correctAnswer ??
        0
      );

      if(Number(state.answers[index]) === expected){
        correct += 1;
      }
    });

    const quizScore = questions.length ? correct : 0;
    const score = questions.length
      ? Math.round((correct / questions.length) * 100)
      : 100;

    const payload = {
      user_id: Number(uid),
      userId: Number(uid),

      lesson_id: lid,
      lessonId: lid,

      course_type: "YCT",
      courseType: "YCT",

      course_level: lessonLevel(state.lesson),
      courseLevel: lessonLevel(state.lesson),

      completed: true,
      score: score,

      xp_earned: lessonXP(state.lesson),
      xpEarned: lessonXP(state.lesson),

      time_spent: Math.max(
        1,
        Math.round((Date.now() - state.startedAt) / 1000)
      ),
      timeSpent: Math.max(
        1,
        Math.round((Date.now() - state.startedAt) / 1000)
      ),

      attempts: 1,

      quiz_answers: state.answers,
      quizAnswers: state.answers,

      quiz_score: quizScore,
      quizScore: quizScore,

      completed_at: new Date().toISOString(),
      started_at: new Date(state.startedAt).toISOString()
    };

    const status = $("saveStatus");

    if(status){
      status.className = "save-status";
      status.textContent = "Saving your progress…";
    }

    try{
      /*
       * The primary API is POST /api/progress.
       * We deliberately use one canonical endpoint here.
       */
      const result = await postJSON("progress",payload);

      state.savedProgress =
        result?.progress ||
        result?.data ||
        result;

      state.completed = true;

      if(status){
        status.className = "save-status success";
        status.textContent = "✓ Progress saved to HanVerse!";
      }

      showToast("success","🎉 Lesson completed! Your progress has been saved.");
      return true;

    }catch(error){
      console.error("HanVerse progress save failed:",error);

      if(status){
        status.className = "save-status error";
        status.textContent = "⚠ We couldn't save your progress. Please try again.";
      }

      showToast("error","Your lesson wasn't saved: " + error.message);
      return false;

    }finally{
      state.saving = false;
    }
  }

  async function completeLesson(){
    if(state.completed) return true;

    const quizSlide = state.slides.find(slide => slide.type === "quiz");
    const questions = quizSlide?.data?.questions || [];

    if(questions.length){
      const unanswered = questions.some((_,index) => state.answers[index] === undefined);

      if(unanswered){
        showToast("error","Please answer every challenge before completing the lesson.");
        return false;
      }
    }

    const saved = await saveProgress();

    if(saved){
      state.completed = true;

      const finalIndex = state.slides.length - 1;
      state.currentSlide = finalIndex;

      renderCurrentSlide();
    }

    return saved;
  }

  function nextSlide(){
    if(state.currentSlide >= state.slides.length - 1){
      if(state.completed) return;
      completeLesson();
      return;
    }

    const current = state.slides[state.currentSlide];

    if(current?.type === "quiz"){
      const questions = current.data.questions || [];

      if(state.quizIndex < questions.length - 1){
        state.quizIndex += 1;
        renderCurrentSlide();
        return;
      }

      const allAnswered = questions.every((_,index) => state.answers[index] !== undefined);

      if(!allAnswered){
        showToast("error","Please answer every challenge first.");
        return;
      }
    }

    state.currentSlide += 1;

    if(state.slides[state.currentSlide]?.type === "quiz"){
      state.quizIndex = 0;
    }

    renderCurrentSlide();
  }

  function prevSlide(){
    if(state.currentSlide <= 0) return;

    state.currentSlide -= 1;

    if(state.slides[state.currentSlide]?.type === "quiz"){
      const questions = state.slides[state.currentSlide].data.questions || [];
      state.quizIndex = Math.max(0,questions.length - 1);
    }

    renderCurrentSlide();
  }

  function showToast(type,message){
    const region = $("toastRegion");
    const toast = document.createElement("div");

    toast.className = "toast " + (type || "");
    toast.textContent = message;

    region.appendChild(toast);

    window.setTimeout(() => {
      toast.remove();
    },3500);
  }

  async function init(){
    state.user = readSession();

    if(!state.user){
      window.location.replace("login.html");
      return;
    }

    renderNavbar();

    const role = roleOf(state.user);

    if(role && role !== "student" && role !== "parent" && role !== "admin"){
      console.warn("HanVerse: unknown user role:",role);
    }

    const requestedId = getLessonId();

    let lesson = await fetchLesson(requestedId);

    if(!lesson){
      lesson = fallbackLesson();
      showToast("error","The lesson API was unavailable, so a local fallback was loaded.");
    }

    state.lesson = lesson;
    state.startedAt = Date.now();

    $("lessonTitle").textContent = lesson.title;
    $("lessonSubtitle").textContent = lesson.description;
    $("lessonMeta").textContent =
      "Lesson " +
      String(lessonId(lesson)).replace(/^lesson_/,"") +
      " · YCT " +
      lessonLevel(lesson);

    $("xpDisplay").textContent = lessonXP(lesson);

    const uid = userId(state.user);

    state.savedProgress = await fetchSavedProgress(uid,lessonId(lesson));

    if(isSavedCompleted()){
      state.completed = true;
      showToast("success","✓ You've already completed this lesson.");
    }

    state.slides = buildSlides(lesson);

    $("loadingState").classList.add("hidden");
    $("slideViewport").classList.remove("hidden");
    $("slideNav").classList.remove("hidden");

    renderSlides();

    if(state.completed){
      state.currentSlide = state.slides.length - 1;
      renderCurrentSlide();
    }
  }

  $("prevBtn").addEventListener("click",prevSlide);
  $("nextBtn").addEventListener("click",nextSlide);

  $("mobileToggle").addEventListener("click",() => {
    const button = $("mobileToggle");
    const menu = $("mobileMenu");
    const open = menu.classList.toggle("open");

    button.setAttribute("aria-expanded",String(open));
    button.textContent = open ? "✕" : "☰";
  });

  $("mobileMenu").addEventListener("click",event => {
    if(event.target.closest("a")){
      $("mobileMenu").classList.remove("open");
      $("mobileToggle").setAttribute("aria-expanded","false");
      $("mobileToggle").textContent = "☰";
    }
  });

  document.addEventListener("keydown",event => {
    if(event.target.matches("input,textarea,select")) return;

    if(event.key === "ArrowRight") nextSlide();
    if(event.key === "ArrowLeft") prevSlide();
  });

  window.addEventListener("online",() => {
    $("offlineBanner").classList.remove("show");
  });

  window.addEventListener("offline",() => {
    $("offlineBanner").classList.add("show");
  });

  if(!navigator.onLine){
    $("offlineBanner").classList.add("show");
  }

  init().catch(error => {
    console.error("HanVerse lesson initialization failed:",error);

    $("loadingState").innerHTML = `
      <div style="font-size:3rem">😕</div>
      <strong>We couldn't load this lesson.</strong>
      <span>${esc(error.message || "Unknown error")}</span>
      <button class="btn btn-primary" type="button" onclick="location.reload()">Try again</button>
    `;
  });

})();
</script>
</body>
</html>
