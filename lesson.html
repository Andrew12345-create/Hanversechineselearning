<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HanVerse | Lesson</title>
<meta name="description" content="Learn Mandarin with HanVerse.">
<style>
:root{
  --red:#e63946;--yellow:#f4d35e;--blue:#4ea8de;--green:#74c69d;
  --cream:#fffdf7;--ink:#172033;--muted:#687083;--line:#e9e5dc;
  --white:#fff;--shadow:0 18px 50px rgba(31,38,55,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.navbar{position:sticky;top:0;z-index:50;background:rgba(255,253,247,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1180px;margin:auto;min-height:72px;padding:0 22px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.3rem}
.logo-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--red);color:#fff;font-size:1.35rem;box-shadow:0 7px 18px rgba(230,57,70,.22)}
.nav-links{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav-link{padding:10px 13px;border-radius:11px;color:#4f586a;font-weight:700;font-size:.94rem}
.nav-link:hover,.nav-link.active{background:#fff;color:var(--red)}
.nav-actions{display:flex;align-items:center;gap:9px}
.btn{border:0;border-radius:13px;padding:11px 17px;font-weight:800;transition:.18s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.48;cursor:not-allowed}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(230,57,70,.18)}
.btn-success{background:var(--green);color:#123b2b}
.mobile-toggle{display:none;border:0;background:#fff;border:1px solid var(--line);border-radius:11px;width:42px;height:42px;font-size:1.2rem}
.mobile-menu{display:none}
.page{max-width:1050px;margin:0 auto;padding:38px 20px 70px}
.lesson-header{display:flex;justify-content:space-between;gap:25px;align-items:flex-start;margin-bottom:25px}
.eyebrow{color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.09em;font-size:.76rem}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.05;margin:8px 0 10px;letter-spacing:-.04em}
.subtitle{color:var(--muted);font-size:1.05rem;line-height:1.6;max-width:700px;margin:0}
.lesson-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.83rem;font-weight:800}
.progress-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;min-width:230px;box-shadow:var(--shadow)}
.progress-top{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;margin-bottom:10px}
.progress-track{height:9px;background:#eeeae1;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--yellow));border-radius:999px;transition:.3s}
.lesson-shell{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.stepper{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;overflow-x:auto}
.step{width:34px;height:34px;border-radius:50%;background:#eeeae1;color:#777;display:grid;place-items:center;flex:0 0 auto;font-size:.82rem;font-weight:900}
.step.active{background:var(--red);color:#fff}
.step.completed{background:var(--green);color:#123b2b}
.connector{height:3px;background:#eeeae1;min-width:24px;flex:1}
.connector.completed{background:var(--green)}
.slide-viewport{overflow:hidden}
.slide-wrapper{display:flex;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.slide{min-width:100%;padding:38px clamp(22px,6vw,70px) 44px;min-height:430px}
.slide h2{font-size:clamp(1.55rem,3vw,2.3rem);margin:0 0 12px}
.slide-intro{color:var(--muted);line-height:1.65;margin:0 0 25px}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.vocab-card{background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:20px;position:relative}
.vocab-card .hanzi{font-size:2rem;font-weight:900}
.vocab-card .pinyin{font-weight:800;color:var(--red);margin:5px 0}
.vocab-card .english{color:var(--muted)}
.speak{position:absolute;right:12px;top:12px;border:0;background:#fff;border:1px solid var(--line);width:34px;height:34px;border-radius:10px}
.challenge{max-width:760px;margin:auto}
.question{font-size:1.35rem;font-weight:900;margin:0 0 20px}
.options{display:grid;gap:11px}
.option{border:2px solid var(--line);background:#fff;border-radius:15px;padding:15px;text-align:left;font-weight:750}
.option:hover:not(:disabled){border-color:var(--blue);background:#f8fcff}
.option.correct{border-color:var(--green);background:#effbf5}
.option.wrong{border-color:var(--red);background:#fff2f3}
.feedback{margin-top:16px;padding:13px 15px;border-radius:13px;font-weight:750;display:none}
.feedback.show{display:block}
.feedback.good{background:#effbf5;color:#246548}
.feedback.bad{background:#fff2f3;color:#a3222e}
.nav-footer{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 24px;border-top:1px solid var(--line);background:#fff}
.slide-counter{font-size:.86rem;color:var(--muted);font-weight:800}
.complete-panel{text-align:center;padding:35px 15px}
.complete-icon{font-size:4rem}
.complete-panel h2{margin:10px 0}
.complete-panel p{color:var(--muted)}
.notice{margin:15px 0;padding:13px 15px;border-radius:14px;font-size:.9rem;display:none}
.notice.show{display:block}
.notice.error{background:#fff2f3;color:#a3222e}
.notice.info{background:#eef8ff;color:#245b7d}
.loading{padding:70px 20px;text-align:center;color:var(--muted)}
.spinner{width:38px;height:38px;border:4px solid #eeeae1;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 15px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){
  .nav-links,.nav-actions{display:none}.mobile-toggle{display:block;margin-left:auto}
  .mobile-menu{display:none;padding:8px 20px 18px;border-top:1px solid var(--line);background:var(--cream)}
  .mobile-menu.open{display:grid}.mobile-menu a{padding:13px;border-radius:10px;font-weight:800}
  .mobile-menu a:hover{background:#fff}
  .lesson-header{flex-direction:column}.progress-card{width:100%}
}
@media(max-width:560px){
  .nav-inner{min-height:64px;padding:0 15px}.page{padding:25px 12px 45px}
  .lesson-shell{border-radius:20px}.stepper{padding:14px}.slide{padding:28px 18px 32px;min-height:400px}
  .nav-footer{padding:14px;flex-wrap:wrap}.nav-footer .btn{flex:1}
  .nav-footer .slide-counter{width:100%;text-align:center;order:-1}
  .vocab-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-mark">🐼</span><span>HanVerse</span></a>
    <nav class="nav-links" id="desktopNav"></nav>
    <div class="nav-actions" id="desktopActions"></div>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Open menu" aria-expanded="false">☰</button>
  </div>
  <div class="mobile-menu" id="mobileMenu"></div>
</header>

<main class="page">
  <div id="topNotice" class="notice"></div>
  <section class="lesson-header" id="lessonHeader">
    <div>
      <div class="eyebrow">HanVerse Lesson</div>
      <h1 id="lessonTitle">Loading lesson…</h1>
      <p class="subtitle" id="lessonDescription">Getting your lesson ready.</p>
      <div class="lesson-meta" id="lessonMeta"></div>
    </div>
    <aside class="progress-card">
      <div class="progress-top"><span>Lesson progress</span><span id="progressPercent">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="headerProgress"></div></div>
      <div style="margin-top:10px;font-size:.8rem;color:var(--muted)" id="saveStatus">Ready to learn</div>
    </aside>
  </section>

  <section class="lesson-shell" id="lessonShell">
    <div class="stepper" id="stepper"></div>
    <div id="loadingState" class="loading"><div class="spinner"></div>Loading your lesson…</div>
    <div class="slide-viewport" id="slideViewport" style="display:none">
      <div class="slide-wrapper" id="slideWrapper"></div>
    </div>
    <div class="nav-footer" id="lessonNav" style="display:none">
      <button class="btn btn-outline" id="prevBtn">← Back</button>
      <div class="slide-counter" id="slideCounter">1 / 1</div>
      <button class="btn btn-primary" id="nextBtn">Next →</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const API_BASE = "/api";
  const state = {
    lesson: null,
    slides: [],
    currentSlide: 0,
    totalSlides: 0,
    quizAnswered: {},
    savedProgress: null,
    completed: false,
    saving: false
  };

  const $ = id => document.getElementById(id);

  function session() {
    const keys = ["hanverseUser","user","userData","currentUser","authUser","session"];
    for (const key of keys) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        const value = JSON.parse(raw);
        if (value && typeof value === "object") return value.user || value.data || value;
      } catch {}
    }
    return null;
  }

  function getUser() {
    const s = session();
    if (!s) return null;
    return s;
  }

  function userId() {
    const u = getUser();
    return u?.user_id || u?.userId || u?.id || u?._id || null;
  }

  function userName() {
    const u = getUser();
    return u?.full_name || u?.fullName || u?.name ||
      [u?.first_name,u?.last_name].filter(Boolean).join(" ") || u?.username || "";
  }

  function role() {
    const u = getUser();
    return String(u?.role || (u?.is_admin ? "admin" : "") || "").toLowerCase();
  }

  function apiUrl(path) {
    return `${API_BASE}/${String(path).replace(/^\\/+/, "")}`;
  }

  async function getJSON(path) {
    const response = await fetch(apiUrl(path), {
      method:"GET",
      headers:{Accept:"application/json"},
      credentials:"include",
      cache:"no-store"
    });
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}
    if (!response.ok) {
      throw new Error((data && (data.error || data.message)) || `HTTP ${response.status}`);
    }
    return data;
  }

  async function postJSON(path, body) {
    const response = await fetch(apiUrl(path), {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      credentials:"include",
      body:JSON.stringify(body)
    });
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}
    if (!response.ok) {
      throw new Error((data && (data.error || data.message)) || `HTTP ${response.status}`);
    }
    return data;
  }

  function lessonIdFromURL() {
    return new URLSearchParams(location.search).get("id") || "lesson_1";
  }

  function normalizeLesson(raw) {
    const l = raw?.lesson || raw?.data || raw;
    if (!l || typeof l !== "object") throw new Error("Invalid lesson returned by server.");
    return {
      id: l.id || l._id || l.lessonId || l.lesson_id || lessonIdFromURL(),
      title: l.title || "Untitled Lesson",
      description: l.description || "",
      level: Number(l.level ?? 1),
      premium: Boolean(l.premium),
      xp: Number(l.xp ?? 10),
      icon: l.icon || "📚",
      vocabulary: Array.isArray(l.vocabulary) ? l.vocabulary : [],
      quiz: Array.isArray(l.quiz) ? l.quiz : []
    };
  }

  function showNotice(message, type="info") {
    const el = $("topNotice");
    el.textContent = message;
    el.className = `notice show ${type}`;
  }

  function clearNotice() {
    $("topNotice").className = "notice";
    $("topNotice").textContent = "";
  }

  function renderNavbar() {
    const u = getUser();
    const logged = !!u;
    const r = role();

    let links = `
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link active" href="learn.html" aria-current="page">Learn</a>
      <a class="nav-link" href="worksheets.html">Worksheets</a>
    `;
    if (r === "parent" || u?.is_parent) links += `<a class="nav-link" href="parent.html">Parent</a>`;
    if (r === "admin" || u?.is_admin) links += `<a class="nav-link" href="admin.html">Admin</a>`;
    $("desktopNav").innerHTML = links;

    $("desktopActions").innerHTML = logged
      ? `<a class="btn btn-outline" href="profile.html">👤 ${escapeHTML(userName() || "Profile")}</a>`
      : `<a class="btn btn-outline" href="login.html">Log in</a><a class="btn btn-primary" href="signup.html">Start learning</a>`;

    $("mobileMenu").innerHTML = links +
      (logged
        ? `<a href="profile.html">👤 ${escapeHTML(userName() || "Profile")}</a>`
        : `<a href="login.html">Log in</a><a href="signup.html">Start learning</a>`);
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function buildSlides(lesson) {
    const slides = [{
      type:"intro",
      title:lesson.title,
      description:lesson.description,
      icon:lesson.icon
    }];

    if (lesson.vocabulary.length) {
      slides.push({
        type:"vocab",
        title:"Learn the vocabulary",
        description:"Study each word, its pronunciation, and its meaning.",
        items:lesson.vocabulary
      });
    }

    lesson.quiz.forEach((q, i) => {
      slides.push({
        type:"quiz",
        title:`Quick challenge ${i + 1}`,
        question:q.question,
        options:Array.isArray(q.options) ? q.options : [],
        correct:Number(q.correct ?? 0)
      });
    });

    slides.push({
      type:"complete",
      title:"Lesson complete!",
      description:"Great work. Your progress will be saved so your roadmap knows you've finished this lesson."
    });

    return slides;
  }

  function renderHeader() {
    const l = state.lesson;
    $("lessonTitle").textContent = `${l.icon} ${l.title}`;
    $("lessonDescription").textContent = l.description;
    $("lessonMeta").innerHTML =
      `<span class="pill">Level ${l.level}</span>` +
      `<span class="pill">⭐ ${l.xp} XP</span>` +
      (l.premium ? `<span class="pill">Premium</span>` : `<span class="pill">Free</span>`);
  }

  function renderStepper() {
    const stepper = $("stepper");
    stepper.innerHTML = "";
    state.slides.forEach((_, i) => {
      const step = document.createElement("div");
      step.className = "step";
      step.textContent = i + 1;
      step.dataset.index = i;
      stepper.appendChild(step);
      if (i < state.slides.length - 1) {
        const connector = document.createElement("div");
        connector.className = "connector";
        connector.dataset.connector = i;
        stepper.appendChild(connector);
      }
    });
  }

  function vocabHTML(items) {
    return `<div class="vocab-grid">${items.map((v,i) => `
      <article class="vocab-card">
        <button class="speak" type="button" data-speak="${escapeHTML(v.pinyin || v.chinese || "")}" aria-label="Play pronunciation">🔊</button>
        <div class="hanzi">${escapeHTML(v.chinese || "")}</div>
        <div class="pinyin">${escapeHTML(v.pinyin || "")}</div>
        <div class="english">${escapeHTML(v.english || "")}</div>
      </article>
    `).join("")}</div>`;
  }

  function slideHTML(slide, index) {
    if (slide.type === "intro") return `
      <div class="slide">
        <div style="font-size:4rem;margin-bottom:12px">${escapeHTML(slide.icon)}</div>
        <h2>Ready? Let's learn.</h2>
        <p class="slide-intro">${escapeHTML(slide.description)}</p>
        <div class="vocab-card" style="max-width:620px">
          <strong>What you'll do</strong>
          <p style="color:var(--muted);line-height:1.6;margin-bottom:0">
            Learn new Mandarin vocabulary, test yourself with short challenges, and finish the lesson to save your progress.
          </p>
        </div>
      </div>`;

    if (slide.type === "vocab") return `
      <div class="slide">
        <h2>📚 ${escapeHTML(slide.title)}</h2>
        <p class="slide-intro">${escapeHTML(slide.description)}</p>
        ${vocabHTML(slide.items)}
      </div>`;

    if (slide.type === "quiz") return `
      <div class="slide">
        <div class="challenge">
          <div class="eyebrow">Challenge</div>
          <h2>${escapeHTML(slide.title)}</h2>
          <p class="question">${escapeHTML(slide.question)}</p>
          <div class="options">
            ${slide.options.map((option, i) =>
              `<button type="button" class="option" data-option="${i}">${escapeHTML(option)}</button>`
            ).join("")}
          </div>
          <div class="feedback" id="feedback-${index}"></div>
        </div>
      </div>`;

    return `
      <div class="slide">
        <div class="complete-panel">
          <div class="complete-icon">🎉</div>
          <h2>${escapeHTML(slide.title)}</h2>
          <p>${escapeHTML(slide.description)}</p>
          <div class="vocab-card" style="max-width:430px;margin:25px auto">
            <strong>⭐ ${state.lesson.xp} XP</strong>
            <p style="margin:7px 0 0;color:var(--muted)">Your progress is saved when you finish.</p>
          </div>
          <button class="btn btn-success" id="finishBtn" type="button">✓ Complete & save lesson</button>
        </div>
      </div>`;
  }

  function renderSlides() {
    state.totalSlides = state.slides.length;
    state.currentSlide = Math.min(
      Math.max(0, state.currentSlide),
      Math.max(0, state.totalSlides - 1)
    );

    $("slideWrapper").innerHTML = state.slides.map(slideHTML).join("");
    renderStepper();

    $("loadingState").style.display = "none";
    $("slideViewport").style.display = "block";
    $("lessonNav").style.display = "flex";

    bindSlideEvents();
    updateUI();
  }

  function bindSlideEvents() {
    document.querySelectorAll("[data-speak]").forEach(btn => {
      btn.addEventListener("click", () => speak(btn.dataset.speak));
    });

    document.querySelectorAll(".slide").forEach((slideEl, slideIndex) => {
      const slide = state.slides[slideIndex];
      if (slide.type !== "quiz") return;

      slideEl.querySelectorAll("[data-option]").forEach(btn => {
        btn.addEventListener("click", () => answerQuiz(slideIndex, Number(btn.dataset.option)));
      });
    });

    const finish = $("finishBtn");
    if (finish) finish.addEventListener("click", completeLesson);
  }

  function speak(text) {
    if (!("speechSynthesis" in window) || !text) return;
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "zh-CN";
    utterance.rate = .82;
    speechSynthesis.speak(utterance);
  }

  function answerQuiz(slideIndex, selected) {
    const slide = state.slides[slideIndex];
    if (!slide || slide.type !== "quiz") return;

    state.quizAnswered[slideIndex] = selected;

    const slideEl = document.querySelectorAll(".slide")[slideIndex];
    slideEl.querySelectorAll(".option").forEach((btn, i) => {
      btn.disabled = true;
      if (i === slide.correct) btn.classList.add("correct");
      if (i === selected && selected !== slide.correct) btn.classList.add("wrong");
    });

    const feedback = slideEl.querySelector(".feedback");
    const correct = selected === slide.correct;
    feedback.className = `feedback show ${correct ? "good" : "bad"}`;
    feedback.textContent = correct ? "✓ Correct! Great job." : `Not quite. The correct answer is ${slide.options[slide.correct]}.`;

    updateUI();
  }

  function quizPassed() {
    return state.slides.every((slide, i) =>
      slide.type !== "quiz" || state.quizAnswered[i] === slide.correct
    );
  }

  function updateUI() {
    const total = state.totalSlides;

    if (!total) return;

    const percent = Math.round(((state.currentSlide + 1) / total) * 100);
    $("slideWrapper").style.transform = `translateX(-${state.currentSlide * 100}%)`;
    $("progressPercent").textContent = `${state.completed ? 100 : percent}%`;
    $("headerProgress").style.width = `${state.completed ? 100 : percent}%`;
    $("slideCounter").textContent = `${state.currentSlide + 1} / ${total}`;

    document.querySelectorAll(".step").forEach((el, i) => {
      el.classList.toggle("active", i === state.currentSlide);
      el.classList.toggle("completed", i < state.currentSlide || state.completed);
    });
    document.querySelectorAll(".connector").forEach((el, i) => {
      el.classList.toggle("completed", i < state.currentSlide || state.completed);
    });

    const last = state.currentSlide === total - 1;
    $("prevBtn").disabled = state.currentSlide === 0;
    $("nextBtn").disabled = last || (
      state.slides[state.currentSlide]?.type === "quiz" &&
      state.quizAnswered[state.currentSlide] === undefined
    );

    $("nextBtn").textContent = last ? "Completed" : "Next →";
  }

  function nextSlide() {
    if (state.currentSlide >= state.totalSlides - 1) return;
    state.currentSlide++;
    updateUI();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function prevSlide() {
    if (state.currentSlide <= 0) return;
    state.currentSlide--;
    updateUI();
  }

  function normalizeProgress(raw) {
    const p = raw?.progress ?? raw?.lessonProgress ?? raw?.data ?? raw;
    if (!p || typeof p !== "object") return null;

    const completed =
      p.completed === true ||
      p.is_completed === true ||
      p.status === "completed";

    let percent = Number(
      p.progress_pct ?? p.completed_pct ?? p.progressPercent ?? p.percentage ?? 0
    );

    if (!Number.isFinite(percent)) percent = 0;
    percent = Math.max(0, Math.min(100, percent));

    return {
      ...p,
      completed,
      percent
    };
  }

  async function fetchSavedProgress() {
    const uid = userId();
    const lid = state.lesson.id;

    if (!uid || !lid) {
      $("saveStatus").textContent = "Not signed in — progress won't be saved.";
      return null;
    }

    try {
      const raw = await getJSON(
        `progress/${encodeURIComponent(uid)}/${encodeURIComponent(lid)}`
      );
      const progress = normalizeProgress(raw);

      if (progress?.completed) state.completed = true;

      if (progress) {
        $("saveStatus").textContent = progress.completed
          ? "✓ Already completed"
          : `${progress.percent}% saved`;
      }

      return progress;
    } catch (error) {
      console.warn("HanVerse saved progress lookup failed:", error);
      $("saveStatus").textContent = "Progress unavailable — lesson still works.";
      return null;
    }
  }

  async function saveProgress(completed) {
    const uid = userId();
    if (!uid) {
      showNotice("You're learning as a guest. Sign in to save your progress.", "info");
      return false;
    }

    state.saving = true;
    $("saveStatus").textContent = completed ? "Saving completion…" : "Saving progress…";

    try {
      const body = {
        user_id: uid,
        lesson_id: state.lesson.id,
        progress_pct: completed ? 100 : Math.round(
          ((state.currentSlide + 1) / Math.max(1, state.totalSlides)) * 100
        ),
        completed: Boolean(completed),
        xp_earned: completed ? state.lesson.xp : 0
      };

      await postJSON("progress", body);

      state.completed = completed || state.completed;
      $("saveStatus").textContent = state.completed ? "✓ Progress saved" : "✓ Progress saved";
      return true;
    } catch (error) {
      console.error("HanVerse progress save failed:", error);
      $("saveStatus").textContent = "Could not save progress.";
      showNotice(`Your lesson loaded, but progress could not be saved: ${error.message}`, "error");
      return false;
    } finally {
      state.saving = false;
    }
  }

  async function completeLesson() {
    if (state.saving) return;

    if (!quizPassed()) {
      showNotice("Please answer the challenges correctly before completing the lesson.", "info");
      return;
    }

    const saved = await saveProgress(true);
    if (saved) {
      state.completed = true;
      updateUI();
      $("progressPercent").textContent = "100%";
      $("headerProgress").style.width = "100%";

      const finish = $("finishBtn");
      if (finish) {
        finish.textContent = "✓ Lesson saved";
        finish.disabled = true;
      }

      showNotice("🎉 Lesson completed! Your roadmap has been updated.", "info");
    }
  }

  async function loadLesson() {
    const id = lessonIdFromURL();
    clearNotice();

    try {
      const raw = await getJSON(`lessons/${encodeURIComponent(id)}`);
      state.lesson = normalizeLesson(raw);
      state.slides = buildSlides(state.lesson);
      renderHeader();

      // Progress is deliberately independent from lesson loading.
      state.savedProgress = await fetchSavedProgress();

      if (state.savedProgress?.completed) {
        state.completed = true;
      }

      renderSlides();
    } catch (error) {
      console.error("HanVerse lesson initialization failed:", error);
      $("loadingState").innerHTML = `
        <div style="font-size:3rem">😕</div>
        <h2>We couldn't load this lesson</h2>
        <p>${escapeHTML(error.message || "Unknown error")}</p>
        <button class="btn btn-primary" id="retryBtn">Try again</button>
      `;
      $("retryBtn").addEventListener("click", () => location.reload());
    }
  }

  function init() {
    renderNavbar();

    const toggleButton = $("mobileToggle");
    const mobileMenu = $("mobileMenu");

    toggleButton.addEventListener("click", () => {
      const open = mobileMenu.classList.toggle("open");
      toggleButton.setAttribute("aria-expanded", String(open));
      toggleButton.textContent = open ? "✕" : "☰";
    });

    mobileMenu.addEventListener("click", e => {
      if (e.target.closest("a")) {
        mobileMenu.classList.remove("open");
        toggleButton.textContent = "☰";
        toggleButton.setAttribute("aria-expanded","false");
      }
    });

    $("prevBtn").addEventListener("click", prevSlide);
    $("nextBtn").addEventListener("click", nextSlide);

    loadLesson();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
