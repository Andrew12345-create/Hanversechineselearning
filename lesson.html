        // ============================================================
        // SLIDE GENERATORS
        // ============================================================
        function generateSlides(lesson, userLevel, isPremiumUser) {
            const slides = [];

            // Slide 1: Welcome
            slides.push({
                type: 'welcome',
                id: 'welcome',
                data: {
                    title: `Today's Mission: ${lesson.title}`,
                    subtitle: lesson.description || 'Let\'s learn something new today!',
                    emoji: lesson.icon || '📚',
                    buttonText: 'Start Adventure →'
                }
            });

            // Vocabulary slides
            if (lesson.vocabulary && lesson.vocabulary.length) {
                lesson.vocabulary.forEach((word, index) => {
                    slides.push({
                        type: 'word',
                        id: `word_${index}`,
                        data: {
                            chinese: word.chinese,
                            pinyin: word.pinyin,
                            meaning: word.english,
                            emoji: word.emoji || '📖',
                            isFirst: index === 0,
                            isLast: index === lesson.vocabulary.length - 1
                        }
                    });
                });
            }

            // Story slide
            if (lesson.story && lesson.story.length) {
                slides.push({
                    type: 'story',
                    id: 'story',
                    data: {
                        panels: lesson.story
                    }
                });
            }

            // Challenge slide
            if (lesson.quiz && lesson.quiz.length) {
                slides.push({
                    type: 'challenge',
                    id: 'challenge',
                    data: {
                        questions: lesson.quiz
                    }
                });
            }

            // Celebration slide
            slides.push({
                type: 'celebration',
                id: 'celebration',
                data: {
                    title: '🌟 Mission Complete!',
                    subtitle: 'You did an amazing job!',
                    xpEarned: lesson.xp || 10
                }
            });

            return slides;
        }

        // ============================================================
        // RENDER SLIDES
        // ============================================================
        function renderSlides(slides) {
            const wrapper = document.getElementById('slideWrapper');
            const steps = document.getElementById('progressSteps');

            // Build progress steps
            const stepLabels = ['Start', ...slides.slice(1, -1).map((s, i) => {
                const labels = {
                    'word': 'Word',
                    'story': 'Story',
                    'challenge': 'Challenge'
                };
                return labels[s.type] || `Step ${i + 2}`;
            }), 'Finish'];

            steps.innerHTML = stepLabels.map((label, index) => `
                <div class="progress-step ${index === 0 ? 'active' : ''}" data-step="${index}" title="${label}">
                    <span class="step-label">${label}</span>
                </div>
                ${index < stepLabels.length - 1 ? `
                    <div class="progress-connector" data-connector="${index}">
                        <div class="fill"></div>
                    </div>
                ` : ''}
            `).join('');

            // Build slides
            wrapper.innerHTML = slides.map((slide, index) => `
                <div class="slide slide-${slide.type} ${index === 0 ? 'active' : ''}" data-slide="${index}" id="slide-${index}">
                    ${renderSlideContent(slide)}
                </div>
            `).join('');

            // Update navigation
            updateNavigation(0, slides.length);
        }

        // ============================================================
        // RENDER SLIDE CONTENT
        // ============================================================
        function renderSlideContent(slide) {
            switch (slide.type) {
                case 'welcome':
                    return `
                        <div class="emoji-large panda-greeting">${slide.data.emoji || '🐼'}</div>
                        <h2>${escapeHtml(slide.data.title)}</h2>
                        <p class="subtitle">${escapeHtml(slide.data.subtitle)}</p>
                        <button class="btn btn-primary btn-lg" onclick="goToSlide(1)">
                            ${slide.data.buttonText || 'Start Adventure →'}
                        </button>
                    `;

                case 'word':
                    return `
                        <div class="word-display">
                            <div class="illustration">${slide.data.emoji || '📖'}</div>
                            <div class="chinese-char">${slide.data.chinese}</div>
                            <div class="pinyin">${slide.data.pinyin}</div>
                            <div class="meaning">${slide.data.meaning}</div>
                            <div class="word-actions">
                                <button class="btn btn-secondary btn-icon" onclick="speakWord('${slide.data.chinese}')" title="Listen">
                                    🔊
                                </button>
                                <button class="btn btn-secondary btn-icon" onclick="flipCard(this)" title="Flip Card">
                                    🔄
                                </button>
                            </div>
                        </div>
                        <div class="flashcard" onclick="flipCard(this)">
                            <div class="flashcard-inner">
                                <div class="flashcard-front">
                                    <div class="icon">${slide.data.emoji || '📖'}</div>
                                    <div class="chinese">${slide.data.chinese}</div>
                                    <span style="font-size:0.8rem;color:var(--muted);">👆 Tap to flip</span>
                                </div>
                                <div class="flashcard-back">
                                    <div class="pinyin">${slide.data.pinyin}</div>
                                    <div class="meaning">${slide.data.meaning}</div>
                                    <div class="example">Example: ${slide.data.chinese} 👋</div>
                                </div>
                            </div>
                        </div>
                    `;

                case 'story':
                    const panels = slide.data.panels || [];
                    return `
                        <h2>📖 Story Time</h2>
                        <p class="subtitle">Follow along with Panda's adventure!</p>
                        <div class="story-panel">
                            ${panels.map((panel, i) => `
                                <div class="story-scene" style="animation-delay: ${i * 0.15}s; opacity: 0; animation: fadeUp 0.5s ease ${i * 0.15}s forwards;">
                                    <div class="scene-emoji">${panel.emoji || '🐼'}</div>
                                    <div class="scene-text">
                                        ${panel.chinese ? `<span class="chinese-highlight">${panel.chinese}</span><br>` : ''}
                                        ${panel.text || ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;

                case 'challenge':
                    const questions = slide.data.questions || [];
                    // Show only first question for simplicity, randomly pick one
                    const q = questions[Math.floor(Math.random() * questions.length)];
                    return `
                        <h2>🎯 Panda Challenge</h2>
                        <p class="subtitle">${escapeHtml(q.question)}</p>
                        <div class="challenge-options" id="challengeOptions">
                            ${q.options.map((opt, i) => `
                                <button class="challenge-option" data-option="${i}" data-correct="${i === q.correct}" onclick="checkChallengeAnswer(this, ${i === q.correct})">
                                    <span class="opt-emoji">${['🔵','🟢','🟡','🟣'][i] || '📌'}</span>
                                    ${escapeHtml(opt)}
                                </button>
                            `).join('')}
                        </div>
                        <div id="challengeFeedback" style="margin-top:12px;font-weight:600;display:none;"></div>
                    `;

                case 'celebration':
                    return `
                        <div class="celebration">
                            <div class="trophy">🏆</div>
                            <h2>${escapeHtml(slide.data.title)}</h2>
                            <p class="subtitle">${escapeHtml(slide.data.subtitle)}</p>
                            <div class="stars-display">⭐ ⭐ ⭐ ⭐ ⭐</div>
                            <div class="reward-stats">
                                <span class="reward-stat">🎯 XP: <span class="stat-value">+${slide.data.xpEarned || 10}</span></span>
                                <span class="reward-stat">⭐ Stars: <span class="stat-value">+3</span></span>
                                <span class="reward-stat">🔥 Streak: <span class="stat-value">+1</span></span>
                            </div>
                            <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;">
                                <button class="btn btn-primary" onclick="navigateTo('learn.html')">📚 More Lessons</button>
                                <button class="btn btn-success" onclick="shareProgress()">📤 Share</button>
                            </div>
                        </div>
                    `;

                default:
                    return `
                        <div class="empty-state">
                            <div class="icon">📚</div>
                            <h2>Loading...</h2>
                            <p>Please wait.</p>
                        </div>
                    `;
            }
        }

        // ============================================================
        // SLIDE NAVIGATION
        // ============================================================
        let currentSlide = 0;
        let totalSlides = 0;
        let lessonCompleted = false;

        function goToSlide(index) {
            const wrapper = document.getElementById('slideWrapper');
            const slides = wrapper.querySelectorAll('.slide');
            const total = slides.length;

            if (index < 0 || index >= total) return;

            currentSlide = index;
            wrapper.style.transform = `translateX(-${index * 100}%)`;

            // Update progress steps
            document.querySelectorAll('.progress-step').forEach((step, i) => {
                step.classList.remove('active', 'completed');
                if (i < index) step.classList.add('completed');
                if (i === index) step.classList.add('active');
            });

            // Update connectors
            document.querySelectorAll('.progress-connector').forEach((conn, i) => {
                conn.classList.remove('completed', 'partial');
                if (i < index) conn.classList.add('completed');
                else if (i === index) conn.classList.add('partial');
            });

            // Update navigation buttons
            updateNavigation(index, total);

            // Check if we reached celebration
            const currentSlideEl = slides[index];
            if (currentSlideEl && currentSlideEl.classList.contains('slide-celebration')) {
                fireConfetti(80);
                if (!lessonCompleted) {
                    lessonCompleted = true;
                    const lessonId = getUrlParam('id') || 'lesson_1';
                    completeLesson(lessonId);
                }
            }

            // Update slide counter
            document.getElementById('slideCounter').textContent = `${index + 1} / ${total}`;
        }

        function nextSlide() {
            const wrapper = document.getElementById('slideWrapper');
            const slides = wrapper.querySelectorAll('.slide');
            if (currentSlide < slides.length - 1) {
                goToSlide(currentSlide + 1);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                goToSlide(currentSlide - 1);
            }
        }

        function updateNavigation(index, total) {
            const prevBtn = document.getElementById('prevSlideBtn');
            const nextBtn = document.getElementById('nextSlideBtn');

            prevBtn.disabled = index === 0;

            // Change next button text on last slide
            if (index === total - 1) {
                nextBtn.textContent = '🎉 Done!';
                nextBtn.className = 'btn btn-success';
                nextBtn.disabled = false;
            } else {
                const slide = document.querySelector(`.slide[data-slide="${index}"]`);
                if (slide && slide.classList.contains('slide-challenge')) {
                    // Check if challenge is completed
                    const feedback = document.getElementById('challengeFeedback');
                    if (feedback && feedback.style.display !== 'none') {
                        nextBtn.textContent = 'Next →';
                        nextBtn.className = 'btn btn-primary';
                        nextBtn.disabled = false;
                    } else {
                        nextBtn.textContent = 'Answer first!';
                        nextBtn.className = 'btn btn-secondary';
                        nextBtn.disabled = true;
                    }
                } else {
                    nextBtn.textContent = 'Next →';
                    nextBtn.className = 'btn btn-primary';
                    nextBtn.disabled = false;
                }
            }
        }

        // ============================================================
        // CHALLENGE / QUIZ FUNCTIONS
        // ============================================================
        function checkChallengeAnswer(element, isCorrect) {
            const options = document.querySelectorAll('.challenge-option');
            const feedback = document.getElementById('challengeFeedback');

            if (options[0].classList.contains('disabled')) return;

            // Disable all options
            options.forEach(opt => opt.classList.add('disabled'));

            if (isCorrect) {
                element.classList.add('correct');
                feedback.textContent = '🎉 Correct! Amazing job! ⭐';
                feedback.style.display = 'block';
                feedback.style.color = '#065F46';
                feedback.style.background = '#D1FAE5';
                feedback.style.padding = '12px 20px';
                feedback.style.borderRadius = '12px';
                showToast('success', '🎉 Correct! You\'re awesome!');
                // Enable next button
                const nextBtn = document.getElementById('nextSlideBtn');
                nextBtn.disabled = false;
                nextBtn.textContent = 'Next →';
                nextBtn.className = 'btn btn-primary';
            } else {
                element.classList.add('wrong');
                // Show correct answer
                options.forEach(opt => {
                    if (opt.dataset.correct === 'true') {
                        opt.classList.add('correct');
                    }
                });
                feedback.textContent = '🔄 Not quite! The correct answer is highlighted. Keep trying!';
                feedback.style.display = 'block';
                feedback.style.color = '#991B1B';
                feedback.style.background = '#FEE2E2';
                feedback.style.padding = '12px 20px';
                feedback.style.borderRadius = '12px';
                showToast('warning', '🔄 Not quite! Keep going!');

                // Re-enable after showing correct answer
                setTimeout(() => {
                    options.forEach(opt => {
                        opt.classList.remove('disabled', 'wrong', 'correct');
                        opt.classList.add('disabled');
                    });
                    // Show retry button
                    feedback.innerHTML = '🔄 Click here to try again!';
                    feedback.style.cursor = 'pointer';
                    feedback.onclick = function() {
                        options.forEach(opt => {
                            opt.classList.remove('disabled', 'wrong', 'correct');
                        });
                        feedback.style.display = 'none';
                        feedback.onclick = null;
                        // Enable options again
                        options.forEach(opt => opt.classList.remove('disabled'));
                    };
                }, 1000);
            }
        }

        // ============================================================
        // FLASHCARD FUNCTIONS
        // ============================================================
        function flipCard(element) {
            const card = element.closest('.flashcard');
            if (card) {
                card.classList.toggle('flipped');
                // Play a subtle sound effect via haptic feedback simulation
                if (navigator.vibrate) navigator.vibrate(10);
            }
        }

        // ============================================================
        // SPEAK / AUDIO FUNCTIONS
        // ============================================================
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.7;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
                showToast('info', '🔊 Listening to pronunciation...');
            } else {
                showToast('warning', '🔊 Audio not supported on this device.');
            }
        }

        // ============================================================
        // COMPLETE LESSON
        // ============================================================
        let lessonStartTime = Date.now();

        function getTimeSpent() {
            return Math.floor((Date.now() - lessonStartTime) / 1000);
        }

        async function completeLesson(lessonId) {
            const session = getSession();
            if (!session) {
                navigateTo('login.html');
                return;
            }

            const lesson = window.currentLesson;
            const xpEarned = lesson?.xp || 10;
            const timeSpent = getTimeSpent();

            // Mark as completed locally
            localStorage.setItem(`lesson_${lessonId}_completed`, 'true');

            // Update display
            document.getElementById('completionBadge').style.display = 'inline-block';
            document.getElementById('xpDisplay').textContent = (parseInt(document.getElementById('xpDisplay').textContent) || 0) +
                xpEarned;

            // Show XP toast
            showToast('success', `🎉 +${xpEarned} XP earned!`);

            // Sync with backend
            if (navigator.onLine) {
                try {
                    await apiCall('/progress', {
                        method: 'POST',
                        body: JSON.stringify({
                            userId: session.user_id,
                            lessonId: lessonId,
                            completed: true,
                            xpEarned: xpEarned,
                            timeSpent: timeSpent
                        })
                    });
                    log('✅ Progress synced with server');
                } catch (error) {
                    errorLog('Failed to sync progress:', error);
                    queueOfflineProgress(session.user_id, lessonId, xpEarned);
                }
            } else {
                queueOfflineProgress(session.user_id, lessonId, xpEarned);
            }

            // Update session
            try {
                const userData = await apiCall(`/user/${session.user_id}`);
                if (userData.user) {
                    setSession({ ...session, ...userData.user });
                }
            } catch (e) {
                // Silent fail
            }
        }

        function queueOfflineProgress(userId, lessonId, xpEarned) {
            const queueKey = 'hanverse_offline_queue';
            try {
                let queue = JSON.parse(localStorage.getItem(queueKey) || '[]');
                queue.push({
                    id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    type: 'progress',
                    data: {
                        userId: userId,
                        lessonId: lessonId,
                        completed: true,
                        xpEarned: xpEarned,
                        timestamp: new Date().toISOString()
                    },
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem(queueKey, JSON.stringify(queue));
            } catch (error) {
                errorLog('Failed to queue progress:', error);
            }
        }

        // ============================================================
        // SHARE PROGRESS
        // ============================================================
        function shareProgress() {
            const lesson = window.currentLesson;
            const completed = localStorage.getItem(`lesson_${lesson.id}_completed`) === 'true';
            const text = completed ?
                `🎉 I just completed "${lesson.title}" on HanVerse! Learning Mandarin is so much fun! 🐼✨` :
                `📚 I'm learning Mandarin on HanVerse! Join me on this adventure! 🐼`;

            if (navigator.share) {
                navigator.share({
                    title: 'HanVerse Progress',
                    text: text,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('success', '📋 Copied to clipboard! Share with your friends!');
                }).catch(() => {
                    showToast('info', '📤 Share this achievement with your friends!');
                });
            }
        }

        // ============================================================
        // PANDA AI CHAT
        // ============================================================
        const chatFallbacks = [
            "That's a great question about this lesson! Let me help you understand it better. 🐼",
            "Good question! Here's a simple explanation... 📚",
            "I love how curious you are! Let's learn this together. 🌟",
            "That's a tricky one! Let me break it down for you. 🎯",
            "You're doing great! Keep asking questions. 💪",
            "Let me explain that with an example... 🤗",
            "That's a really good question! Here's what you need to know. 💭",
            "Keep up the great work! You're learning so much! 🚀"
        ];

        async function sendPandaMessage() {
            const input = document.getElementById('pandaInput');
            const body = document.getElementById('pandaBody');
            const text = input.value.trim();

            if (!text) return;

            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `<div class="message user-message">${escapeHtml(text)}</div>`;
            body.appendChild(userRow);

            input.value = '';
            input.style.height = 'auto';
            body.scrollTop = body.scrollHeight;

            const typing = document.createElement('div');
            typing.className = 'message-row';
            typing.id = 'typingIndicator';
            typing.innerHTML = `
                <div class="panda-avatar">🐼</div>
                <div class="message panda-message" style="font-style: italic; opacity: 0.7;">🐼 Thinking...</div>
            `;
            body.appendChild(typing);
            body.scrollTop = body.scrollHeight;

            const lessonId = getUrlParam('id') || 'lesson_1';
            const lesson = window.currentLesson;

            try {
                const response = await apiCall('/panda-chat', {
                    method: 'POST',
                    body: JSON.stringify({
                        message: text,
                        context: {
                            lessonId: lessonId,
                            lessonTitle: lesson?.title || 'Current Lesson',
                            level: lesson?.level || 1
                        }
                    })
                });

                const typingEl = document.getElementById('typingIndicator');
                if (typingEl) typingEl.remove();

                const aiRow = document.createElement('div');
                aiRow.className = 'message-row';
                const reply = response.reply || "🐼 I'm not sure about that one. Try asking about the lesson content!";
                aiRow.innerHTML = `
                    <div class="panda-avatar">🐼</div>
                    <div class="message panda-message">${escapeHtml(reply)}</div>
                `;
                body.appendChild(aiRow);
                body.scrollTop = body.scrollHeight;

            } catch (error) {
                const typingEl = document.getElementById('typingIndicator');
                if (typingEl) typingEl.remove();

                const fallback = chatFallbacks[Math.floor(Math.random() * chatFallbacks.length)];
                const aiRow = document.createElement('div');
                aiRow.className = 'message-row';
                aiRow.innerHTML = `
                    <div class="panda-avatar">🐼</div>
                    <div class="message panda-message">${fallback}</div>
                `;
                body.appendChild(aiRow);
                body.scrollTop = body.scrollHeight;

                errorLog('Panda chat fallback used:', error.message);
            }
        }

        // ============================================================
        // PREMIUM POPUP
        // ============================================================
        function showPremiumPopup() {
            const existing = document.querySelector('.premium-popup');
            if (existing) existing.remove();

            const popup = document.createElement('div');
            popup.className = 'premium-popup';
            popup.style.display = 'block';
            popup.innerHTML = `
                <div class="premium-overlay">
                    <div class="premium-content">
                        <button class="close-popup" onclick="this.closest('.premium-popup').remove()">✕</button>
                        <img src="pay-hanverse-subscription-card.png" class="premium-image" onclick="window.location.href='payment.html'" alt="Premium Upgrade">
                    </div>
                </div>
            `;
            document.body.appendChild(popup);

            popup.querySelector('.premium-overlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    popup.remove();
                }
            });
        }

        // ============================================================
        // NAVBAR
        // ============================================================
        function updateNavbar() {
            const navButtons = document.getElementById('navButtons');
            if (!navButtons) return;

            const session = getSession();

            if (session && (session.user_id || session.id)) {
                const displayName = session.full_name || session.fullName || session.username || 'Learner';
                const premium = session.premium || session.is_premium || false;

                navButtons.innerHTML = `
                    <div class="user-chip" onclick="navigateTo('profile.html')">
                        <div class="user-avatar">
                            ${session.profile_picture ? `<img src="${session.profile_picture}" alt="${displayName}">` : '🐼'}
                        </div>
                        <div class="user-info">
                            <div class="user-name">${escapeHtml(displayName)}</div>
                            <div class="user-status">
                                <span class="premium-dot" style="${premium ? '' : 'background: #94A3B8;'}"></span>
                                <span ${premium ? 'class="premium-text"' : ''}>
                                    ${premium ? '⭐ Premium' : 'Free Member'}
                                </span>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-logout" onclick="handleLogout()">Log Out</button>
                `;
            } else {
                navButtons.innerHTML = `
                    <button class="btn btn-login" onclick="navigateTo('login.html')">Log In</button>
                    <button class="btn btn-signup" onclick="navigateTo('signup.html')">Sign Up</button>
                `;
            }
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        function handleLogout() {
            if (confirm('Are you sure you want to log out?')) {
                clearSession();
                updateNavbar();
                showToast('success', 'Logged out successfully');
                window.location.reload();
            }
        }

        // ============================================================
        // NAVBAR SCROLL EFFECT
        // ============================================================
        const nav = document.getElementById('topNav');
        let lastScrollY = 0;
        let ticking = false;

        function handleNavScroll() {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    const scrollY = window.scrollY;
                    if (scrollY > 40) {
                        nav.classList.add('shrunk');
                    } else {
                        nav.classList.remove('shrunk');
                    }
                    lastScrollY = scrollY;
                    ticking = false;
                });
                ticking = true;
            }
        }

        window.addEventListener('scroll', handleNavScroll, { passive: true });

        // ============================================================
        // OFFLINE DETECTION
        // ============================================================
        const offlineBanner = document.getElementById('offline-banner');

        function updateOfflineStatus() {
            if (!navigator.onLine) {
                offlineBanner.classList.add('show');
                showToast('warning', '🔴 You are offline. Progress will sync when back online.');
            } else {
                offlineBanner.classList.remove('show');
            }
        }

        window.addEventListener('online', updateOfflineStatus);
        window.addEventListener('offline', updateOfflineStatus);
        updateOfflineStatus();

        // ============================================================
        // PANDA CHAT UI CONTROLS
        // ============================================================
        const pandaFab = document.getElementById('pandaFab');
        const pandaChat = document.getElementById('pandaChat');
        const pandaClose = document.getElementById('pandaClose');
        const pandaInput = document.getElementById('pandaInput');
        const pandaSend = document.getElementById('pandaSend');

        function togglePanda() {
            pandaChat.classList.toggle('open');
            if (pandaChat.classList.contains('open')) {
                setTimeout(() => pandaInput.focus(), 100);
            }
        }

        pandaFab.addEventListener('click', togglePanda);
        pandaClose.addEventListener('click', togglePanda);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && pandaChat.classList.contains('open')) {
                togglePanda();
            }
        });

        pandaSend.addEventListener('click', sendPandaMessage);

        pandaInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendPandaMessage();
            }
        });

        pandaInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 80) + 'px';
        });

        // ============================================================
        // MOBILE LOGOUT
        // ============================================================
        document.getElementById('mobileLogoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            handleLogout();
        });

        // ============================================================
        // INITIALIZATION
        // ============================================================
        async function initPage() {
            showLoading();

            try {
                const session = getSession();
                if (!session || !session.user_id) {
                    log('No session found, redirecting to login');
                    navigateTo('login.html');
                    return;
                }

                const lessonId = getUrlParam('id') || 'lesson_1';
                log(`📚 Loading lesson: ${lessonId}`);

                lessonStartTime = Date.now();

                const userData = await apiCall(`/user/${session.user_id}`);
                const user = userData.user;
                setSession({ ...session, ...user });

                updateNavbar();

                // Update XP display
                document.getElementById('xpDisplay').textContent = user.xp || 0;

                const lesson = await fetchLesson(lessonId);
                window.currentLesson = lesson;

                if (!lesson) {
                    document.getElementById('slideWrapper').innerHTML = `
                        <div class="slide">
                            <div class="empty-state">
                                <div class="icon">😕</div>
                                <h2>Lesson Not Found</h2>
                                <p>We couldn't find the lesson you're looking for.</p>
                                <button class="btn btn-primary" onclick="navigateTo('learn.html')">← Back to Lessons</button>
                            </div>
                        </div>
                    `;
                    hideLoading();
                    return;
                }

                const isPremiumUser = user.premium || user.is_premium || false;

                // Update badge
                document.getElementById('lessonNumber').textContent = `Lesson ${lesson.id.replace('lesson_', '')}`;
                document.getElementById('lessonBadge').textContent = `YCT ${lesson.level}`;

                const premiumBadge = document.getElementById('premiumBadge');
                if (lesson.premium) {
                    premiumBadge.textContent = '⭐ Premium';
                    premiumBadge.className = 'badge badge-premium';
                } else {
                    premiumBadge.textContent = '🆓 Free';
                    premiumBadge.className = 'badge badge-free';
                }

                // Check if completed
                if (localStorage.getItem(`lesson_${lessonId}_completed`) === 'true') {
                    document.getElementById('completionBadge').style.display = 'inline-block';
                }

                // Generate and render slides
                const slides = generateSlides(lesson, user.current_yct || 1, isPremiumUser);
                totalSlides = slides.length;
                renderSlides(slides);

                // Show welcome message
                const name = user.full_name || user.username || 'Learner';
                showToast('success', `Welcome, ${name}! Let's learn ${lesson.title} 🎉`);

                log('✅ Lesson loaded successfully!');
                log(`📚 Lesson: ${lesson.title}`);
                log(`📊 Level: YCT ${lesson.level}`);

            } catch (error) {
                errorLog('Init error:', error);
                showToast('error', 'Failed to load lesson. Please refresh.');
            }

            hideLoading();
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                const nextBtn = document.getElementById('nextSlideBtn');
                if (!nextBtn.disabled) nextSlide();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        // ============================================================
        // SERVICE WORKER
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swPath = window.location.pathname + 'sw.js?v=' + VERSION;
                navigator.serviceWorker.register(swPath, {
                        scope: window.location.pathname,
                        updateViaCache: 'none'
                    })
                    .then(registration => {
                        log('✅ Service Worker registered:', registration);
                        setInterval(() => {
                            registration.update();
                            log('🔄 Checking for SW updates...');
                        }, 30000);
                    })
                    .catch(error => {
                        log('ℹ️ Service Worker registration skipped:', error.message);
                    });
            });
        }

        // ============================================================
        // START
        // ============================================================
        document.addEventListener('DOMContentLoaded', initPage);

        // ============================================================
        // EXPOSE FUNCTIONS GLOBALLY
        // ============================================================
        window.goToSlide = goToSlide;
        window.nextSlide = nextSlide;
        window.prevSlide = prevSlide;
        window.flipCard = flipCard;
        window.speakWord = speakWord;
        window.checkChallengeAnswer = checkChallengeAnswer;
        window.completeLesson = completeLesson;
        window.shareProgress = shareProgress;
        window.togglePanda = togglePanda;
        window.sendPandaMessage = sendPandaMessage;
        window.showPremiumPopup = showPremiumPopup;
        window.handleLogout = handleLogout;
        window.navigateTo = navigateTo;
        window.showToast = showToast;
        window.apiCall = apiCall;
        window.getSession = getSession;
        window.isLoggedIn = isLoggedIn;
        window.currentLesson = null;
    </script>

</body>

</html>
