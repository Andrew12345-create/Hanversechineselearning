<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hanverse Lesson</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================
                   ROOT VARIABLES
                ============================================ */
        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --primary-light: #DBEAFE;
            --secondary: #14B8A6;
            --secondary-light: #99F6E4;
            --accent: #F59E0B;
            --accent-light: #FDE68A;
            --pink: #EC4899;
            --pink-light: #FBCFE8;
            --purple: #8B5CF6;
            --purple-light: #E9D5FF;
            --orange: #F97316;
            --orange-light: #FED7AA;
            --red: #EF4444;
            --green: #22C55E;
            --dark: #0F172A;
            --text: #1E293B;
            --text-secondary: #475569;
            --muted: #64748B;
            --bg: #F0F4FF;
            --white: #FFFFFF;
            --success: #10B981;
            --error: #EF4444;
            --border: #E2E8F0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
            --radius-full: 9999px;
            --nav-height: 76px;
            --nav-shrunk-height: 58px;
            --transition-smooth: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ============================================
                   RESET & BASE
                ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--dark);
            overflow-x: hidden;
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
            padding-top: calc(var(--nav-height) + 28px);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, .06), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(20, 184, 166, .06), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(245, 158, 11, .04), transparent 50%);
        }

        ::selection {
            background: var(--primary);
            color: white;
        }

        /* ============================================
                   OFFLINE BANNER
                ============================================ */
        #offline-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1002;
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: white;
            text-align: center;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
        }

        #offline-banner.show {
            display: block;
            transform: translateY(0);
        }

        /* ============================================
                   TOAST NOTIFICATIONS
                ============================================ */
        .toast-container {
            position: fixed;
            top: 100px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: calc(100% - 48px);
        }

        .toast {
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            background: white;
            box-shadow: var(--shadow-lg);
            border-left: 4px solid var(--primary);
            animation: slideInRight 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .toast-success {
            border-left-color: #22C55E;
        }
        .toast-error {
            border-left-color: #EF4444;
        }
        .toast-warning {
            border-left-color: var(--accent);
        }
        .toast-info {
            border-left-color: var(--primary);
        }

        .toast-icon {
            font-size: 24px;
            flex-shrink: 0;
        }
        .toast-message {
            flex: 1;
            color: var(--dark);
            line-height: 1.5;
        }
        .toast-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(40px);
            }
        }

        .toast.removing {
            animation: slideOutRight 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ============================================
                   LOADING OVERLAY
                ============================================ */
        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        #loading-overlay.show {
            display: flex;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* ============================================
                   FLOATING NAVBAR
                ============================================ */
        nav.top-nav {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            width: calc(100% - 36px);
            max-width: 1200px;
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.02);
            transition: var(--transition-smooth);
            will-change: transform, height, border-radius, padding, box-shadow, top, background;
        }

        nav.top-nav.shrunk {
            top: 14px;
            height: var(--nav-shrunk-height);
            padding: 0 20px;
            width: calc(100% - 48px);
            max-width: 900px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.03);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
            text-decoration: none;
            flex-shrink: 0;
            transition: var(--transition-smooth);
        }

        .logo-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 20px;
            transition: var(--transition-smooth);
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .logo-text {
            transition: var(--transition-smooth);
            background: linear-gradient(135deg, var(--dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        nav.top-nav.shrunk .logo-text {
            opacity: 0;
            width: 0;
            overflow: hidden;
            margin: 0;
        }

        nav.top-nav.shrunk .logo-badge {
            width: 34px;
            height: 34px;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
        }

        nav.top-nav.shrunk .logo {
            gap: 0;
        }

        nav ul {
            display: flex;
            gap: 28px;
            list-style: none;
            align-items: center;
            margin: 0 16px;
            flex: 1;
            justify-content: center;
        }

        nav ul a {
            text-decoration: none;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition-smooth);
            font-size: 0.9rem;
            position: relative;
            padding: 4px 0;
            letter-spacing: 0.3px;
        }

        nav ul a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 100%;
            height: 2.5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        nav ul a:hover::after,
        nav ul a.active::after {
            transform: translateX(-50%) scaleX(1);
        }

        nav ul a:hover,
        nav ul a.active {
            color: var(--primary);
        }

        nav.top-nav.shrunk ul {
            gap: 20px;
            margin: 0 12px;
        }

        nav.top-nav.shrunk ul a {
            font-size: 0.8rem;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        /* ============================================
                   BUTTONS
                ============================================ */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: var(--transition-smooth);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.2px;
            position: relative;
            overflow: hidden;
            min-height: 54px;
            min-width: 120px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: white;
            border: 2px solid var(--border);
            color: var(--dark);
        }

        .btn-secondary:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.4);
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--accent), #D97706);
            color: white;
            box-shadow: 0 6px 24px rgba(245, 158, 11, 0.3);
        }

        .btn-premium:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 32px rgba(245, 158, 11, 0.4);
        }

        .btn-pink {
            background: linear-gradient(135deg, var(--pink), #DB2777);
            color: white;
            box-shadow: 0 6px 24px rgba(236, 72, 153, 0.3);
        }

        .btn-pink:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 32px rgba(236, 72, 153, 0.4);
        }

        .btn-purple {
            background: linear-gradient(135deg, var(--purple), #7C3AED);
            color: white;
            box-shadow: 0 6px 24px rgba(139, 92, 246, 0.3);
        }

        .btn-purple:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
        }

        .btn-orange {
            background: linear-gradient(135deg, var(--orange), #EA580C);
            color: white;
            box-shadow: 0 6px 24px rgba(249, 115, 22, 0.3);
        }

        .btn-orange:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 32px rgba(249, 115, 22, 0.4);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.08);
            color: #EF4444;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.15);
            min-height: 36px;
            min-width: auto;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.15);
            transform: translateY(-2px);
        }

        .btn-icon {
            width: 54px;
            height: 54px;
            padding: 0;
            border-radius: 50%;
            min-width: auto;
        }

        .btn-icon.btn-secondary {
            border-width: 2px;
        }

        /* ============================================
                   USER CHIP
                ============================================ */
        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 6px 16px 6px 8px;
            border-radius: var(--radius-full);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        .user-chip:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.1);
            transform: translateY(-2px);
        }

        .user-chip:active {
            transform: scale(0.97);
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            font-size: 16px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .user-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--dark);
        }

        .user-status {
            font-size: 0.65rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-status .premium-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .user-status .premium-text {
            color: var(--accent);
            font-weight: 600;
        }

        nav.top-nav.shrunk .user-chip {
            padding: 4px 12px 4px 6px;
            gap: 6px;
        }

        nav.top-nav.shrunk .user-avatar {
            width: 28px;
            height: 28px;
            font-size: 12px;
        }

        nav.top-nav.shrunk .user-name {
            font-size: 0.7rem;
        }

        nav.top-nav.shrunk .user-status {
            font-size: 0.55rem;
        }

        /* ============================================
                   LESSON CONTAINER
                ============================================ */
        .lesson-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 10px 5% 30px;
            min-height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
        }

        /* ============================================
                   PROGRESS BAR - ADVENTURE STYLE
                ============================================ */
        .adventure-progress {
            background: white;
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .adventure-progress::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            opacity: 0.3;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .progress-top .lesson-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .progress-top .lesson-info .badge {
            font-weight: 700;
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
        }

        .badge-premium {
            background: var(--accent-light);
            color: var(--accent);
        }

        .badge-free {
            background: var(--primary-light);
            color: var(--primary);
        }

        .badge-completed {
            background: #D1FAE5;
            color: #065F46;
        }

        .progress-steps {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .progress-step {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--muted);
            transition: var(--transition-smooth);
            position: relative;
        }

        .progress-step.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            transform: scale(1.1);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .progress-step.completed {
            border-color: var(--success);
            background: #D1FAE5;
            color: #065F46;
        }

        .progress-step.completed::after {
            content: '✓';
        }

        .progress-step .step-label {
            display: none;
        }

        .progress-connector {
            flex: 1;
            height: 2px;
            background: var(--border);
            min-width: 12px;
            position: relative;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-connector .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary));
            width: 0%;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 2px;
        }

        .progress-connector.completed .fill {
            width: 100%;
        }

        .progress-connector.partial .fill {
            width: 50%;
        }

        /* ============================================
                   SLIDE CONTAINER
                ============================================ */
        .slide-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            background: white;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            min-height: 400px;
        }

        .slide-wrapper {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }

        .slide {
            min-width: 100%;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 420px;
            animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .slide .emoji-large {
            font-size: 72px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .slide h2 {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.2;
            color: var(--dark);
        }

        .slide .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .slide .instruction {
            font-size: 0.95rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 20px;
            background: var(--bg);
            padding: 8px 20px;
            border-radius: var(--radius-full);
        }

        /* ============================================
                   SLIDE TYPES
                ============================================ */

        /* -- Welcome Slide -- */
        .slide-welcome .panda-greeting {
            font-size: 80px;
            animation: wave 2s ease-in-out infinite;
        }

        @keyframes wave {
            0%,
            100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(10deg);
            }
            75% {
                transform: rotate(-10deg);
            }
        }

        /* -- Word Slide -- */
        .word-display {
            text-align: center;
            padding: 10px 0;
        }

        .word-display .chinese-char {
            font-size: clamp(64px, 10vw, 96px);
            font-weight: 900;
            color: var(--dark);
            line-height: 1.2;
            margin-bottom: 4px;
            transition: var(--transition-smooth);
        }

        .word-display .pinyin {
            font-size: clamp(20px, 3vw, 28px);
            color: var(--muted);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .word-display .meaning {
            font-size: clamp(18px, 2.5vw, 24px);
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 16px;
        }

        .word-display .illustration {
            font-size: 80px;
            margin: 8px 0;
            animation: float 4s ease-in-out infinite;
        }

        .word-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .word-actions .btn {
            min-width: 60px;
            padding: 12px 20px;
            font-size: 1.2rem;
        }

        /* -- Flashcard Slide -- */
        .flashcard {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 4/3;
            perspective: 1000px;
            cursor: pointer;
            margin: 0 auto;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border: 2px solid var(--border);
            background: white;
            box-shadow: var(--shadow-sm);
        }

        .flashcard-front {
            background: linear-gradient(135deg, #F0F4FF, #E8EEFF);
        }

        .flashcard-front .chinese {
            font-size: 48px;
            font-weight: 900;
        }

        .flashcard-front .icon {
            font-size: 56px;
            margin-bottom: 8px;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #FFF7ED, #FFEDD5);
        }

        .flashcard-back .pinyin {
            font-size: 20px;
            color: var(--muted);
        }

        .flashcard-back .meaning {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
        }

        .flashcard-back .example {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
            font-style: italic;
        }

        /* -- Game Slide -- */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .game-card {
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            border: 3px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-sm);
            position: relative;
            user-select: none;
        }

        .game-card:hover:not(.matched):not(.disabled) {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .game-card:active:not(.matched):not(.disabled) {
            transform: scale(0.95);
        }

        .game-card.matched {
            border-color: var(--success);
            background: #D1FAE5;
            cursor: default;
            opacity: 0.6;
        }

        .game-card.matched::after {
            content: '✓';
            position: absolute;
            top: 4px;
            right: 8px;
            font-size: 16px;
            color: var(--success);
        }

        .game-card.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: scale(1.05);
        }

        .game-card .card-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        .game-card .card-emoji {
            font-size: 36px;
        }

        .game-card.disabled {
            cursor: default;
            opacity: 0.5;
        }

        /* -- Story Slide -- */
        .story-panel {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .story-panel .story-scene {
            background: var(--bg);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            border: 2px solid var(--border);
            margin-bottom: 12px;
        }

        .story-panel .story-scene .scene-emoji {
            font-size: 64px;
            margin-bottom: 8px;
        }

        .story-panel .story-scene .scene-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--dark);
            line-height: 1.6;
        }

        .story-panel .story-scene .scene-text .chinese-highlight {
            color: var(--primary);
            font-weight: 800;
        }

        .story-panel .speech-bubble {
            background: white;
            border-radius: var(--radius-md);
            padding: 16px 20px;
            border: 2px solid var(--border);
            position: relative;
            margin-top: 8px;
        }

        .story-panel .speech-bubble::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 30px;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 12px solid var(--border);
        }

        .story-panel .speech-bubble .bubble-text {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* -- Challenge Slide -- */
        .challenge-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .challenge-option {
            padding: 16px 20px;
            border-radius: var(--radius-md);
            border: 3px solid var(--border);
            background: white;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 64px;
        }

        .challenge-option:hover:not(.disabled) {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .challenge-option:active:not(.disabled) {
            transform: scale(0.96);
        }

        .challenge-option.correct {
            border-color: var(--success);
            background: #D1FAE5;
        }

        .challenge-option.wrong {
            border-color: var(--error);
            background: #FEE2E2;
        }

        .challenge-option.disabled {
            cursor: default;
            opacity: 0.7;
        }

        .challenge-option .opt-emoji {
            font-size: 28px;
        }

        /* -- Celebration Slide -- */
        .celebration {
            text-align: center;
            padding: 10px 0;
        }

        .celebration .trophy {
            font-size: 100px;
            animation: float 3s ease-in-out infinite;
        }

        .celebration .stars-display {
            display: flex;
            gap: 8px;
            justify-content: center;
            font-size: 36px;
            margin: 8px 0;
        }

        .celebration .reward-stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .celebration .reward-stat {
            background: var(--bg);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .celebration .reward-stat .stat-value {
            color: var(--primary);
            font-size: 1.2rem;
        }

        /* ============================================
                   SLIDE NAVIGATION
                ============================================ */
        .slide-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .slide-nav .btn {
            min-width: 100px;
        }

        .slide-nav .slide-counter {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
        }

        /* ============================================
                   PREMIUM POPUP
                ============================================ */
        .premium-popup {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
        }

        .premium-popup .premium-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, .75);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .premium-popup .premium-content {
            position: relative;
            max-width: 500px;
            width: 100%;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .premium-popup .premium-image {
            width: 100%;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: var(--transition-smooth);
        }

        .premium-popup .premium-image:hover {
            transform: scale(1.02);
        }

        .premium-popup .close-popup {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .premium-popup .close-popup:hover {
            transform: rotate(90deg) scale(1.1);
        }

        /* ============================================
                   CONFETTI
                ============================================ */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 9998;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        /* ============================================
                   PANDA CHAT
                ============================================ */
        .panda-fab {
            position: fixed;
            bottom: calc(100px + env(safe-area-inset-bottom));
            right: 24px;
            z-index: 998;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 32px;
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            color: white;
        }

        .panda-fab:hover {
            transform: scale(1.1) rotate(-5deg);
            box-shadow: 0 12px 40px rgba(37, 99, 235, 0.4);
        }

        .panda-fab:active {
            transform: scale(0.92);
        }

        .panda-chat {
            display: none;
            position: fixed;
            bottom: calc(110px + env(safe-area-inset-bottom));
            right: 24px;
            width: 360px;
            max-width: calc(100vw - 48px);
            height: 440px;
            max-height: 65vh;
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-xl);
            z-index: 999;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .panda-chat.open {
            display: flex;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .panda-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .panda-title {
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panda-close {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .panda-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(90deg);
        }

        .panda-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #F8FAFC;
        }

        .panda-body::-webkit-scrollbar {
            width: 4px;
        }

        .panda-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .panda-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .message-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: flex-start;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .panda-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .panda-message {
            background: white;
            color: var(--dark);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .user-message {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .panda-input {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: white;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .panda-input textarea {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            font-size: 14px;
            resize: none;
            font-family: 'Poppins', sans-serif;
            min-height: 40px;
            max-height: 80px;
            outline: none;
            transition: var(--transition-smooth);
            background: var(--bg);
        }

        .panda-input textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .panda-send {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition-smooth);
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .panda-send:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        .panda-send:active {
            transform: scale(0.92);
        }

        /* ============================================
                   BOTTOM NAV
                ============================================ */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: space-around;
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.06);
            z-index: 999;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .bottom-nav a {
            text-decoration: none;
            color: var(--muted);
            font-size: 0.65rem;
            font-weight: 500;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 0;
            transition: var(--transition-smooth);
            border-radius: var(--radius-sm);
        }

        .bottom-nav a.active {
            color: var(--primary);
            font-weight: 600;
        }

        .bottom-nav a:hover {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 22px;
        }

        /* ============================================
                   RESPONSIVE
                ============================================ */
        @media (max-width: 768px) {
            body {
                padding-top: calc(var(--nav-height) + 20px);
            }

            nav.top-nav {
                top: 12px;
                padding: 0 16px;
                width: calc(100% - 24px);
                border-radius: 18px;
                height: 64px;
            }

            nav.top-nav.shrunk {
                top: 10px;
                height: 54px;
                padding: 0 14px;

                border-radius: 14px;
            }

            .logo {
                font-size: 18px;
                gap: 8px;
            }

            .logo-badge {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }

            nav.top-nav.shrunk .logo-badge {
                width: 30px;

                font-size: 14px;
            }

            }

                font-size: 22px;

            }

            .word-display .meaning {
                font-size: 18px;
            }

            }

                font-size: 36px;
            }

            }

            }

                min-height: 44px;

            .panda-chat {

            }

            .celebration .trophy {
                font-size: 72px;
            }
        }

        @media (max-width: 480px) {
            .slide {
                padding: 16px 12px;
                min-height: 280px;
            }

            .slide .emoji-large {
                font-size: 48px;
            }

            .slide h2 {
                font-size: 20px;
            }

            .word-display .chinese-char {
                font-size: 44px;
            }

            .word-display .illustration {
                font-size: 56px;
            }

                grid-template-columns: repeat(2, 1fr);

            .challenge-options {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .celebration .reward-stats {

            .celebration .reward-stat {
                font-size: 0.75rem;
                padding: 4px 12px;

            .slide-nav {
                flex-direction: column;
                gap: 8px;
            }

            .slide-nav .btn {
                width: 100%;
                min-width: auto;
            }

            .slide-nav .slide-counter {
                order: -1;
            }

            .progress-step .step-label {
                display: none;
            }

            .adventure-progress .progress-steps {
                gap: 4px;
            }

            .progress-connector {

        /* ============================================
                   MOTION REDUCTION
                ============================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .slide {
                animation: none !important;
            }

            .panda-fab:hover {
                transform: none !important;
            }

            .btn:hover {
                transform: none !important;
            }

            .game-card:hover {
                transform: none !important;
            }

        /* ============================================
                   FOCUS VISIBLE
                ============================================ */
        *:focus-visible {

                   UTILITY

            text-align: center;
        }

        .mt-1 {

        .mt-2 {
            margin-top: 16px;

            margin-top: 24px;

        .mb-2 {
            margin-bottom: 16px;

        .flex-wrap {

</head>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loading-overlay">

        <div class="loader-text">🐼 Loading your adventure...</div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const API_BASE = '/api';
        const SESSION_KEY = 'hanverse_user';
        const VERSION = '2.0.0';
        const DEBUG = false;

        // ============================================================
        // LOGGING
        // ============================================================
        function log(...args) {
            if (DEBUG) console.log(...args);
        }

        function errorLog(...args) {
            console.error(...args);
        }

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sanitizeHtml(html) {
            if (!html) return '';
            const div = document.createElement('div');
            div.innerHTML = html;
            div.querySelectorAll('script').forEach(el => el.remove());
            div.querySelectorAll('*').forEach(el => {
                for (const attr of el.attributes) {
                    if (attr.name.startsWith('on')) {
                        el.removeAttribute(attr.name);
                    }
                }
            });
            return div.innerHTML;
        }

        function getSession() {
            try {
                const data = localStorage.getItem(SESSION_KEY);
                return data ? JSON.parse(data) : null;
            } catch {
                return null;
            }
        }

        function setSession(user) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(user));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        function getUserId() {
            const session = getSession();
            return session?.user_id || session?.id || null;
        }

        function getFullName() {
            const session = getSession();
            return session?.full_name || session?.fullName || session?.username || 'Learner';
        }

        function isPremium() {
            const session = getSession();
            return session?.premium || session?.is_premium || false;
        }

        function isLoggedIn() {
            return !!getUserId();
        }

        function navigateTo(url) {
            window.location.href = url;
        }

        function getUrlParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // ============================================================
        // TOAST NOTIFICATIONS
        // ============================================================
        function showToast(type, message, duration = 4000) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
                <span class="toast-message">${message}</span>
                <button class="toast-close">✕</button>
            `;

            toast.querySelector('.toast-close').addEventListener('click', () => {
                removeToast(toast);
            });

            container.appendChild(toast);

            setTimeout(() => {
                removeToast(toast);
            }, duration);
        }

        function removeToast(toast) {
            if (toast.classList.contains('removing')) return;
            toast.classList.add('removing');
            setTimeout(() => {
                toast.remove();
            }, 300);
        }

        // ============================================================
        // LOADING OVERLAY
        // ============================================================
        function showLoading() {
            document.getElementById('loading-overlay').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.remove('show');
        }

        // ============================================================
        // API CALLS
        // ============================================================
        async function apiCall(endpoint, options = {}) {
            const url = `${API_BASE}${endpoint}`;
            const headers = {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                ...options.headers
            };

            try {
                const response = await fetch(url, {
                    ...options,
                    headers,
                    credentials: 'same-origin'
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.message || `API error: ${response.status}`);
                }

                return data;
            } catch (error) {
                errorLog(`API call failed: ${endpoint}`, error);
                throw error;
            }
        }

        // ============================================================
        // CONFETTI
        // ============================================================
        function fireConfetti(count = 60) {
            const container = document.getElementById('confettiContainer');
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#F8C471'];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const color = colors[Math.floor(Math.random() * colors.length)];
                const size = 6 + Math.random() * 10;
                const left = Math.random() * 100;
                const duration = 2 + Math.random() * 2;
                const delay = Math.random() * 0.5;
                const shapes = ['50%', '0'];
                const shape = shapes[Math.floor(Math.random() * shapes.length)];

                piece.style.cssText = `
                    left: ${left}%;
                    width: ${size}px;
                    height: ${size * (0.6 + Math.random() * 0.8)}px;
                    background: ${color};
                    border-radius: ${shape};
                    animation-duration: ${duration}s;
                    animation-delay: ${delay}s;
                    transform: rotate(${Math.random() * 360}deg);
                `;

                container.appendChild(piece);
            }

            // Clean up after animation
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

            try {
                const data = await apiCall(`/lessons/${lessonId}`);
                return data.lesson;
            } catch (error) {
                errorLog('Fetch lesson error:', error);
                return getSampleLesson(lessonId);
            }
        }
