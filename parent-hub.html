<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HanVerse Parent Hub 👪</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0D0D1A;
            --surface: #151529;
            --card: #1C1C35;
            --blue: #4EA8DE;
            --yellow: #F4D35E;
            --green: #74C69D;
            --red: #E63946;
            --text: #E8E8F0;
            --muted: #8E8EA8;
            --border: rgba(255,255,255,.08);
            --gradient-primary: linear-gradient(135deg, #ff416c, #ff4b2b);
            --radius: 12px;
            --radius-lg: 18px;
            --shadow: 0 12px 32px rgba(0,0,0,0.4);
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            height: 72px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.1rem;
        }
        .logo span { color: #ff6b6b; }

        .logout-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: rgba(230, 57, 70, 0.15);
            border-color: rgba(230, 57, 70, 0.3);
            color: var(--red);
        }

        .main-container {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
        }

        .status-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 24px;
            background: rgba(244, 211, 94, 0.1);
            color: var(--yellow);
            transition: all 0.3s ease;
        }

        .status-icon.loading { animation: pulse 1.5s ease-in-out infinite; }
        .status-icon.verified {
            background: rgba(116, 198, 157, 0.15);
            color: var(--green);
        }
        .status-icon.error {
            background: rgba(230, 57, 70, 0.15);
            color: var(--red);
        }

        h2 { font-size: 1.5rem; margin-bottom: 12px; font-weight: 700; }
        p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }

        .info-badge {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.88rem;
        }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { color: var(--muted); font-weight: 500; }
        .info-value { color: var(--text); font-weight: 600; }

        .btn {
            width: 100%;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            font-family: inherit;
            background: var(--gradient-primary);
            color: white;
            transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 24px;
            box-shadow: var(--shadow);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            max-width: 400px;
        }
        .toast.show { display: flex; }
        .toast.success { border-left: 4px solid var(--green); }
        .toast.error { border-left: 4px solid var(--red); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .navbar { padding: 0 16px; height: 64px; }
            .logo { font-size: 0.95rem; }
            .status-card { padding: 24px; }
            .info-row { flex-direction: column; gap: 2px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">👪 HanVerse <span>Parents Hub</span></div>
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sign Out
        </button>
    </nav>

    <div class="main-container">
        <div class="status-card">
            <div id="statusIcon" class="status-icon loading">
                <i class="fa-solid fa-hourglass-half fa-spin"></i>
            </div>
            
            <h2 id="statusTitle">⏳ Awaiting Admin Verification</h2>
            <p id="statusDesc">Your account is pending approval. An administrator will verify your parent account shortly.</p>

            <div class="info-badge">
                <div class="info-row">
                    <span class="info-label">Parent Account:</span>
                    <span class="info-value" id="parentEmail">Loading...</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Account Status:</span>
                    <span class="info-value" id="accountStatus">⏳ Pending Verification</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Role:</span>
                    <span class="info-value">👪 Parent</span>
                </div>
            </div>

            <button id="actionBtn" class="btn" onclick="checkStatus()">
                <i class="fas fa-sync" aria-hidden="true"></i> Check Status
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle" id="toastIcon" aria-hidden="true"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const API_URL = '/api';
        const POLL_INTERVAL = 15000; // 15 seconds

        // ==========================================
        // STATE
        // ==========================================
        let isPolling = false;
        let pollTimer = null;
        let currentStatus = { isVerified: false, isBanned: false };

        // ==========================================
        // DOM REFERENCES
        // ==========================================
        const DOM = {
            statusIcon: document.getElementById('statusIcon'),
            statusTitle: document.getElementById('statusTitle'),
            statusDesc: document.getElementById('statusDesc'),
            parentEmail: document.getElementById('parentEmail'),
            accountStatus: document.getElementById('accountStatus'),
            actionBtn: document.getElementById('actionBtn'),
            toast: document.getElementById('toast'),
            toastIcon: document.getElementById('toastIcon'),
            toastMessage: document.getElementById('toastMessage'),
        };

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        function getParentUser() {
            try {
                return JSON.parse(localStorage.getItem('hanverse_user') || '{}');
            } catch {
                return {};
            }
        }

        function showToast(message, type = 'success') {
            DOM.toastIcon.className = `fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}`;
            DOM.toastMessage.textContent = message;
            DOM.toast.className = `toast show ${type}`;
            clearTimeout(DOM.toast._timer);
            DOM.toast._timer = setTimeout(() => DOM.toast.classList.remove('show'), 4000);
        }

        // ==========================================
        // MAIN STATUS CHECK
        // ==========================================
        async function checkStatus() {
            const parentUser = getParentUser();
            
            if (!parentUser.user_id) {
                showToast('Session expired. Redirecting to login...', 'error');
                setTimeout(() => window.location.href = 'login.html', 1500);
                return;
            }

            DOM.actionBtn.disabled = true;
            DOM.actionBtn.innerHTML = `<span class="spinner"></span> Checking...`;

            try {
                const response = await fetch(`${API_URL}/user/${parentUser.user_id}`, {
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to fetch status');
                }

                const user = data.user;
                
                // Update local storage
                const updatedUser = { ...parentUser, ...user };
                localStorage.setItem('hanverse_user', JSON.stringify(updatedUser));

                currentStatus.isVerified = user.is_verified || false;
                currentStatus.isBanned = user.is_banned || false;

                updateUI(currentStatus);

                // If verified, redirect to dashboard
                if (currentStatus.isVerified && !currentStatus.isBanned) {
                    showToast('✅ Account Verified! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'parent-dashboard.html';
                    }, 2000);
                } else if (currentStatus.isBanned) {
                    showToast('🚫 Account has been banned. Contact support.', 'error');
                } else {
                    // Still pending, start polling
                    startPolling();
                    showToast('⏳ Still waiting for admin verification.', '');
                }

            } catch (error) {
                console.error('❌ Status check failed:', error);
                showToast(error.message || 'Failed to check status', 'error');
                DOM.actionBtn.disabled = false;
                DOM.actionBtn.innerHTML = `<i class="fas fa-sync" aria-hidden="true"></i> Retry`;
            }
        }

        // ==========================================
        // UPDATE UI
        // ==========================================
        function updateUI(status) {
            const { isVerified, isBanned } = status;

            DOM.parentEmail.textContent = getParentUser().email || 'N/A';

            if (isBanned) {
                DOM.statusIcon.className = "status-icon error";
                DOM.statusIcon.innerHTML = `<i class="fa-solid fa-ban"></i>`;
                DOM.statusTitle.textContent = "🚫 Account Suspended";
                DOM.statusDesc.textContent = "Your account has been suspended. Please contact support.";
                DOM.accountStatus.innerHTML = `<span style="color: var(--red);">🚫 Banned</span>`;
                DOM.actionBtn.innerHTML = `<i class="fas fa-envelope" aria-hidden="true"></i> Contact Support`;
                DOM.actionBtn.onclick = () => window.location.href = 'mailto:support@hanverse.com';
                return;
            }

            if (isVerified) {
                DOM.statusIcon.className = "status-icon verified";
                DOM.statusIcon.innerHTML = `<i class="fa-solid fa-shield-heart"></i>`;
                DOM.statusTitle.textContent = "✅ Verified! Redirecting...";
                DOM.statusDesc.textContent = "Your account is verified. You will be redirected to the dashboard.";
                DOM.accountStatus.innerHTML = `<span style="color: var(--green);">✅ Verified</span>`;
                DOM.actionBtn.innerHTML = `<i class="fas fa-arrow-right" aria-hidden="true"></i> Go to Dashboard`;
                DOM.actionBtn.onclick = () => window.location.href = 'parent-dashboard.html';
            } else {
                DOM.statusIcon.className = "status-icon loading";
                DOM.statusIcon.innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i>`;
                DOM.statusTitle.textContent = "⏳ Awaiting Admin Verification";
                DOM.statusDesc.textContent = "Your account is pending approval. An administrator will verify your parent account shortly.";
                DOM.accountStatus.innerHTML = `<span style="color: var(--yellow);">⏳ Pending</span>`;
                DOM.actionBtn.innerHTML = `<i class="fas fa-sync" aria-hidden="true"></i> Check Status`;
                DOM.actionBtn.onclick = checkStatus;
            }

            DOM.actionBtn.disabled = false;
        }

        // ==========================================
        // POLLING
        // ==========================================
        function startPolling() {
            if (isPolling) return;
            isPolling = true;
            
            if (pollTimer) clearInterval(pollTimer);

            pollTimer = setInterval(async () => {
                const parentUser = getParentUser();
                try {
                    const response = await fetch(`${API_URL}/user/${parentUser.user_id}`, {
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (!response.ok) return;
                    const data = await response.json();
                    if (data.success && data.user) {
                        const user = data.user;
                        if (user.is_verified !== currentStatus.isVerified || 
                            user.is_banned !== currentStatus.isBanned) {
                            currentStatus.isVerified = user.is_verified || false;
                            currentStatus.isBanned = user.is_banned || false;
                            
                            const updatedUser = { ...getParentUser(), ...user };
                            localStorage.setItem('hanverse_user', JSON.stringify(updatedUser));
                            updateUI(currentStatus);
                            
                            if (currentStatus.isVerified && !currentStatus.isBanned) {
                                stopPolling();
                                showToast('✅ Account Verified! Redirecting...', 'success');
                                setTimeout(() => window.location.href = 'parent-dashboard.html', 2000);
                            }
                        }
                    }
                } catch (error) {
                    console.warn('⚠️ Polling error:', error.message);
                }
            }, POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            isPolling = false;
        }

        // ==========================================
        // LOGOUT
        // ==========================================
        function logout() {
            stopPolling();
            localStorage.removeItem('hanverse_user');
            window.location.href = 'login.html';
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const parentUser = getParentUser();
            
            if (!parentUser.user_id) {
                window.location.href = 'login.html';
                return;
            }

            // If already verified, redirect to dashboard
            if (parentUser.is_verified && !parentUser.is_banned) {
                window.location.href = 'parent-dashboard.html';
                return;
            }

            DOM.parentEmail.textContent = parentUser.email || 'N/A';
            
            // Show pending state
            updateUI({ isVerified: false, isBanned: false });
            
            // Start checking
            checkStatus();
        });

        window.addEventListener('beforeunload', stopPolling);

        console.log('🐼 HanVerse Parent Hub loaded');
    </script>
</body>
</html>
