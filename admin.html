<!DOCTYPE html>
<html lang="en">
<head>
    <link
rel="stylesheet"
href="panda-chat.css">
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HanVerse Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

:root{
    --red:#E63946;
    --yellow:#F4D35E;
    --blue:#4EA8DE;
    --green:#74C69D;

    --bg:#0D0D1A;
    --surface:#151529;
    --card:#1C1C35;

    --text:#E8E8F0;
    --muted:#8E8EA8;

    --border:rgba(255,255,255,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

.topbar{
    height:72px;
    background:var(--surface);
    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:42px;
    height:42px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    background:linear-gradient(
        135deg,
        #ff416c,
        #ff4b2b
    );
}

.logo h1{
    font-size:1.1rem;
    font-weight:800;
}

.logo span{
    color:#ff6b6b;
}

.top-actions{
    display:flex;
    gap:10px;
}

.btn{
    border:none;
    cursor:pointer;

    border-radius:12px;

    padding:10px 18px;

    font-weight:600;
}

.btn-primary{
    background:linear-gradient(
        135deg,
        #ff416c,
        #ff4b2b
    );

    color:white;
}

.btn-secondary{
    background:rgba(255,255,255,.06);
    color:white;
}

.stats{
    padding:24px;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:16px;
}

.stat-card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:18px;

    padding:20px;
}

.stat-title{
    color:var(--muted);
    font-size:.75rem;
    text-transform:uppercase;
}

.stat-value{
    font-size:2rem;
    font-weight:800;

    margin-top:8px;
}

.tabs{
    display:flex;
    gap:8px;

    padding:0 24px;
    margin-bottom:24px;
}

.tab{
    border:none;
    cursor:pointer;

    border-radius:999px;

    padding:10px 18px;

    background:rgba(255,255,255,.06);

    color:var(--muted);

    font-weight:600;
}

.tab.active{
    background:linear-gradient(
        135deg,
        #ff416c,
        #ff4b2b
    );

    color:white;
}

.section{
    padding:0 24px 30px;
}

.modal-overlay{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.7);

    z-index:999;
}

.modal-overlay.open{
    display:flex;
}

.modal{
    width:100%;
    max-width:420px;

    background:var(--card);

    border-radius:24px;

    border:1px solid var(--border);

    padding:28px;
}

.modal h2{
    margin-bottom:12px;
}

.modal p{
    color:var(--muted);
    margin-bottom:20px;
}

.modal input{
    width:100%;

    padding:12px;

    border-radius:12px;

    border:1px solid var(--border);

    background:#0D0D1A;

    color:white;

    margin-bottom:12px;
}

.error{
    color:#ff6b6b;
    min-height:20px;
    font-size:.85rem;
}

.loading{
    height:70vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:15px;
}

.spinner{
    width:50px;
    height:50px;

    border-radius:50%;

    border:4px solid rgba(255,255,255,.15);

    border-top-color:#ff416c;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>

<div id="app">

<div class="loading">
    <div class="spinner"></div>
    <p>Loading Admin Panel...</p>
</div>

</div>

<div
class="modal-overlay open"
id="authModal">

<div class="modal">

<h2>🔐 Admin Access</h2>

<p>
Enter admin password to continue.
</p>

<input
type="password"
id="authPassword"
placeholder="Admin Password">

<div
class="error"
id="authErr">
</div>

<button
class="btn btn-primary"
style="width:100%;"
onclick="confirmAdminAuth()">

Unlock

</button>

</div>
</div>

<script>

const API_URL = '/api';

let adminToken = null;
async function confirmAdminAuth(){

    const password =
        document
        .getElementById(
            'authPassword'
        )
        .value
        .trim();


let db = {
    users:[],
    progress:[],
    achievements:[],
    daily_goals:[],
    notifications:[],
    vocabulary:[],
    settings:[]
};

let activeTab = 'users';

const storedUser =
    JSON.parse(
        localStorage.getItem(
            'hanverse_user'
        ) || '{}'
    );

const USER_ID =
    storedUser.user_id;

if(!USER_ID){

    location.href =
        'login.html';

}


    const err =
        document
        .getElementById(
            'authErr'
        );

    err.textContent = '';

    if(!password){

        err.textContent =
            'Enter admin password';

        return;
    }

    try{

        const response =
            await fetch(
                API_URL +
                '/admin/verify-password',
                {
                    method:'POST',
                    headers:{
                        'Content-Type':
                        'application/json'
                    },
                    body:JSON.stringify({
                        userId:USER_ID,
                        adminPassword:
                        password
                    })
                }
            );

        const text = await response.text();

console.log('VERIFY RESPONSE:');
console.log(text);

return;

        if(!response.ok){

            err.textContent =
                data.error ||
                'Access denied';

            return;
        }

        adminToken =
            data.adminToken;

        loadAdminData();

    }
    catch(ex){

        console.error(ex);

        err.textContent =
            'Server unavailable';

    }
}




async function loadAdminData(){

    try{

        const response =
            await fetch(
                API_URL +
                '/admin/overview',
                {
                    headers:{
                        Authorization:
                        'Bearer ' +
                        adminToken
                    }
                }
            );

        const text =
    await response.text();

console.log(text);

let data;

try{

    data =
        JSON.parse(text);

}
catch(err){

    console.error(
        'Server returned:',
        text
    );

    document
        .getElementById(
            'authErr'
        )
        .textContent =
        'Backend error. Check console.';

    return;

}

        if(!response.ok){

            throw new Error(
                data.error ||
                'Failed loading admin data'
            );

        }

        db = data;

        document
            .getElementById(
                'authModal'
            )
            .remove();

        render();

    }
    catch(ex){

        console.error(ex);

        document
            .getElementById(
                'authErr'
            )
            .textContent =
            ex.message;

    }

}

function switchTab(tab){

    activeTab = tab;

    render();

}

function renderUsers(){

    if(
        !db.users ||
        db.users.length === 0
    ){

        return `
        <div
        style="
        padding:40px;
        text-align:center;
        ">
            No users found.
        </div>
        `;

    }

    let html =
        '<div class="user-grid">';

    db.users.forEach(user => {

        html += `

        <div class="user-card">

            <div class="user-card-top">

                <div class="user-pfp">
                    👤
                </div>

                <div class="user-info">

                    <h3>
                        ${
                            user.full_name ||
                            'Unknown User'
                        }
                    </h3>

                    <p>
                        @${user.username || ''}
                    </p>

                    <p>
                        ${user.email || ''}
                    </p>

                </div>

            </div>

            <div
            style="
            margin-top:10px;
            display:flex;
            gap:6px;
            flex-wrap:wrap;
            ">

                <span class="pill pill-yellow">
                    ⭐ ${user.xp || 0}
                </span>

                <span class="pill pill-green">
                    Lv ${user.level || 1}
                </span>

                ${
                    user.is_admin
                    ?
                    '<span class="pill pill-red">👑 Admin</span>'
                    :
                    ''
                }

                ${
                    user.is_banned
                    ?
                    '<span class="pill pill-red">🚫 Banned</span>'
                    :
                    ''
                }

            </div>

            <div
            class="user-actions"
            style="margin-top:15px;">

                <button
                class="edit-field-btn"
                onclick="editUser('${user.user_id}')">

                    ✏️ Edit

                </button>

                <button
                class="edit-field-btn"
                onclick="emailUser('${user.user_id}')">

                    📧 Email

                </button>

                <button
                class="edit-field-btn"
                onclick="banUser('${user.user_id}')">

                    🚫 Ban

                </button>

                <button
                class="del-user-btn"
                onclick="deleteUser('${user.user_id}')">

                    🗑 Delete

                </button>

            </div>

        </div>

        `;

    });

    html += '</div>';

    return html;

}

function render(){

    const totalUsers =
        db.users.length;

    const adminCount =
        db.users.filter(
            u => u.is_admin
        ).length;

    const totalXP =
        db.users.reduce(
            (
                total,
                user
            ) =>
            total +
            (user.xp || 0),
            0
        );

    const bannedUsers =
        db.users.filter(
            u => u.is_banned
        ).length;

    document
        .getElementById(
            'app'
        )
        .innerHTML = `

<div class="topbar">

    <div class="logo">

        <div class="logo-icon">
            👑
        </div>

        <h1>
            HanVerse
            <span>Admin</span>
        </h1>

    </div>

    <div class="top-actions">

        <button
        class="btn btn-primary"
        onclick="openCreateUser()">

            ➕ Create User

        </button>

        <button
        class="btn btn-secondary"
        onclick="openEmailAll()">

            📧 Email All

        </button>

        <button
        class="btn btn-secondary"
        onclick="location.href='profile.html'">

            ← Profile

        </button>

    </div>

</div>

<div class="stats">

    <div class="stat-card">
        <div class="stat-title">
            Total Users
        </div>
        <div class="stat-value">
            ${totalUsers}
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-title">
            Admins
        </div>
        <div class="stat-value">
            ${adminCount}
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-title">
            Total XP
        </div>
        <div class="stat-value">
            ${totalXP.toLocaleString()}
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-title">
            Banned
        </div>
        <div class="stat-value">
            ${bannedUsers}
        </div>
    </div>

</div>

<div class="tabs">

    <button
    class="tab active">

        👥 Users

    </button>

</div>

<div class="section">

    ${renderUsers()}

</div>

`;

}

function openCreateUser(){

    alert(
        'Create User modal will be added in Section 3'
    );

}

function openEmailAll(){

    alert(
        'Email All modal will be added in Section 3'
    );

}

function editUser(userId){

    alert(
        'Edit User: ' +
        userId
    );

}

function emailUser(userId){

    alert(
        'Email User: ' +
        userId
    );

}

function banUser(userId){

    alert(
        'Ban User: ' +
        userId
    );

}

function deleteUser(userId){

    alert(
        'Delete User: ' +
        userId
    );

}
</script>
<!-- Panda Floating Button -->

<button
class="panda-fab"
onclick="togglePanda()">
🐼
</button>

<div
id="pandaChat"
class="panda-chat">

<div class="panda-header">

<div class="panda-title">
🐼 Panda AI Tutor
</div>

<button
class="panda-close"
onclick="togglePanda()">
✕
</button>

</div>

<div
id="pandaBody"
class="panda-body">

<div class="message-row">

<div class="panda-avatar">
🐼
</div>

<div class="message panda-message">
👋 Hi! Ask me anything about Mandarin.
</div>

</div>

</div>

<div class="panda-input">

<textarea
id="pandaInput"
placeholder="Ask Panda...">
</textarea>

<button
class="panda-send"
onclick="sendPandaMessage()">
➤
</button>

</div>

</div>
<script src="panda-chat.js"></script>
</body>
</html>
