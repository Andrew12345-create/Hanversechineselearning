<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explore | HanVerse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-light: #DBEAFE;
      --teal: #14B8A6;
      --teal-light: #99F6E4;
      --amber: #F59E0B;
      --amber-light: #FDE68A;
      --text: #0F172A;
      --muted: #64748B;
      --soft: #F8FAFC;
      --border: #E2E8F0;
      --white: #FFFFFF;
      --radius-lg: 24px;
      --radius-md: 16px;
      --shadow: 0 10px 30px rgba(15, 23, 42, .07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      color: var(--text);
      background: var(--soft);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* NAV */

    .topbar {
      height: 72px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      font-size: 21px;
    }

    .brand-panda {
      font-size: 30px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .nav a {
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      padding: 9px 13px;
      border-radius: 10px;
    }

    .nav a:hover,
    .nav a.active {
      color: var(--blue);
      background: var(--blue-light);
    }

    /* HERO */

    .hero {
      background: linear-gradient(
        135deg,
        #EFF6FF 0%,
        #FFFFFF 55%,
        #F0FDFA 100%
      );
      border-bottom: 1px solid var(--border);
    }

    .hero-inner {
      max-width: 1200px;
      margin: auto;
      padding: 58px 24px 50px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 40px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--white);
      color: var(--blue);
      border: 1px solid var(--blue-light);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.08;
      letter-spacing: -1.5px;
    }

    .hero-copy {
      max-width: 650px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .hero-panda {
      font-size: 120px;
      line-height: 1;
      filter: drop-shadow(0 12px 15px rgba(15,23,42,.12));
    }

    /* MAIN */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 32px 24px 70px;
    }

    /* SEARCH */

    .toolbar {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 25px;
    }

    .search {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--white);
      padding: 0 18px 0 47px;
      outline: none;
      color: var(--text);
    }

    .search input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-light);
    }

    /* CATEGORIES */

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 7px;
      margin-bottom: 30px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--muted);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      transition: .2s ease;
    }

    .category-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .category-btn.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
      box-shadow: 0 5px 14px rgba(37,99,235,.2);
    }

    /* HEADER */

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    /* CARDS */

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #CBD5E1;
      box-shadow: 0 16px 38px rgba(15,23,42,.11);
    }

    .card-image {
      height: 185px;
      background: linear-gradient(135deg, var(--blue-light), #F0FDFA);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-icon {
      font-size: 68px;
    }

    .premium {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--amber);
      color: white;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
    }

    .card-body {
      padding: 18px;
    }

    .card-category {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 7px;
    }

    .card-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 800;
    }

    .card-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 9px 0 15px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .card-action {
      color: var(--blue);
      font-weight: 800;
    }

    /* STATES */

    .state {
      text-align: center;
      padding: 70px 20px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .state-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .state h3 {
      margin: 0 0 7px;
      font-size: 19px;
    }

    .state p {
      margin: 0 auto;
      max-width: 480px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid var(--blue-light);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .retry {
      margin-top: 18px;
      border: 0;
      background: var(--blue);
      color: white;
      border-radius: 10px;
      padding: 10px 17px;
      font-weight: 700;
    }

    /* VIEWER */

    .viewer {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.55);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .viewer.open {
      display: flex;
    }

    .viewer-panel {
      width: min(850px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 25px 70px rgba(15,23,42,.25);
    }

    .viewer-top {
      position: sticky;
      top: 0;
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }

    .viewer-category {
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--soft);
      font-size: 20px;
      color: var(--muted);
    }

    .viewer-content {
      padding: 30px;
    }

    .viewer-content h2 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .viewer-description {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .viewer-media {
      margin-bottom: 25px;
    }

    .viewer-media img,
    .viewer-media video {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 16px;
    }

    .viewer-text {
      white-space: pre-wrap;
      line-height: 1.85;
      color: #334155;
      font-size: 15px;
    }

    .viewer-audio {
      width: 100%;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .hero-inner {
        grid-template-columns: 1fr;
      }

      .hero-panda {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 0 16px;
      }

      .nav {
        gap: 0;
      }

      .nav a {
        font-size: 0;
        padding: 8px;
      }

      .nav a::first-letter {
        font-size: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      main {
        padding: 25px 16px 55px;
      }

      .hero-inner {
        padding: 40px 18px;
      }

      .toolbar {
        display: block;
      }

      .viewer-content {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a href="index.html" class="brand">
      <span class="brand-panda">🐼</span>
      <span>HanVerse</span>
    </a>

    <nav class="nav">
      <a href="index.html">🏠 Home</a>
      <a href="learn.html">📚 Learn</a>
      <a href="practice.html">🎮 Play</a>
      <a href="explore.html" class="active">🌏 Explore</a>
      <a href="talk.html">🐼 Panda</a>
      <a href="profile.html">👤 Me</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div>
        <div class="eyebrow">🌏 Discover China</div>

        <h1>
          Explore the world<br>
          of Mandarin.
        </h1>

        <p class="hero-copy">
          Discover stories, videos, places, history and culture
          while learning Chinese along the way.
        </p>
      </div>

      <div class="hero-panda">🐼</div>
    </div>
  </section>

  <main>

    <div class="toolbar">
      <div class="search">
        <span class="search-icon">🔎</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Search stories, places, history..."
          autocomplete="off"
        >
      </div>
    </div>

    <div class="categories" id="categories">

      <button
        class="category-btn active"
        data-category="all"
      >
        🌏 All
      </button>

    </div>

    <div class="section-header">

      <h2 class="section-title" id="sectionTitle">
        Discover
      </h2>

      <div class="result-count" id="resultCount"></div>

    </div>

    <div id="contentArea">

      <div class="state">
        <div class="spinner"></div>

        <h3>Loading Explore...</h3>

        <p>
          Panda is gathering your discoveries.
        </p>
      </div>

    </div>

  </main>

  <div class="viewer" id="viewer">

    <div class="viewer-panel">

      <div class="viewer-top">

        <div
          class="viewer-category"
          id="viewerCategory"
        ></div>

        <button
          class="close"
          id="closeViewer"
          aria-label="Close"
        >
          ×
        </button>

      </div>

      <div class="viewer-content">

        <h2 id="viewerTitle"></h2>

        <div
          class="viewer-description"
          id="viewerDescription"
        ></div>

        <div
          class="viewer-media"
          id="viewerMedia"
        ></div>

        <div
          class="viewer-text"
          id="viewerText"
        ></div>

      </div>

    </div>

  </div>

  <script>
    let allItems = [];
    let activeCategory = "all";
    let searchTerm = "";

    async function loadExplore() {

      showLoading();

      try {

        const response = await fetch("/api/explore", {
          method: "GET",
          headers: {
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `Explore API returned ${response.status}`
          );
        }

        const data = await response.json();

        console.log("🌏 Explore API:", data);

        if (!data.success) {
          throw new Error(
            data.error || "Explore API failed"
          );
        }

        if (Array.isArray(data.items)) {
          allItems = data.items;
        } else if (Array.isArray(data.content)) {
          allItems = data.content;
        } else if (Array.isArray(data.discoveries)) {
          allItems = data.discoveries;
        } else {
          allItems = [];
        }

        buildCategories();
        render();

      } catch (error) {

        console.error("❌ Explore:", error);
        showError();

      }
    }

    function buildCategories() {

      const container =
        document.getElementById("categories");

      container.innerHTML = `
        <button
          class="category-btn active"
          data-category="all"
        >
          🌏 All
        </button>
      `;

      const categories = new Map();

      allItems.forEach(item => {

        const slug =
          item.category_slug ||
          slugify(item.category);

        if (!slug || categories.has(slug)) {
          return;
        }

        categories.set(slug, {
          name:
            item.category ||
            item.category_name ||
            formatCategory(slug),

          icon:
            item.category_icon ||
            iconFor(slug)
        });

      });

      categories.forEach((category, slug) => {

        const button =
          document.createElement("button");

        button.className = "category-btn";
        button.dataset.category = slug;

        button.innerHTML =
          `${escapeHtml(category.icon)}
           ${escapeHtml(category.name)}`;

        button.addEventListener("click", () => {

          activeCategory = slug;

          document
            .querySelectorAll(".category-btn")
            .forEach(btn => {
              btn.classList.toggle(
                "active",
                btn.dataset.category === activeCategory
              );
            });

          render();

        });

        container.appendChild(button);

      });

      container
        .querySelector('[data-category="all"]')
        .addEventListener("click", () => {

          activeCategory = "all";

          document
            .querySelectorAll(".category-btn")
            .forEach(btn => {
              btn.classList.toggle(
                "active",
                btn.dataset.category === "all"
              );
            });

          render();

        });

    }

    function getFilteredItems() {

      return allItems.filter(item => {

        const category =
          item.category_slug ||
          slugify(
            item.category ||
            item.category_name
          );

        if (
          activeCategory !== "all" &&
          category !== activeCategory
        ) {
          return false;
        }

        if (!searchTerm) {
          return true;
        }

        const haystack = [
          item.title,
          item.description,
          item.content,
          item.category,
          item.category_name,
          item.author,
          item.difficulty,
          item.yct_level,
          item.hsk_level
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return haystack.includes(searchTerm);

      });

    }

    function render() {

      const area =
        document.getElementById("contentArea");

      const filtered =
        getFilteredItems();

      document.getElementById("resultCount").textContent =
        `${filtered.length} ${
          filtered.length === 1
            ? "discovery"
            : "discoveries"
        }`;

      document.getElementById("sectionTitle").textContent =
        activeCategory === "all"
          ? "Discover"
          : `${iconFor(activeCategory)} ${formatCategory(activeCategory)}`;

      if (!filtered.length) {

        area.innerHTML = `
          <div class="state">

            <div class="state-icon">🔎</div>

            <h3>No discoveries yet</h3>

            <p>
              Try another category or search.
            </p>

          </div>
        `;

        return;
      }

      area.innerHTML = `
        <div class="grid">
          ${filtered.map(createCard).join("")}
        </div>
      `;

      area
        .querySelectorAll(".card")
        .forEach(card => {

          card.addEventListener("click", () => {

            const id =
              Number(card.dataset.id);

            const item =
              allItems.find(x =>
                Number(x.id) === id
              );

            if (item) {
              openViewer(item);
            }

          });

        });

    }

    function createCard(item) {

      const categorySlug =
        item.category_slug ||
        slugify(
          item.category ||
          item.category_name
        );

      const categoryName =
        item.category ||
        item.category_name ||
        formatCategory(categorySlug);

      const icon =
        item.category_icon ||
        iconFor(categorySlug);

      const image =
        item.thumbnail_url || "";

      const duration =
        item.duration_minutes
          ? `⏱ ${item.duration_minutes} min`
          : "";

      const level =
        item.yct_level ||
        item.hsk_level ||
        item.difficulty ||
        "";

      return `
        <article
          class="card"
          data-id="${Number(item.id)}"
        >

          <div class="card-image">

            ${
              image
                ? `
                  <img
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(item.title || "")}"
                    loading="lazy"
                    onerror="
                      this.style.display='none';
                      this.nextElementSibling.style.display='block';
                    "
                  >
                `
                : ""
            }

            <div
              class="card-icon"
              style="${image ? "display:none" : ""}"
            >
              ${escapeHtml(icon)}
            </div>

            ${
              item.premium
                ? `<span class="premium">✨ PREMIUM</span>`
                : ""
            }

          </div>

          <div class="card-body">

            <div class="card-category">
              ${escapeHtml(icon)}
              ${escapeHtml(categoryName)}
            </div>

            <h3 class="card-title">
              ${escapeHtml(item.title || "Untitled")}
            </h3>

            <p class="card-description">
              ${escapeHtml(
                item.description ||
                "Discover something new in Chinese culture."
              )}
            </p>

            <div class="card-meta">

              <span>
                ${escapeHtml(
                  [duration, level]
                    .filter(Boolean)
                    .join(" • ")
                )}
              </span>

              <span class="card-action">
                Explore →
              </span>

            </div>

          </div>

        </article>
      `;
    }

    function openViewer(item) {

      const categorySlug =
        item.category_slug ||
        slugify(
          item.category ||
          item.category_name
        );

      const categoryName =
        item.category ||
        item.category_name ||
        formatCategory(categorySlug);

      document.getElementById(
        "viewerCategory"
      ).textContent =
        `${item.category_icon || iconFor(categorySlug)}
         ${categoryName}`;

      document.getElementById(
        "viewerTitle"
      ).textContent =
        item.title || "";

      document.getElementById(
        "viewerDescription"
      ).textContent =
        item.description || "";

      const media =
        document.getElementById("viewerMedia");

      media.innerHTML = "";

      if (item.video_url) {

        media.innerHTML = `
          <video
            src="${escapeAttribute(item.video_url)}"
            controls
            playsinline
          ></video>
        `;

      } else if (item.thumbnail_url) {

        media.innerHTML = `
          <img
            src="${escapeAttribute(item.thumbnail_url)}"
            alt="${escapeAttribute(item.title || "")}"
          >
        `;

      } else if (item.audio_url) {

        media.innerHTML = `
          <audio
            class="viewer-audio"
            src="${escapeAttribute(item.audio_url)}"
            controls
          ></audio>
        `;

      }

      document.getElementById(
        "viewerText"
      ).textContent =
        item.content || "";

      document
        .getElementById("viewer")
        .classList.add("open");

      document.body.style.overflow = "hidden";

    }

    function closeViewer() {

      document
        .getElementById("viewer")
        .classList.remove("open");

      document.body.style.overflow = "";

      const video =
        document.querySelector(
          ".viewer-media video"
        );

      if (video) {
        video.pause();
      }

    }

    document
      .getElementById("closeViewer")
      .addEventListener(
        "click",
        closeViewer
      );

    document
      .getElementById("viewer")
      .addEventListener(
        "click",
        event => {

          if (event.target.id === "viewer") {
            closeViewer();
          }

        }
      );

    document.addEventListener(
      "keydown",
      event => {

        if (event.key === "Escape") {
          closeViewer();
        }

      }
    );

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        event => {

          searchTerm =
            event.target.value
              .trim()
              .toLowerCase();

          render();

        }
      );

    function showLoading() {

      document.getElementById(
        "contentArea"
      ).innerHTML = `
        <div class="state">

          <div class="spinner"></div>

          <h3>Loading Explore...</h3>

          <p>
            Panda is gathering your discoveries.
          </p>

        </div>
      `;

    }

    function showError() {

      document.getElementById(
        "contentArea"
      ).innerHTML = `
        <div class="state">

          <div class="state-icon">🐼</div>

          <h3>Explore couldn't load</h3>

          <p>
            We couldn't connect to your Explore library.
            Please try again.
          </p>

          <button
            class="retry"
            onclick="loadExplore()"
          >
            Try again
          </button>

        </div>
      `;

    }

    function slugify(value) {

      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");

    }

    function formatCategory(slug) {

      return String(slug || "")
        .split("-")
        .map(word =>
          word.charAt(0).toUpperCase() +
          word.slice(1)
        )
        .join(" ");

    }

    function iconFor(slug) {

      const icons = {
        stories: "📖",
        videos: "🎬",
        places: "🗺️",
        history: "🏯",
        culture: "🏮"
      };

      return icons[slug] || "🌏";

    }

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    loadExplore();
  </script>

</body>
</html>
