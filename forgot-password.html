<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hanverse Password Reset</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: #FFFDF7;
      color: #1A1A2E;
      padding: 24px;
    }
    .container {
      width: min(520px, 100%);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(17, 24, 39, 0.08);
      padding: 32px;
    }
    h1 { font-size: 2rem; margin-bottom: 14px; }
    p { color: #6B7280; line-height: 1.8; margin-bottom: 26px; }
    .field { display: grid; gap: 10px; margin-bottom: 20px; }
    input { width: 100%; padding: 14px 16px; border: 1px solid #E5E7EB; border-radius: 14px; font-size: 1rem; }
    .btn { width: 100%; padding: 14px 16px; border: none; border-radius: 14px; cursor: pointer; font-size: 1rem; font-weight: 700; background: linear-gradient(135deg,#4EA8DE,#74C69D); color: #fff; }
    .hint { color: #9CA3AF; font-size: 0.95rem; margin-bottom: 18px; }
    .link { text-align: center; margin-top: 16px; }
    .link a { color: #4EA8DE; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Password Reset</h1>
    <p id="description">Enter your email and we'll send you a link to reset your password.</p>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>
    <button class="btn" id="sendBtn">Send reset link</button>
    <p class="hint" id="status"></p>
    <div class="link"><a href="login.html">Back to login</a></div>
  </div>
  <script>
    const API_URL = '/api';
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const status = document.getElementById('status');
      if (!email) {
        status.textContent = 'Please enter your email address first.';
        status.style.color = '#E63946';
        return;
      }
      document.getElementById('sendBtn').disabled = true;
      status.textContent = 'Sending reset link...';
      status.style.color = '#1A1A2E';
      try {
        const response = await fetch(API_URL + '/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await response.json();
        document.getElementById('sendBtn').disabled = false;
        if (!response.ok) throw new Error(data.error || 'Unable to send reset link');
        status.textContent = data.message || 'If that email exists, a reset link has been sent.';
        status.style.color = '#2B8A3E';
      } catch (error) {
        status.textContent = error.message;
        status.style.color = '#E63946';
        document.getElementById('sendBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
