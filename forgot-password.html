<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanverse Password Reset</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#FFFDF7;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

.card{
    width:100%;
    max-width:550px;
    background:#fff;
    border-radius:28px;
    padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo h1{
    font-size:2.4rem;
    color:#1A1A2E;
}

.subtitle{
    text-align:center;
    color:#6B7280;
    line-height:1.7;
    margin-bottom:30px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#1A1A2E;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #E5E7EB;
    border-radius:14px;
    font-size:1rem;
    outline:none;
}

input:focus{
    border-color:#4EA8DE;
}

button{
    width:100%;
    border:none;
    cursor:pointer;
    padding:15px;
    border-radius:14px;
    font-size:1rem;
    font-weight:700;
    color:white;
    background:linear-gradient(135deg,#4EA8DE,#74C69D);
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:18px;
    font-size:.95rem;
}

.success{
    color:#2B8A3E;
}

.error{
    color:#E63946;
}

.hidden{
    display:none;
}

.strength{
    margin-top:8px;
    font-size:.9rem;
}

.back{
    text-align:center;
    margin-top:22px;
}

.back a{
    color:#4EA8DE;
    text-decoration:none;
    font-weight:600;
}
</style>
</head>

<body>

<div class="card">

    <!-- REQUEST RESET -->

    <div id="requestSection">

        <div class="logo">
            <h1>Password Reset</h1>
        </div>

        <p class="subtitle">
            Enter your email address and we'll send you a secure link to reset your password.
        </p>

        <div class="field">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
            >
        </div>

        <button id="sendBtn">
            Send Reset Link
        </button>

        <div id="requestMessage" class="message"></div>

    </div>

    <!-- RESET PASSWORD -->

    <div id="resetSection" class="hidden">

        <div class="logo">
            <h1>Set New Password</h1>
        </div>

        <p class="subtitle">
            Create a strong new password for your Hanverse account.
        </p>

        <div class="field">
            <label>New Password</label>
            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >
            <div id="strength" class="strength"></div>
        </div>

        <div class="field">
            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
            >
        </div>

        <button id="resetBtn">
            Reset Password
        </button>

        <div id="resetMessage" class="message"></div>

    </div>

    <div class="back">
        <a href="login.html">Back to Login</a>
    </div>

</div>

<script>

const API_BASE =
window.location.hostname === "localhost"
? "http://localhost:3000/api"
: "https://YOUR-BACKEND-DOMAIN/api";

/* CHANGE ABOVE TO YOUR LIVE BACKEND URL */

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

console.log("Reset token:", token);

if(token){
    document.getElementById("requestSection").classList.add("hidden");
    document.getElementById("resetSection").classList.remove("hidden");
}

function setMessage(id,text,type){
    const el=document.getElementById(id);
    el.textContent=text;
    el.className="message "+type;
}

function passwordStrength(password){

    let score=0;

    if(password.length>=8) score++;
    if(/[A-Z]/.test(password)) score++;
    if(/[a-z]/.test(password)) score++;
    if(/[0-9]/.test(password)) score++;
    if(/[!@#$%^&*]/.test(password)) score++;

    return score;
}

const pwd=document.getElementById("newPassword");

if(pwd){

    pwd.addEventListener("input",()=>{

        const score=passwordStrength(pwd.value);

        const labels=[
            "",
            "Weak",
            "Fair",
            "Good",
            "Strong",
            "Excellent"
        ];

        document.getElementById("strength").textContent=
        labels[score];

    });

}

document.getElementById("sendBtn").addEventListener("click",async()=>{

    const email=document.getElementById("email").value.trim();

    if(!email){
        setMessage(
            "requestMessage",
            "Please enter your email address.",
            "error"
        );
        return;
    }

    try{

        setMessage(
            "requestMessage",
            "Sending reset link...",
            ""
        );

        const response=await fetch(
            API_BASE+"/forgot-password",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({email})
            }
        );

        const data=await response.json();

        if(!response.ok){
            throw new Error(
                data.error || "Failed to send reset link."
            );
        }

        setMessage(
            "requestMessage",
            "✅ If the email exists, a reset link has been sent.",
            "success"
        );

    }catch(error){

        setMessage(
            "requestMessage",
            error.message,
            "error"
        );

    }

});

document.getElementById("resetBtn").addEventListener("click",async()=>{

    const newPassword=
    document.getElementById("newPassword").value;

    const confirmPassword=
    document.getElementById("confirmPassword").value;

    if(!newPassword || !confirmPassword){

        setMessage(
            "resetMessage",
            "Please fill in all fields.",
            "error"
        );

        return;
    }

    if(newPassword.length<8){

        setMessage(
            "resetMessage",
            "Password must be at least 8 characters.",
            "error"
        );

        return;
    }

    if(newPassword!==confirmPassword){

        setMessage(
            "resetMessage",
            "Passwords do not match.",
            "error"
        );

        return;
    }

    try{

        setMessage(
            "resetMessage",
            "Resetting password...",
            ""
        );

        const response=await fetch(
            API_BASE+"/reset-password",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    token,
                    newPassword
                })
            }
        );

        const data=await response.json();

        if(!response.ok){
            throw new Error(
                data.error || "Password reset failed."
            );
        }

        setMessage(
            "resetMessage",
            "✅ Password reset successful! Redirecting...",
            "success"
        );

        setTimeout(()=>{
            window.location.href="login.html";
        },2000);

    }catch(error){

        setMessage(
            "resetMessage",
            error.message,
            "error"
        );

    }

});

</script>

</body>
</html>
