<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HanVerse • Password Reset</title>
<meta name="description" content="Forgot your HanVerse password? Request a reset link and get back to learning.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HanVerse">
  <meta property="og:title" content="Reset Your Password | HanVerse">
  <meta property="og:description" content="Forgot your HanVerse password? Request a reset link and get back to learning.">
  <meta property="og:image" content="/Hanverse-logo2.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Reset Your Password | HanVerse">
  <meta name="twitter:description" content="Forgot your HanVerse password? Request a reset link and get back to learning.">
  <meta name="twitter:image" content="/Hanverse-logo2.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="hanverse.css">
<script src="js/auth-fetch.js"></script>
<style>
    :root {
      --primary: #2563EB;
      --secondary: #14B8A6;
      --accent: #F59E0B;
      --danger: #DC2626;
      --dark: #0F2340;
      --text: #1E3A5F;
      --muted: #5D7A9A;
      --surface: #FFFFFF;
      --background: #F5F9FF;
      --border: #D5E3F0;
      --shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(160deg, #F5F9FF 0%, #EFF6FF 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 120px 30px 40px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.06);
      top: -350px;
      left: -300px;
      z-index: 1;
    }

    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: rgba(20, 184, 166, 0.06);
      bottom: -300px;
      right: -300px;
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(18px);
      border-radius: 30px;
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: fade 0.5s ease-out;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-circle {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
    }

    .logo h1 {
      font-size: 2rem;
      color: var(--dark);
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark);
      font-size: 0.9rem;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: #F5F9FF;
      font-size: 15px;
      color: var(--dark);
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }

    .input-wrap input {
      padding-right: 50px;
    }

    .eye {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      user-select: none;
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.15);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background-color: #E6F4EA;
      color: #137333;
    }

    .message.error {
      background-color: #FCE8E6;
      color: #C5221F;
    }

    .strength {
      margin-top: 10px;
      height: 6px;
      border-radius: 999px;
      background: #D5E3F0;
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0;
      transition: width 0.3s ease, background-color 0.3s ease;
      background: #DC2626;
    }

    .strength-text {
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
    }

    .back {
      margin-top: 24px;
      text-align: center;
    }

    .back a {
      text-decoration: none;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .back a:hover {
      color: var(--secondary);
    }

    @media(max-width: 540px){
      .card {
        padding: 30px 20px;
        border-radius: 20px;
      }
      .logo h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

<div id="app-nav"></div>

<div class="card">
  <!-- REQUEST FORM SECTION -->
  <div id="requestSection">
    <div class="logo">
      <div class="logo-circle">🐼</div>
      <h1>Forgot Password</h1>
    </div>
    <p class="subtitle">Enter your HanVerse email address and we'll send you a secure password reset link.</p>
    
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    
    <button id="sendBtn">📧 Send Reset Link</button>
    <div id="requestMessage" class="message"></div>
  </div>

  <!-- PASSWORD UPDATING SECTION -->
  <div id="resetSection" class="hidden">
    <div class="logo">
      <div class="logo-circle">🔒</div>
      <h1>New Password</h1>
    </div>
    <p class="subtitle">Choose a strong password to protect your HanVerse profile.</p>
    
    <div class="field">
      <label for="newPassword">New Password</label>
      <div class="input-wrap">
        <input type="password" id="newPassword" placeholder="Minimum 8 characters">
        <span class="eye" id="toggleNew">👁️</span>
      </div>
      <div class="strength">
        <div id="strengthBar" class="strength-bar"></div>
      </div>
      <div id="strengthText" class="strength-text">Password security indicator</div>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <div class="input-wrap">
        <input type="password" id="confirmPassword" placeholder="Repeat new password">
        <span class="eye" id="toggleConfirm">👁️</span>
      </div>
    </div>
    
    <button id="resetBtn">🔑 Reset Password</button>
    <div id="resetMessage" class="message"></div>
  </div>

  <div class="back">
    <a href="login.html">← Back to Login</a>
  </div>
</div>

<script>
  /* ==========================================
     ENVIRONMENT ROUTE CONFIG
  ========================================== */
  const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
      ? "/.netlify/functions/server"
      : "/api";

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  /* ==========================================
     DOM INSTANCES
  ========================================== */
  const requestSection = document.getElementById("requestSection");
  const resetSection = document.getElementById("resetSection");
  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");
  const emailInput = document.getElementById("email");
  const newPassword = document.getElementById("newPassword");
  const confirmPassword = document.getElementById("confirmPassword");
  const strengthBar = document.getElementById("strengthBar");
  const strengthText = document.getElementById("strengthText");

  // Show password entry section if dynamic token is parsed from the link address
  if (token) {
      requestSection.classList.add("hidden");
      resetSection.classList.remove("hidden");
  }

  /* ==========================================
     UI ALERT HELPERS
  ========================================== */
  function showMessage(elementId, text, type) {
      const el = document.getElementById(elementId);
      if (!el) return;
      
      el.textContent = text;
      el.className = `message show ${type}`;
  }

  function clearMessage(elementId) {
      const el = document.getElementById(elementId);
      if (el) el.className = "message";
  }

  /* ==========================================
     COMPLEXITY METRIC CALCULATION
  ========================================== */
  function evaluatePasswordStrength(pwd) {
      let score = 0;
      if (pwd.length >= 8) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[a-z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;

      const styles = [
          { label: "Very Weak", width: "15%", color: "#DC2626" },
          { label: "Weak", width: "35%", color: "#F97316" },
          { label: "Fair", width: "55%", color: "#F59E0B" },
          { label: "Good", width: "75%", color: "#3B82F6" },
          { label: "Strong", width: "90%", color: "#14B8A6" },
          { label: "Excellent", width: "100%", color: "#16A34A" }
      ];

      const currentStyle = styles[score];
      if (strengthBar && strengthText) {
          strengthBar.style.width = currentStyle.width;
          strengthBar.style.backgroundColor = currentStyle.color;
          strengthText.textContent = `Password strength: ${currentStyle.label}`;
      }
  }

  if (newPassword) {
      newPassword.addEventListener("input", () => {
          evaluatePasswordStrength(newPassword.value);
      });
  }

  /* ==========================================
     VISIBILITY FIELD MANAGERS
  ========================================== */
  document.getElementById("toggleNew")?.addEventListener("click", function() {
      newPassword.type = newPassword.type === "password" ? "text" : "password";
      this.textContent = newPassword.type === "password" ? "👁️" : "🙈";
  });

  document.getElementById("toggleConfirm")?.addEventListener("click", function() {
      confirmPassword.type = confirmPassword.type === "password" ? "text" : "password";
      this.textContent = confirmPassword.type === "password" ? "👁️" : "🙈";
  });

  /* ==========================================
     TRANSMIT REQUEST LINK ACTION
  ========================================== */
  sendBtn?.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      clearMessage("requestMessage");

      if (!email) {
          showMessage("requestMessage", "Please input a registered email address.", "error");
          return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "Sending link...";

      try {
          const response = await fetch(`${API_URL}/forgot-password`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email })
          });

          let data;
          try {
              data = await response.json();
          } catch (jsonErr) {
              throw new Error(`Endpoint path missing (${response.status} Error). Double-check that your Express server code has mounted 'router.post("/forgot-password")' ABOVE your netlify handler export.`);
          }

          if (!response.ok) {
              throw new Error(data.error || "Failed to send recovery link.");
          }

          showMessage("requestMessage", "✅ Password reset link has been dispatched to your email address.", "success");
          emailInput.value = "";
      } catch (error) {
          console.error("Forgot password request failure:", error);
          showMessage("requestMessage", error.message, "error");
      } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "📧 Send Reset Link";
      }
  });

  /* ==========================================
     SAVE NEW PASSWORDS OVERRIDES
  ========================================== */
  resetBtn?.addEventListener("click", async () => {
      const pwdValue = newPassword.value;
      const confirmValue = confirmPassword.value;
      clearMessage("resetMessage");

      if (!pwdValue || !confirmValue) {
          showMessage("resetMessage", "All text entry fields must be filled.", "error");
          return;
      }
      if (pwdValue.length < 8) {
          showMessage("resetMessage", "The new password must contain at least 8 characters.", "error");
          return;
      }
      if (pwdValue !== confirmValue) {
          showMessage("resetMessage", "Passwords do not match.", "error");
          return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = "Updating password...";

      try {
          const response = await fetch(`${API_URL}/reset-password`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, newPassword: pwdValue })
          });

          let data;
          try {
              data = await response.json();
          } catch (jsonErr) {
              throw new Error(`Endpoint path missing (${response.status} Error). Double-check that your Express server code has mounted 'router.post("/reset-password")' ABOVE your netlify handler export.`);
          }

          if (!response.ok) {
              throw new Error(data.error || "Password update operation failed.");
          }

          showMessage("resetMessage", "🎉 Password saved successfully! Navigating to login view dashboard...", "success");
          
          setTimeout(() => {
              window.location.href = "login.html";
          }, 2500);
      } catch (error) {
          console.error("Password save operation exception:", error);
          showMessage("resetMessage", error.message, "error");
          resetBtn.disabled = false;
          resetBtn.textContent = "🔑 Reset Password";
      }
  });

  /* ==========================================
     KEYBOARD EVENTS INTERFACES
  ========================================== */
  emailInput?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendBtn.click();
  });
  confirmPassword?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") resetBtn.click();
  });
</script>
<script src="shared-nav.js#auth"></script>
<script src="hanverse.js"></script>
<script src="nav-user.js"></script>

</body>
</html>
