<style>

:root{

--primary:#2563EB;

--dark:#0F172A;
--text:#334155;

0 20px 60px rgba(15,23,42,.08);

margin:0;
padding:0;

font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(

rgba(255,255,255,.9);

box-shadow:
0 15px 40px rgba(37,99,235,.25);

<body>

<div class="card">

<div id="requestSection">

<div class="logo">

<div class="logo-circle">
🐼
</div>

<h1>Forgot Password</h1>

</div>

<p class="subtitle">

Enter your HanVerse email address and we'll send you a secure password reset link.

</p>

<div class="field">

<label>Email Address</label>

<div class="input-wrap">

<input
type="email"
id="email"
placeholder="you@example.com">

</div>

</div>

<button id="sendBtn">

📧 Send Reset Link

</button>

<div
id="requestMessage"
class="message">

</div>

</div>

<div
id="resetSection"
class="hidden">

<div class="logo">

<div class="logo-circle">

🔒

</div>

<h1>Create New Password</h1>

</div>

<p class="subtitle">

Choose a strong password to keep your HanVerse account secure.

</p>

<div class="field">

<label>New Password</label>

<div class="input-wrap">

<input
type="password"
id="newPassword">

<span
class="eye"
id="toggleNew">

👁️

</span>

</div>

<div class="strength">

<div
id="strengthBar"
class="strength-bar">

</div>

</div>

<div
id="strengthText"
class="strength-text">

Password strength

</div>

</div>

<div class="field">

<label>Confirm Password</label>

<div class="input-wrap">

<input
type="password"
id="confirmPassword">

<span
class="eye"
id="toggleConfirm">

👁️

</span>

</div>

</div>

<button id="resetBtn">

🔑 Reset Password

</button>

<div
id="resetMessage"
class="message">

</div>

</div>

<div class="back">

<a href="login.html">

← Back to Login

</a>

</div>

</div>

<script>
/* ==========================================
   HANVERSE PASSWORD RESET
========================================== */

const API_URL =
    window.location.hostname === "localhost"
        ? "/.netlify/functions/server"
        : "/api";

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

/* ==========================================
   ELEMENTS
========================================== */

const requestSection = document.getElementById("requestSection");
const resetSection = document.getElementById("resetSection");

const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");

const emailInput = document.getElementById("email");

const newPassword = document.getElementById("newPassword");
const confirmPassword = document.getElementById("confirmPassword");

const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");

/* ==========================================
   SHOW RESET SCREEN
========================================== */

if (token) {

    requestSection.classList.add("hidden");
    resetSection.classList.remove("hidden");

}

/* ==========================================
   MESSAGE
========================================== */

function showMessage(id, message, type = "") {

    const el = document.getElementById(id);

    el.textContent = message;
    el.className = "message " + type;

}

/* ==========================================
   PASSWORD STRENGTH
========================================== */

function checkStrength(password){

    let score = 0;

    if(password.length >= 8) score++;
    if(/[A-Z]/.test(password)) score++;
    if(/[a-z]/.test(password)) score++;
    if(/[0-9]/.test(password)) score++;
    if(/[^A-Za-z0-9]/.test(password)) score++;

    const labels = [
        "Very Weak",
        "Weak",
        "Fair",
        "Good",
        "Strong",
        "Excellent"
    ];

    const widths = [
        "10%",
        "25%",
        "45%",
        "65%",
        "85%",
        "100%"
    ];

    const colours = [
        "#EF4444",
        "#F97316",
        "#F59E0B",
        "#3B82F6",
        "#14B8A6",
        "#10B981"
    ];

    strengthBar.style.width = widths[score];
    strengthBar.style.background = colours[score];
    strengthText.textContent = labels[score];

}

if(newPassword){

    newPassword.addEventListener("input",()=>{

        checkStrength(newPassword.value);

    });

}

/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

document.getElementById("toggleNew")?.addEventListener("click",()=>{

    newPassword.type =
        newPassword.type==="password"
        ? "text"
        : "password";

});

document.getElementById("toggleConfirm")?.addEventListener("click",()=>{

    confirmPassword.type =
        confirmPassword.type==="password"
        ? "text"
        : "password";

});

/* ==========================================
   SEND RESET EMAIL
========================================== */

sendBtn?.addEventListener("click", async ()=>{

    const email = emailInput.value.trim();

    if(!email){

        showMessage(
            "requestMessage",
            "Please enter your email.",
            "error"
        );

        return;

    }

    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";

    try{

        const response = await fetch(
            `${API_URL}/forgot-password`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    email
                })
            }
        );

        const data = await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Unable to send reset email."
            );

        }

        showMessage(
            "requestMessage",
            "✅ Password reset link sent. Please check your email.",
            "success"
        );

    }

    catch(error){

        console.error(error);

        showMessage(
            "requestMessage",
            error.message,
            "error"
        );

    }

    finally{

        sendBtn.disabled = false;
        sendBtn.textContent = "📧 Send Reset Link";

    }

});

/* ==========================================
   RESET PASSWORD
========================================== */

resetBtn?.addEventListener("click", async ()=>{

    const password = newPassword.value;
    const confirm = confirmPassword.value;

    if(!password || !confirm){

        showMessage(
            "resetMessage",
            "Please fill in all fields.",
            "error"
        );

        return;

    }

    if(password.length < 8){

        showMessage(
            "resetMessage",
            "Password must be at least 8 characters.",
            "error"
        );

        return;

    }

    if(password !== confirm){

        showMessage(
            "resetMessage",
            "Passwords do not match.",
            "error"
        );

        return;

    }

    resetBtn.disabled = true;
    resetBtn.textContent = "Resetting...";

    try{

        const response = await fetch(
            `${API_URL}/reset-password`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({

                    token,
                    newPassword: password

                })
            }
        );

        const data = await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Password reset failed."
            );

        }

        showMessage(
            "resetMessage",
            "✅ Password changed successfully! Redirecting...",
            "success"
        );

        setTimeout(()=>{

            window.location.href="login.html";

        },2000);

    }

    catch(error){

        console.error(error);

        showMessage(
            "resetMessage",
            error.message,
            "error"
        );

    }

    finally{

        resetBtn.disabled = false;
        resetBtn.textContent = "🔑 Reset Password";

    }

});

/* ==========================================
   ENTER KEY SUPPORT
========================================== */

emailInput?.addEventListener("keydown",(e)=>{

    if(e.key==="Enter"){

        sendBtn.click();

    }

});

confirmPassword?.addEventListener("keydown",(e)=>{

    if(e.key==="Enter"){

        resetBtn.click();

    }

});
</script>

</body>
</html>
