<script>
(function(){
  var body=document.getElementById('body'),arm=document.getElementById('arm'),hand=document.getElementById('hand'),shadow=document.getElementById('shadow');
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var WAVE=3.4,GAP=1.8,F=2.5; // wave seconds, rest seconds, waves per second
  var start=0,t0=performance.now();
  function ss(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
  function frame(now){
    var t=(now-t0)/1000,c=t-start; if(c>WAVE+GAP){start+=WAVE+GAP;c-=WAVE+GAP;}
    var env=c<WAVE?ss(0,.45,c)*(1-ss(WAVE-.6,WAVE,c)):0;
    if(still)env=0;
    var ph=2*Math.PI*F*c;
    var flick=Math.sin(ph)+.22*Math.sin(2*ph+.6);          // snappy wrist
    var hAng=env*24*flick;
    var aAng=-4*env+env*2.4*Math.sin(ph-1.1);              // forearm follows, lagging
    var bob=env*1.6*Math.abs(Math.sin(ph/2+.4));           // little bounce in time with the wave
    var br=still?0:Math.sin(t*2.1);                         // breathing
    var sx=1+.004*br,sy=1-.006*br+(-.004*env);
    var lean=env*1.1*Math.sin(ph/2-.5);
    hand.setAttribute('transform','rotate('+hAng.toFixed(2)+' 137 189)');
    arm.setAttribute('transform','rotate('+aAng.toFixed(2)+' 188 244)');
    body.setAttribute('transform','translate(0 '+(-bob).toFixed(2)+') translate(250 446) rotate('+lean.toFixed(2)+') scale('+sx.toFixed(4)+' '+sy.toFixed(4)+') translate(-250 -446)');
    shadow.setAttribute('rx',(108-bob*2).toFixed(1));
    requestAnimationFrame(frame);
  }
  document.getElementById('stage').addEventListener('click',function(){start=(performance.now()-t0)/1000;});
  requestAnimationFrame(frame);
})();
</script>
<script>
(function(){
  var cfg={"L":[197.3,236.6,117.3,157.4],"R":[291.5,331.6,128.4,169.4]};
  var eyes=['L','R'].map(function(k){var b=cfg[k];return{up:document.getElementById('up'+k),lo:document.getElementById('lo'+k),cr:document.getElementById('cr'+k),x0:b[0]-12,x1:b[1]+12,cx:(b[0]+b[1])/2,T:b[2],B:b[3],H:b[3]-b[2]};});
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(c){
    eyes.forEach(function(e){
      var meet=e.T+e.H*.62,cl=Math.pow(c,1.6);
      var yU=(e.T-9)+(meet+.5-(e.T-9))*c,yL=(e.B+9)+(meet-.5-(e.B+9))*cl;
      var s=7*(1-.25*c);
      e.up.setAttribute('d','M'+e.x0+','+(e.T-40)+' L'+e.x1+','+(e.T-40)+' L'+e.x1+','+yU.toFixed(2)+' Q'+e.cx+','+(yU+s).toFixed(2)+' '+e.x0+','+yU.toFixed(2)+'Z');
      e.lo.setAttribute('d','M'+e.x0+','+(e.B+40)+' L'+e.x1+','+(e.B+40)+' L'+e.x1+','+yL.toFixed(2)+' Q'+e.cx+','+(yL+s).toFixed(2)+' '+e.x0+','+yL.toFixed(2)+'Z');
      e.cr.setAttribute('d','M'+(e.x0+14)+','+meet.toFixed(2)+' Q'+e.cx+','+(meet+s).toFixed(2)+' '+(e.x1-14)+','+meet.toFixed(2));
      e.cr.setAttribute('opacity',(Math.pow(c,3)*.55).toFixed(2));
    });
  }
  draw(0);
  if(still)return;
  var CLOSE=.075,HOLD=.045,OPEN=.15;
  function amt(t){
    if(t<0)return 0;
    if(t<CLOSE){var x=t/CLOSE;return x*x;}
    if(t<CLOSE+HOLD)return 1;
    var o=(t-CLOSE-HOLD)/OPEN;
    return o<1?(1-o)*(1-o):0;
  }
  var blinks=[],next=performance.now()/1000+1.0;
  function loop(now){
    var t=now/1000;
    if(t>=next){blinks.push(next);if(Math.random()<.18)blinks.push(next+.28);next+=2.2+Math.random()*2.8;}
    var c=0;
    for(var i=blinks.length-1;i>=0;i--){var d=t-blinks[i];if(d>CLOSE+HOLD+OPEN+.05){blinks.splice(i,1);continue;}c=Math.max(c,amt(d));}
    draw(c);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script></body></html>
