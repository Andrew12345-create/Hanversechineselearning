<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Verify Account | Hanverse</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

:root{
--yellow:#F4D35E;
--red:#E63946;
--blue:#4EA8DE;
--green:#74C69D;
--bg:#FFFDF7;
--text:#1A1A2E;
--secondary:#6B7280;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:var(--bg);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

position:relative;

overflow:hidden;

}

body::before{

content:'';

position:fixed;

width:700px;
height:700px;

border-radius:50%;

background:
rgba(116,198,157,.08);

top:-350px;
left:-350px;

}

body::after{

content:'';

position:fixed;

width:600px;
height:600px;

border-radius:50%;

background:
rgba(244,211,94,.08);

bottom:-300px;
right:-300px;

}

.card{

position:relative;

z-index:2;

background:white;

width:100%;
max-width:580px;

padding:55px;

border-radius:35px;

text-align:center;

box-shadow:
0 25px 60px rgba(0,0,0,.08);

animation:fade .8s ease;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

font-size:44px;
font-weight:800;

color:var(--yellow);

margin-bottom:20px;

}

.icon{

font-size:90px;

margin-bottom:20px;

}

h1{

font-size:34px;

color:var(--text);

margin-bottom:15px;

}

p{

color:var(--secondary);

line-height:1.8;

margin-bottom:25px;

}

.success{
color:var(--green);
}

.error{
color:var(--red);
}

.btn{

display:none;

border:none;

padding:15px 32px;

border-radius:40px;

font-size:15px;

font-weight:700;

cursor:pointer;

background:
linear-gradient(
135deg,
var(--green),
#52B788
);

color:white;

box-shadow:
0 10px 26px rgba(116,198,157,.35);

transition:.25s;

}

.btn:hover{

transform:
translateY(-2px);

}

.panda{

font-size:55px;

margin-top:20px;

}

@media(max-width:600px){

.card{

padding:35px;

}

.logo{

font-size:36px;

}

h1{

font-size:28px;

}

.icon{

font-size:70px;

}

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
Hanverse
</div>

<div
class="icon"
id="icon">

⏳

</div>

<h1 id="title">

Verifying Your Account...

</h1>

<p id="message">

Please wait while we verify your email address.

</p>

<button
id="loginBtn"
class="btn">

Go To Login

</button>

<div class="panda">
🐼
</div>

</div>
<script>

/* ==========================================
   CONFIG
========================================== */

const API_URL = '/api';

/* ==========================================
   ELEMENTS
========================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const token =
  params.get('token');

const icon =
  document.getElementById('icon');

const title =
  document.getElementById('title');

const message =
  document.getElementById('message');

const loginBtn =
  document.getElementById('loginBtn');

/* ==========================================
   VERIFY EMAIL
========================================== */

async function verifyEmail(){

  if(!token){

    icon.innerHTML = '❌';

    title.innerHTML =
      'Invalid Verification Link';

    title.classList.add(
      'error'
    );

    message.innerHTML =
      'No verification token was provided.';

    return;
  }

  try{

    const response =
      await fetch(
        API_URL +
        '/verify-email?token=' +
        encodeURIComponent(token)
      );

    const data =
      await response.json();

    if(!response.ok){

      icon.innerHTML = '❌';

      title.innerHTML =
        'Verification Failed';

      title.classList.add(
        'error'
      );

      message.innerHTML =
        data.error ||
        'The verification link is invalid or has expired.';

      return;
    }

    icon.innerHTML = '🎉';

    title.innerHTML =
      'Email Verified!';

    title.classList.add(
      'success'
    );

    message.innerHTML =
      'Your Hanverse account has been activated successfully. You can now log in and start learning Mandarin.';

    loginBtn.style.display =
      'inline-block';

    // Auto-redirect to login after 2 seconds
    setTimeout(() => {
      window.location.href = 'login.html?verified=1';
    }, 2000);

  }
  catch(error){

    console.error(error);

    icon.innerHTML = '❌';

    title.innerHTML =
      'Connection Error';

    title.classList.add(
      'error'
    );

    message.innerHTML =
      'Unable to connect to the Hanverse server. Please try again later.';
  }

}

/* ==========================================
   LOGIN BUTTON
========================================== */

loginBtn.addEventListener(
  'click',
  ()=>{

    window.location.href =
      'login.html';

  }
);

/* ==========================================
   PAGE LOAD
========================================== */

window.addEventListener(
  'load',
  verifyEmail
);

</script>

</body>
</html>
