<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | HanVerse 🐼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap');
        body {
            font-family: 'Quicksand', sans-serif;
        }
        .brand-font {
            font-family: 'Fredoka', sans-serif;
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full border-4 border-teal-500/20 text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-2 bg-teal-500"></div>

        <div class="text-6xl mb-2">🐼</div>
        <h1 class="brand-font text-3xl font-bold text-slate-800 mb-2">HanVerse</h1>
        <p class="text-slate-500 font-medium mb-6">Let's secure your account with a new password!</p>

        <div id="loadingState" class="py-6 text-slate-600 font-medium">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-teal-500 border-t-transparent rounded-full mb-2"></div>
            <p>Checking your recovery request...</p>
        </div>

        <div id="errorState" class="hidden py-4">
            <div class="text-red-500 text-5xl mb-2">⚠️</div>
            <p id="errorMessage" class="text-red-600 font-semibold mb-4">Invalid or expired reset token.</p>
            <a href="/" class="inline-block bg-slate-200 text-slate-700 px-6 py-2 rounded-full font-bold hover:bg-slate-300 transition">Go to Home</a>
        </div>

        <form id="resetForm" class="hidden text-left space-y-4">
            <div>
                <label for="password" class="block text-sm font-bold text-slate-700 mb-1">New Password</label>
                <input type="password" id="password" required minlength="8" placeholder="At least 8 characters"
                    class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 transition font-medium text-slate-700">
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm font-bold text-slate-700 mb-1">Confirm New Password</label>
                <input type="password" id="confirmPassword" required minlength="8" placeholder="Repeat your password"
                    class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-teal-500 transition font-medium text-slate-700">
            </div>

            <div id="formFeedback" class="hidden p-3 bg-red-50 text-red-600 text-sm font-semibold rounded-xl"></div>

            <button type="submit" id="submitBtn"
                class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-6 rounded-xl shadow-md transition transform active:scale-95 brand-font text-lg tracking-wide">
                Update Password 🔒
            </button>
        </form>

        <div id="successState" class="hidden py-6">
            <div class="text-emerald-500 text-6xl mb-3">🎉</div>
            <h2 class="brand-font text-2xl font-bold text-slate-800 mb-2">Success!</h2>
            <p class="text-slate-600 font-medium mb-6">Your password has been securely updated.</p>
            <a href="/" class="inline-block bg-teal-500 hover:bg-teal-600 text-white font-bold px-8 py-3 rounded-xl shadow-md transition brand-font">
                Log In Now
            </a>
        </div>
    </div>

    <script>
        // 1. Detect environment and automatically point to the correct Netlify path
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_URL = isLocal ? '/.netlify/functions/server' : '/api';

        // 2. Extract token out of the URL string parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const resetForm = document.getElementById('resetForm');
        const formFeedback = document.getElementById('formFeedback');
        const successState = document.getElementById('successState');

        // Initial validation block
        window.addEventListener('DOMContentLoaded', () => {
            if (!token) {
                loadingState.classList.add('hidden');
                errorMessage.textContent = "Oops! You're missing a valid password reset token link.";
                errorState.classList.remove('hidden');
            } else {
                // Token exists, safe to reveal the update form input options
                loadingState.classList.add('hidden');
                resetForm.classList.remove('hidden');
            }
        });

        // 3. Form Submission Interception
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            formFeedback.classList.add('hidden');

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            // Client-side structural sanity check
            if (password !== confirmPassword) {
                formFeedback.textContent = "Your passwords don't match!";
                formFeedback.classList.remove('hidden');
                return;
            }

            if (password.length < 8) {
                formFeedback.textContent = "Password must be at least 8 characters long.";
                formFeedback.classList.remove('hidden');
                return;
            }

            // Lock submit button to prevent double clicks
            submitBtn.disabled = true;
            submitBtn.textContent = "Updating...";

            try {
                const response = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: password })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Failed to apply new security password changes.');
                }

                // Success pipeline jump
                resetForm.classList.add('hidden');
                successState.classList.remove('hidden');

            } catch (err) {
                formFeedback.textContent = err.message;
                formFeedback.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = "Update Password 🔒";
            }
        });
    </script>
</body>
</html>
