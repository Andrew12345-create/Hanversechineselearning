<!-- 404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | HanVerse</title>
    <link rel="icon" type="image/png" href="Hanverse-logo2.png">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="That page wandered off. Head back to your Mandarin adventure.">
    <link rel="stylesheet" href="hanverse.css?v=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #2563EB, #14B8A6);
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }
        .panda { font-size: 64px; display: block; margin-bottom: 12px; }
        .code { font-size: 15px; font-weight: 800; letter-spacing: 3px; opacity: .85; margin-bottom: 6px; }
        h1 { font-size: 1.6rem; margin-bottom: 10px; }
        p { font-size: .95rem; opacity: .92; margin-bottom: 26px; line-height: 1.5; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            padding: 13px 26px;
            border-radius: 14px;
            font-weight: 800;
            font-size: .95rem;
            text-decoration: none;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: #fff; color: #2563EB; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
        .btn-ghost { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.4); }
        .zh { font-size: 1.1rem; opacity: .9; margin-top: 18px; font-weight: 700; }
    </style>
</head>
<body>
    <main class="card">
        <span class="panda" aria-hidden="true">🐼</span>
        <div class="code">404</div>
        <h1>This page wandered off</h1>
        <p>HanPan looked everywhere, but there's nothing here. Let's get you back to learning!</p>
        <div class="actions">
            <a class="btn btn-primary" href="learn.html">Go to my lessons</a>
            <a class="btn btn-ghost" href="index.html">Home</a>
        </div>
        <div class="zh">没关系！我们回去学习吧 📚</div>
    </main>
</body>
</html>
