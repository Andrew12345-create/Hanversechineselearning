name: CI

on:
  push:
    branches: [main, hanverse-learn]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Static integrity gate
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Dependency audit (blocks on high/critical)
        run: npm audit --audit-level=high
