<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Verify Email | Hanverse 🐼</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" sizes="32x32" href="hanverse-logo2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="hanverse-logo2.png" />
    <link rel="apple-touch-icon" href="hanverse-logo2.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8FAFC;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.05), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(20, 184, 166, 0.05), transparent 50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon {
            font-size: 72px;
            margin-bottom: 16px;
            display: block;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #2563EB, #14B8A6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 8px;
        }

        p {
            color: #64748B;
            line-height: 1.7;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        .status-box {
            padding: 20px;
            border-radius: 16px;
            margin: 16px 0 24px;
            display: none;
        }

        .status-box.success {
            display: block;
            background: #F0FDF4;
            border: 1px solid #22C55E;
        }

        .status-box.success .status-icon {
            color: #22C55E;
        }

        .status-box.error {
            display: block;
            background: #FEF2F2;
            border: 1px solid #EF4444;
        }

        .status-box.error .status-icon {
            color: #EF4444;
        }

        .status-box .status-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .status-box .status-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .status-box .status-message {
            font-size: 0.9rem;
            color: #475569;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            background: linear-gradient(135deg, #2563EB, #14B8A6);
            color: white;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.35);
        }

        .btn-secondary {
            background: white;
            color: #1E293B;
            border: 2px solid #E2E8F0;
            box-shadow: none;
            margin-left: 8px;
        }

        .btn-secondary:hover {
            border-color: #2563EB;
            color: #2563EB;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #E2E8F0;
            border-top-color: #2563EB;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 8px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .loading-text {
            color: #64748B;
            font-weight: 500;
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }
            .icon {
                font-size: 56px;
            }
            h1 {
                font-size: 20px;
            }
            .btn {
                padding: 12px 24px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== LOGO ===== -->
        <span class="icon">🐼</span>
        <div class="logo">Hanverse</div>

        <!-- ===== LOADING STATE ===== -->
        <div id="loadingState">
            <div class="spinner"></div>
            <p class="loading-text">Verifying your email...</p>
        </div>

        <!-- ===== SUCCESS STATE ===== -->
        <div id="successState" class="hidden">
            <div class="status-box success">
                <span class="status-icon">✅</span>
                <div class="status-title">Email Verified! 🎉</div>
                <div class="status-message">Your email has been successfully verified. You can now log in to your Hanverse account.</div>
            </div>
            <a href="login.html" class="btn">Log In Now</a>
        </div>

        <!-- ===== ERROR STATE ===== -->
        <div id="errorState" class="hidden">
            <div class="status-box error">
                <span class="status-icon">❌</span>
                <div class="status-title" id="errorTitle">Verification Failed</div>
                <div class="status-message" id="errorMessage">The verification link is invalid or has expired.</div>
            </div>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a href="login.html" class="btn btn-secondary">Back to Login</a>
                <a href="signup.html" class="btn">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_BASE = isLocal ? '/.netlify/functions/server' : '/api';

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const loadingState = document.getElementById('loadingState');
        const successState = document.getElementById('successState');
        const errorState = document.getElementById('errorState');
        const errorTitle = document.getElementById('errorTitle');
        const errorMessage = document.getElementById('errorMessage');

        // ============================================================
        // GET URL PARAMETERS
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        // ============================================================
        // VERIFY EMAIL FUNCTION
        // ============================================================
        async function verifyEmail() {
            // Validate parameters
            if (!token || !email) {
                showError('Missing Verification Parameters', 'The verification link is incomplete. Please check your email for the full link.');
                return;
            }

            try {
                // Call the server's verify-email endpoint
                const response = await fetch(`${API_BASE}/verify-email?token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                // The server redirects, so we need to handle the response
                // Check if we got a redirect
                if (response.redirected) {
                    // Follow the redirect
                    const redirectUrl = new URL(response.url);
                    const params = new URLSearchParams(redirectUrl.search);
                    const verified = params.get('verified');
                    const error = params.get('error');

                    if (verified === 'true') {
                        showSuccess();
                    } else {
                        showError('Verification Failed', error || 'The verification link is invalid or has expired.');
                    }
                    return;
                }

                // If not redirected, try to parse JSON
                let data;
                try {
                    data = await response.json();
                } catch {
                    // If not JSON, check the response text
                    const text = await response.text();
                    if (text.includes('verified=true') || text.includes('Email verified')) {
                        showSuccess();
                        return;
                    }
                    throw new Error('Unexpected server response');
                }

                if (data.success) {
                    showSuccess();
                } else {
                    showError('Verification Failed', data.error || 'The verification link is invalid or has expired.');
                }

            } catch (error) {
                console.error('Verification error:', error);
                showError('Verification Error', 'Unable to verify your email. Please try again or contact support.');
            }
        }

        // ============================================================
        // UI HELPERS
        // ============================================================
        function showSuccess() {
            loadingState.classList.add('hidden');
            successState.classList.remove('hidden');
            errorState.classList.add('hidden');
        }

        function showError(title, message) {
            loadingState.classList.add('hidden');
            successState.classList.add('hidden');
            errorState.classList.remove('hidden');
            errorTitle.textContent = title;
            errorMessage.textContent = message;
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already verified via URL param (from redirect)
            const params = new URLSearchParams(window.location.search);
            if (params.get('verified') === 'true') {
                showSuccess();
                return;
            }

            // Start verification
            verifyEmail();
        });

        // ============================================================
        // EXPOSE GLOBALLY
        // ============================================================
        window.verifyEmail = verifyEmail;
        window.showSuccess = showSuccess;
        window.showError = showError;
    </script>

</body>
</html>
