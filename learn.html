<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hanverse Learn</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

:root{

--primary:#2563EB;
--secondary:#14B8A6;
--accent:#F59E0B;

--success:#22C55E;

--bg:#F8FAFC;
--surface:#FFFFFF;

--dark:#0F172A;
--text:#334155;
--muted:#64748B;

--border:#E2E8F0;

--shadow:
0 20px 50px rgba(15,23,42,.08);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:var(--bg);

color:var(--dark);

overflow-x:hidden;

}

html{
scroll-behavior:smooth;
}

body::before{

content:'';

position:fixed;

inset:0;

z-index:-2;

background:

radial-gradient(
circle at 10% 20%,
rgba(37,99,235,.08),
transparent 35%
),

radial-gradient(
circle at 90% 80%,
rgba(20,184,166,.08),
transparent 35%
);

}

/* NAV */

nav{

position:sticky;
top:0;

z-index:1000;

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 8%;

background:
rgba(255,255,255,.85);

backdrop-filter:
blur(20px);

border-bottom:
1px solid rgba(0,0,0,.05);

}

.logo{

display:flex;
align-items:center;

gap:12px;

font-size:28px;
font-weight:800;

color:var(--primary);

}

.logo-badge{

width:48px;
height:48px;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
var(--primary),
var(--secondary)
);

color:white;

font-size:24px;

}

nav ul{

display:flex;

gap:28px;

list-style:none;

}

nav a{

text-decoration:none;

font-weight:600;

color:var(--muted);

transition:.3s;

}

nav a:hover{

color:var(--primary);

}

.active{

color:var(--primary);

}

.nav-buttons{

display:flex;

gap:12px;

}

.btn{

padding:13px 24px;

border:none;

border-radius:999px;

font-weight:700;

cursor:pointer;

transition:.3s;

}

.btn:hover{

transform:
translateY(-3px);

}

.btn-login{

background:white;

border:
1px solid #dbeafe;

}

.btn-main{

background:
linear-gradient(
135deg,
var(--primary),
var(--secondary)
);

color:white;

}

/* DASHBOARD */

.dashboard{

padding:40px 8%;

}

.dashboard-card{

background:white;

padding:35px;

border-radius:35px;

box-shadow:
var(--shadow);

display:grid;

grid-template-columns:
2fr 1fr 1fr 1fr;

gap:20px;

align-items:center;

}

.dashboard h2{

margin-bottom:10px;

}

.stat{

text-align:center;

}

.stat h3{

font-size:34px;

color:var(--primary);

}

/* HERO */

.hero{

padding:80px 8%;

display:grid;

grid-template-columns:
1.1fr 1fr;

gap:70px;

align-items:center;

}

.hero h1{

font-size:
clamp(52px,6vw,78px);

line-height:1.05;

margin-bottom:20px;

}

.gradient{

background:
linear-gradient(
90deg,
var(--primary),
var(--secondary)
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.hero p{

font-size:18px;

line-height:1.8;

color:var(--muted);

margin-bottom:30px;

}

.hero-card{

height:450px;

background:white;

border-radius:40px;

box-shadow:var(--shadow);

display:flex;
justify-content:center;
align-items:center;

position:relative;

overflow:hidden;

}

.hero-card span{

font-size:130px;

}

.float-char{

position:absolute;

font-size:60px;

opacity:.05;

font-weight:800;

}

.c1{top:30px;left:30px;}
.c2{top:60px;right:40px;}
.c3{bottom:40px;left:40px;}
.c4{bottom:30px;right:30px;}

/* LEARNING PATH */

.path{

padding:80px 8%;

}

.section-title{

font-size:42px;

margin-bottom:15px;

text-align:center;

}

.section-subtitle{

text-align:center;

max-width:700px;

margin:auto;

margin-bottom:50px;

color:var(--muted);

}

.path-grid{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:25px;

}

.path-card{

background:white;

padding:30px;

border-radius:30px;

text-align:center;

box-shadow:var(--shadow);

transition:.3s;

}

.path-card:hover{

transform:
translateY(-8px);

}

.path-icon{

font-size:48px;

margin-bottom:15px;

}

/* LESSONS */

.lessons{

padding:80px 8%;

}

.lesson-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));

gap:25px;

}

.lesson-card{

background:white;

padding:30px;

border-radius:30px;

box-shadow:var(--shadow);

transition:.3s;

cursor:pointer;

}

.lesson-card:hover{

transform:
translateY(-8px);

}

.lesson-card h3{

color:var(--primary);

margin-bottom:12px;

}

.progress{

height:12px;

background:#e5e7eb;

border-radius:999px;

overflow:hidden;

margin-top:15px;

}

.fill{

height:100%;

background:
linear-gradient(
90deg,
var(--secondary),
var(--success)
);

width:0;

transition:2s;

}

.badge{

display:inline-block;

padding:8px 14px;

border-radius:999px;

background:#dcfce7;

color:#15803d;

font-size:12px;

margin-top:15px;

}

@media(max-width:900px){

.hero,
.dashboard-card{

grid-template-columns:1fr;

}

.path-grid{

grid-template-columns:1fr;

}

nav{
 flex-direction:column;
 gap:20px;

}

/* Level Selection Modal */
.level-modal{
 position:fixed;
 top:0;
 left:0;
 right:0;
 bottom:0;
 background:rgba(0,0,0,.7);
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:1000;
}

.level-modal.hidden{
 display:none;
}

.level-modal-content{
 background:white;
 padding:40px;
 border-radius:24px;
 text-align:center;
 max-width:400px;
 width:90%;
}

.level-modal-content h2{
 font-size:1.8rem;
 margin-bottom:10px;
}

.level-modal-content p{
 color:var(--muted);
 margin-bottom:25px;
}

.level-options{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
}

.level-btn{
 padding:20px;
 border:none;
 border-radius:16px;
 background:linear-gradient(135deg,var(--primary),var(--secondary));
 color:white;
 font-weight:700;
 font-size:1rem;
 cursor:pointer;
 transition:.2s;
}

.level-btn:hover{
 transform:translateY(-2px);
 box-shadow:0 8px 20px rgba(37,99,235,.25);
}

.level-desc{
  font-size:.75rem;
  font-weight:400;
  opacity:.9;
  display:block;
  margin-top:5px;
}

/* Subscription Modal */
<div id="subscriptionModal" class="hidden">
  <div class="subscription-card">
    <button class="subscription-close" onclick="document.getElementById('subscriptionModal').classList.add('hidden')">✕</button>
    <img src="subscription-card-placeholder.png" alt="Hanverse Subscription Options" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'500\' height=\'400\' viewBox=\'0 0 500 400\'><rect width=\'500\' height=\'400\' fill=\'%23f0f9ff\'/><text x=\'50%25\' y=\'50%25\' font-family=\'Arial, sans-serif\' font-size=\'20\' fill=\'%2360a5fa\' text-anchor=\'middle\' dominant-baseline=\'middle\'>Hanverse Subscription Card</text></svg>';">
    <!-- Alternative fallback content if image doesn't load -->
    <div style="display: none;" id="subscriptionFallback">
      <h2 style="padding: 20px; text-align: center; color: var(--primary);">Subscription Options</h2>
      <div style="padding: 20px;">
        <p style="margin-bottom: 15px; text-align: center;">Thank you for choosing a Hanverse course!</p>
        <p style="text-align: center;">Complete your subscription to unlock premium features.</p>
      </div>
    </div>
  </div>
</div>

#subscriptionModal.hidden{
 display:none;
}

#subscriptionModal.show{
 display:flex;
 animation:fadeIn .3s ease;
}

@keyframes fadeIn{
 from{opacity:0;}
 to{opacity:1;}
}

.subscription-card{
 position:relative;
 max-width:500px;
 width:90%;
 max-height:90vh;
 border-radius:24px;
 overflow:hidden;
 box-shadow:0 25px 70px rgba(0,0,0,.4);
 background: white;
 animation:scaleIn .4s cubic-bezier(.34,1.56,.64,1);
}

@keyframes scaleIn{
 from{transform:scale(.8);opacity:0;}
 to{transform:scale(1);opacity:1;}
}

.subscription-card img{
 width:100%;
 height:auto;
 display:block;
}

.subscription-close{
 position:absolute;
 top:16px;
 right:16px;
 background:rgba(255,255,255,.9);
 backdrop-filter:blur(10px);
 border:none;
 width:40px;
 height:40px;
 border-radius:50%;
 font-size:20px;
 cursor:pointer;
 color:#333;
 font-weight: bold;
 box-shadow: 0 4px 12px rgba(0,0,0,.15);
 transition: all 0.2s ease;
 z-index: 10;
}

.subscription-close:hover {
 transform: scale(1.1);
 background:rgba(255,255,255,1);
}
