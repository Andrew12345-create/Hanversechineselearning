[build]
  command = "node scripts/bump-sw-version.cjs"
  publish = "."
  functions = "functions"

[build.environment]
  NODE_VERSION = "24.12.0"

[functions]
  directory = "functions"

[functions.esbuild]
  format = "esm"


# ================================
# API → Express serverless function
# ================================

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true


# ================================
# Clean page URLs
# ================================

[[redirects]]
  from = "/parents"
  to = "/parents.html"
  status = 200

[[redirects]]
  from = "/learn"
  to = "/learn.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/verify-email"
  to = "/verify-email.html"
  status = 200


[[redirects]]
  from = "/placement"
  to = "/placement.html"
  status = 200

[[redirects]]
  from = "/invite"
  to = "/invite.html"
  status = 200

[[redirects]]
  from = "/notifications"
  to = "/notifications.html"
  status = 200

# ================================
# Root handling
# ================================
# This file deploys to BOTH learn-hanverse and hanverse. A root redirect to
# https://hanverse.netlify.app/ therefore looped on the marketing host and
# produced ERR_TOO_MANY_REDIRECTS. Netlify redirect conditions support
# Language, Country and Role but not Host, so the redirect cannot be scoped
# to one host from here. Both hosts now serve index.html at the root.