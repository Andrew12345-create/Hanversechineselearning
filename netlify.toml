[build]
  command = ""
  publish = "."
  functions = "functions"

[build.environment]
  NODE_VERSION = "24.12.0"

[functions]
  directory = "functions"

[functions.esbuild]
  format = "esm"

# Rule 1: Proxy clean api endpoints to the serverless function handler
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

# Rule 2: Single Page Application router fallback (checks for real files like reset.html first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false # <-- This is vital! It stops index.html from hijacking reset.html
  [[redirects]]
  from = "/parents"
  to = "/parents.html"
  status = 200

[[redirects]]
  from = "/learn"
  to = "/learn.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/worksheets"
  to = "/worksheets.html"
  status = 200

[[redirects]]
  from = "/verify-email"
  to = "/verify-email.html"
  status = 200

# SPA fallback (optional)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404