[build]
  command = ""
  publish = "."
  functions = "functions"

[build.environment]
  NODE_VERSION = "24.12.0"
  # Secrets-scan false positives (non-secret config values; real secrets stay scanned):
  SECRETS_SCAN_OMIT_KEYS = "DB_USER,PORT,HOST,PUBLIC_SITE_URL,NODE_ENV,DB_PORT,DB_NAME,DB_PASSWORD,DB_HOST"

[functions]
  directory = "functions"

[functions.esbuild]
  format = "esm"


# ================================
# API → Express serverless function
# ================================

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true


