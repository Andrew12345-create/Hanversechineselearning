[build]
  command = ""
  publish = "."
  functions = "functions"

[build.environment]
  NODE_VERSION = "24.12.0"

[functions]
  directory = "functions"

[functions.esbuild]
  format = "esm"

# Rule 1: Proxy clean api endpoints to the serverless function handler
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

# Rule 2: Single Page Application router fallback (checks for real files like reset.html first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false