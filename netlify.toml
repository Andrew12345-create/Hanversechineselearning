[build]
  command = ""
  publish = "."
  functions = "functions"

[build.environment]
  NODE_VERSION = "24.12.0"

[functions]
  directory = "functions"

[functions.esbuild]
  format = "esm"

[[redirects]]
  from = "/api/*"
  status = 200
  force = true
  to = "/.netlify/functions/server/:splat"

[[redirects]]
  from = "/verify.html/*"
  status = 200
  to = "/verify.html"