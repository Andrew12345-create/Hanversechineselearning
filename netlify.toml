[build]
  command = "node scripts/bump-sw-version.cjs && node scripts/build-split.mjs"
  publish = "dist"
  functions = "functions"

[build.environment]
  NODE_VERSION = "24.12.0"

[functions]
  directory = "functions"

[functions.esbuild]
  format = "esm"


# ================================
# API → Express serverless function
# ================================

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true


# ================================
# Clean page URLs
# ================================
# Clean URLs are generated per host into dist/_redirects by
# scripts/build-split.mjs, because each host only serves its own pages and the
# cross-host 301s have to be evaluated before the rewrites.

# ================================
# Root handling
# ================================
# This file deploys to BOTH learn-hanverse and hanverse. A root redirect here
# would loop on the marketing host, and Netlify redirect conditions support
# Language, Country and Role but not Host. The app host's "/" -> marketing 301
# is therefore written into dist/_redirects only when SITE_TARGET=app.